      msg:"你开始留意所有能报名的东西：遴选、跟班学习、专班抽调。\n\n你报了四次，成了一次。\n\n那一次去的是市里一个临时专班，三个月，累得脱形。但从那以后，你的通讯录跟同批那十三个人不再是同一个量级。" },
    { t:"发条消息，跟那个人聊聊", cost:1, eff:{network:8},
      msg:"你说恭喜，他说别，来了才知道更累。\n\n你们聊了四十分钟，他跟你说了三件在群里绝对不会说的事。\n\n这四十分钟以后有用。很多年以后，你需要一个人在市委大院里帮你确认一件小事的时候，他还在。" },
    { t:"退出群聊", eff:{family:5,health:3,network:-6},
      msg:"你没有退，只是把它设成了免打扰。这两者的区别你自己心里清楚。\n\n从那以后你不再知道谁提了、谁走了、谁离婚了。\n\n日子安静了很多。你偶尔觉得这样挺好，偶尔不。" },
  ]},

/* ---------- 山头 · 灰色通道 · 花钱的地方 ---------- */
{ id:"circle_in", w:11, cond:s=>s.rank>=3 && s.age>=34 && !s.flags.circleAsked && !s.circle.in, once:true, tag:"抉择",
  title:"引荐",
  text:`一个很小的饭局，四个人。带你去的人在楼下就交代过：今天不谈事，就是认个脸。\n\n席间那位话不多，问了你两个问题，都不是工作上的。临走时他握了握你的手，说：以后有什么难处，跟小周说一声。\n\n回去的路上，带你去的人在车里说了一句：\n\n「这个圈子，进来了就出不去。但你在外面，也走不远。」\n\n他还提了另一位——管人事的那条线，比这位稳，但也没这位管用。`,
  opts:[
    { t:"跟那位管钱的。要走就走近路", cost:2, eff:{network:20,risk:-12},
      fn:s=>{ s.circle={ in:true, name:"管钱的那位", depth:2, since:s.year,
                doomed:chance(0.58), fell:false, fallAt:ri(6,15) };
        s.flags.circleAsked=true; s.flags.circleIn=true;
        s.pendMsg="你敬了三杯酒，最后一杯是站着喝的。\n\n从那天起，有些事你不用自己开口了。有一次纪委下来核查一笔账，你还没听说这件事，它就已经过去了。\n\n【你有了山头 · 从今往后，很多麻烦在你知道之前就被摆平了】"; } },
    { t:"跟管人事的那条线。稳一点", cost:2, eff:{network:12,risk:-5,merit:3},
      fn:s=>{ s.circle={ in:true, name:"管人事的那位", depth:1, since:s.year,
                doomed:chance(0.26), fell:false, fallAt:ri(8,18) };
        s.flags.circleAsked=true; s.flags.circleIn=true;
        s.pendMsg="你去了两次，第二次才见到人。谈的全是务虚的东西。\n\n这条线给不了你钱，但你的名字从此会出现在一些你看不到的讨论里。\n\n【你有了山头 · 位置上的事，有人替你说话】"; } },
    { t:"酒喝了，门没认", eff:{network:-11,risk:4},
      fn:s=>{ s.flags.circleAsked=true; },
      msg:"你喝了不少，话说得很漂亮，但从头到尾没有接那句「有什么难处」。\n\n带你去的人后来再没约过你。\n\n你不确定自己是不是错过了什么。这个念头在后来的二十年里，每隔几年就会冒出来一次。" },
  ]},

{ id:"circle_favor", w:11, cd:4, cond:s=>s.circle.in && !s.circle.fell && s.rank>=3, tag:"风险",
  title:"圈里的事",
  text:s=>{
    const d = Math.round(s.circle.depth);
    if(d <= 4) return `小周打来电话，第一句是问你身体，第二句就到了正题：有个事，想请你「顺手看一下」。\n\n事情本身不大，在你的权限里，甚至算不上违规——只是如果不是他开口，你不会这么办。\n\n他最后说：上次那个事，也是上面替你压下去的。`;
    if(d <= 9) return `又是那个号码。\n\n这几年你替他们办过的事，你自己都记不清了。你只记得每一次办完，都会有另一件麻烦悄悄消失。\n\n这一次的事比以往都大一点。小周在电话里停顿了一下，说：这个你要是为难，我再想办法。\n\n你听得出来，这句话是客气。`;
    return `电话响的时候你正在开会，你走出去接的。\n\n这些年是一条越走越窄的路：你替他们办的每一件事，都成了下一件事的理由。\n\n这次连事由都懒得编了，小周直接说：老规矩。\n\n你忽然想起很多年前车里那句话——进来了就出不去。当时你以为那是句客套。`;
  },
  opts:[
    { t:"办了。反正这些年都是这么过来的", cost:2, eff:{risk:-17,merit:-4},
      fn:s=>{ s.circle.depth += 2.6; },
      msg:"你打了两个电话，事情就办完了，前后不到二十分钟。\n\n三个月后，一封反映你的信在某个环节停了下来，你至今不知道是谁摁的。\n\n你们之间从来不说「交换」这两个字。但账，两边都记着。" },
    { t:"办，但把过程留了痕", cost:3, eff:{risk:-9,merit:-2,health:-4},
      fn:s=>{ s.circle.depth += 1.4; s.flags.tape = true; },
      msg:"你按他说的办了，但每一步都留了记录：谁开的口、谁签的字、哪一天。\n\n你把这些存在一个只有你知道的地方。\n\n你希望这辈子都用不上它。你也知道，会走到这一步的人，通常都用得上。" },
    { t:"推了。这个忙帮不了", cost:1, eff:{network:-13,risk:6},
      fn:s=>{ s.circle.depth = Math.max(0, s.circle.depth - 1.5); },
      msg:"你说了三个理由，一个比一个正当。\n\n小周说：理解，理解。挂了电话。\n\n那年年底有个位置，本来是有你的。你后来才知道，讨论到你的时候，有人只说了半句话：他这个人，不太好用。" },
  ]},

{ id:"circle_fall", w:0, force:true, tag:"危 机",
  title:"塌方",
  text:s=>`早上七点四十，你还没到单位，电话就响了。\n\n${s.circle.name}被带走了。\n\n跟着他一起进去的还有十一个人，名单在中午之前就传开了。你把那份名单从头看到尾，看了三遍——你不在上面。\n\n但你比谁都清楚，那只是因为还没排到你。\n\n这些年你替他们办过的事，一件一件浮上来。你甚至能回忆起每一次挂电话时自己在想什么。`,
  opts:[
    { t:"一个字都不说，等", cost:3, eff:{health:-14,network:6},
      fn:s=>{ const back = 10 + s.circle.depth*3.4;
        s.risk = cl(s.risk + back, 0, 140); s.circle.fell = true; s.flags.circleFell = true;
        s.pendMsg="你什么也没做，照常上班，照常开会。\n\n那两个月你瘦了十四斤，每天早上醒来的第一件事是看手机上有没有陌生来电。\n\n有人因为你的沉默高看你一眼。也有人因此在名单上，把你和那十一个人画在了同一个圈里。\n\n【风险 +"+back.toFixed(0)+"】"; } },
    { t:"主动去说清楚，退掉该退的", cost:4, eff:{merit:-20,network:-26,health:-9},
      fn:s=>{ const grey = s.grey || 0;
        s.money = Math.max(0, s.money - grey*0.75);
        s.flags.shareIncome = 0; s.grey = 0;
        s.risk = cl(s.risk*0.28, 0, 140);
        s.circle.fell = true; s.flags.circleFell = true; s.flags.confessed = true;
        s.pendMsg="你自己走进了那栋楼，带着一个整理了三个晚上的本子。\n\n谈了很多天，退了很多东西。降级、处分、通报，一样没少。\n\n从那栋楼里出来的下午下着小雨，你没打伞。你在门口站了一会儿，第一次觉得雨挺好闻的。\n\n【退赔 "+(grey*0.75).toFixed(0)+" 万 · 风险大幅下降 · 前程基本到此为止】"; } },
    { t:"把那份录音交上去", cost:2, eff:{network:-34,merit:6},
      cond:s=>s.flags.tape,
      fn:s=>{ s.flags.tape=false; s.flags.tapeUsed=true;
        s.risk = cl(s.risk*0.45, 0, 140); s.circle.fell = true; s.flags.circleFell = true;
        s.pendMsg="你把那个文件夹交了上去。里面的东西比办案的同志预期的要完整得多。\n\n你没有被追究。名单出来的时候，你的名字后面跟着四个字：另案处理——最后不了了之。\n\n很多年后，还有人在饭桌上提起这件事。他们不提你的名字，只说「那个人」。\n\n【风险大幅下降 · 但这个系统里再没有人敢跟你交底】"; } },
  ]},

{ id:"fixer", w:10, cd:6, cond:s=>s.risk>=34 && s.money>=80 && s.rank>=3, tag:"风险",
  title:"还有的谈",
  text:s=>`有人带话过来：你那个事，「还有的谈」。\n\n对方开的价不便宜，但比起后果，这个数字看起来相当合理。\n\n合理到你怀疑自己是不是已经不太会算账了。`,
  opts:[
    { t:"花这个钱，把事情按下去", cost:2,
      fn:s=>{ const cost = Math.min(s.money*0.55, 45 + 14*s.rank);
        s.money = Math.max(0, s.money - cost);
        if(chance(0.68)){ s.risk = cl(s.risk - 22, 0, 140);
          s.pendMsg="钱是分三次给的，中间隔了很久。\n\n后来那件事真的没有下文了。\n\n你花了 "+cost.toFixed(0)+" 万，买回来的东西没有名字，也没有凭据。你只能通过「什么都没发生」来确认它生效了。\n\n【花 "+cost.toFixed(0)+" 万 · 风险 −22】"; }
        else { s.risk = cl(s.risk + 15, 0, 140);
          s.pendMsg="钱给出去了。\n\n三个月后，你从另一个渠道听说，那个人根本递不上话——他只是知道你怕。\n\n更糟的是，现在多了一个人知道你怕。\n\n【花 "+cost.toFixed(0)+" 万 · 风险 +15】"; } } },
    { t:"不花。花了就等于承认了", eff:{risk:3,health:-6},
      msg:"你把带话的人客气地送走了。\n\n那天晚上你在阳台上站到两点。你反复算的不是钱，是概率。\n\n你最后想通的一件事是：这笔钱真正买的不是平安，是接下来几年能睡着觉。而这个东西，你已经买不起了。" },
    { t:"不花，而且把这个人报上去", cost:2, eff:{risk:-14,merit:9,network:-20},
      msg:"你把带话的人和他说过的每一句话，写成了一份情况反映。\n\n事情查了半年，那个人确实是骗子，处理了。\n\n你干净了一点，也孤立了很多。从那以后，再没有人来跟你「谈」任何事——包括那些本来可能帮到你的。" },
  ]},

{ id:"land", w:7, pri:s=>1 + s.rank*0.30 + (s.risk>=25?0.9:0) + (s.circle.in&&!s.circle.fell?0.5:0), cd:12, cond:s=>s.rank>=6 && s.risk>=22, tag:"风险",
  title:"一块地",
  text:`城东那块地的性质要调整，工业改商住。\n\n从流程上说，这件事需要一次会议、四个签字、和一份专家论证。四个签字里，有一个是你的。\n\n没有人跟你谈钱。来的人只说了一句：「这个事办成了，您以后就不用再操心这些了。」\n\n您以后就不用再操心这些了——你在心里把这句话拆开看了很久。`,
  opts:[
    { t:"签", eff:{bribe:36,risk:64,network:14},
      fn:s=>{ s.flags.landDeal = true; },
      msg:"会开得很顺，四十分钟结束。\n\n你签字的时候手很稳，稳到你自己都有点吃惊。\n\n那笔钱到的时候你没有数，因为数不过来。你把它分在了几个地方，其中有些连家里人都不知道。\n\n从那天起，你每次经过城东那片工地，都会不自觉地转过头去看一眼。" },
    { t:"签，但让主管副职先签", eff:{bribe:17,risk:38,merit:-6},
      fn:s=>{ s.flags.landDeal = true; s.flags.scapegoat = true; },
      msg:"你让分管的副职先签，你在最后一个。程序上完全说得通。\n\n钱少了一半多，但你要的从来不是那一半。\n\n多年后这件事被翻出来，第一个被找去谈话的不是你。你在办公室听着走廊里的脚步声经过你的门口，没有停。" },
    { t:"不签。让它按工业地走完流程", eff:{merit:12,network:-24,risk:-8},
      msg:"你在会上说了三条理由，条条都在文件里找得到出处。\n\n没有人反驳你，会就这么散了。\n\n那块地后来空了六年。六年里，有三个人在不同场合跟你说过同一句话：当年你要是签了，现在就不一样了。\n\n你每次都笑笑。你也确实不知道会不一样在哪里。" },
  ]},

/* ---------- 花钱的地方：不贪，你就付不起 ---------- */
{ id:"intschool", w:13, cond:s=>kidAge(s)>=6 && kidAge(s)<=11 && s.rank>=3 && !s.flags.kidIntlAsked, once:true, tag:"家庭",
  title:"国际学校",
  text:s=>`{配偶}拿回来一份招生简章，城西那所国际学校。\n\n小班、外教、直接对接海外大学。{TA}说，隔壁老陈家的孩子今年去了，说好得很。\n\n你翻到最后一页看学费：一年二十二万，还不含住宿和游学。\n\n你现在存款 ${s.money.toFixed(0)} 万。你算了一下，供到高中毕业要一百七十万左右。\n\n{配偶}没有催你，只是把简章放在了茶几上，一放放了三个星期。`,
  opts:[
    { t:"供。砸锅卖铁也供", cost:1, eff:{family:16,health:-4},
      fn:s=>{ s.flags.kidIntl = true;
        s.pendMsg="你签字那天，{配偶}哭了一下，很快就收住了。\n\n{子女}穿上校服的样子确实好看。你拍了张照片，设成了手机壁纸，用了六年。\n\n从这一年起，你每年的账上要先划走二十二万。你没有跟任何人说过，这个数字比你的年薪高。\n\n【每年支出 +22 万 · 供到高中毕业】"; } },
    { t:"上公立。我们那会儿不也这么过来的", eff:{family:-15,money:0},
      fn:s=>{ s.flags.kidPublic = true;
        s.pendMsg="你讲了很多道理，讲得都对。\n\n{配偶}听完只说了一句：行，你说了算。然后把简章收进了抽屉。\n\n那本简章在抽屉里放了很多年。有一次搬家你翻出来，纸都黄了，{TA}说扔了吧，然后自己捡起来扔的。\n\n【家庭 −15 · 有些账不是这一年算的】"; } },
    { t:"想想办法。这个钱总能凑出来", cost:2, eff:{risk:24},
      fn:s=>{ const got = Math.round(9*bribeMul(s)*10)/10;
        s.money += got; s.grey = (s.grey||0) + got; s.flags.kidIntl = true;
        s.pendMsg="你没有细想「办法」这两个字的含义，你只是打了几个电话。\n\n钱来得比你想象的容易，容易到让你有点恍惚。\n\n{子女}第一天放学回来，说学校的午餐有三种主食可以选。你「嗯」了一声，低头继续吃饭。\n\n【进账 "+got.toFixed(0)+" 万 · 风险 +24 · 每年支出 +22 万】"; } },
  ]},

{ id:"intschool_bill", w:15, cond:s=>s.flags.kidIntl && s.money<45 && kidAge(s)<=17, cd:3, tag:"家庭",
  title:"下学期的学费",
  text:s=>`财务处发来缴费通知，下学期二十二万，两周内。\n\n你打开手机银行看了一眼，账上 ${s.money.toFixed(0)} 万。\n\n{配偶}问你有没有事，你说没事。`,
  opts:[
    { t:"退学，转回公立", eff:{family:-22,health:-6},
      fn:s=>{ s.flags.kidIntl = false; s.flags.kidDropped = true;
        s.pendMsg="办手续那天{子女}没哭，只是问了一句：是不是我做错什么了。\n\n你说不是，是爸爸的问题。\n\n这是你这辈子说过的最诚实的一句话，也是最难说出口的一句。\n\n【每年支出 −22 万 · 家庭 −22】"; } },
    { t:"借。找人周转一下", eff:{family:-4,network:-10,risk:8},
      fn:s=>{ s.money += 26; s.flags.owes = true;
        s.pendMsg="你开了三次口，第三次才借到。\n\n对方转账的时候没问用途，只说了句「不急」。\n\n「不急」这两个字，后来变成了你欠他的全部内容——它没有期限，也就永远还不完。\n\n【借到 26 万 · 但你欠下了一个说不清的人情】"; } },
    { t:"打那个电话。总有人愿意帮忙", cost:1, eff:{risk:30},
      fn:s=>{ const got = Math.round(11*bribeMul(s)*10)/10;
        s.money += got; s.grey = (s.grey||0) + got;
        s.pendMsg="你翻通讯录翻了很久，最后停在一个很久没打过的号码上。\n\n对方接得很快，好像一直在等。他说：这算什么事。\n\n钱当天就到了，比你要的多。\n\n多出来的那部分，才是真正的问题——它意味着这不是最后一次。\n\n【进账 "+got.toFixed(0)+" 万 · 风险 +30】"; } },
  ]},

{ id:"parent_ward", w:11, cond:s=>s.age>=48 && s.age<=64 && !s.flags.parentGone && !s.flags.wardAsked, once:true, tag:"家庭",
  title:"特护病房",
  text:s=>`母亲住院第十九天，医生建议转特护。\n\n一天一千八，一个月五万四，而且看不到头。普通病房也能住，只是六个人一间，夜里没人管。\n\n你在缴费窗口前面站着，前面还有四个人。你算了一遍自己的存款：${s.money.toFixed(0)} 万。`,
  opts:[
    { t:"转。这个钱不能省", eff:{money:-46,family:14,health:-7},
      msg:"她在特护住了八个月。\n\n那八个月你每周去三次，每次待四十分钟，因为四十分钟之后你就必须回单位。\n\n她走的时候你在开会。护士打电话说人很安详，你「嗯」了一声，回会议室继续把那个议题讨论完了。\n\n这件事你后来想过很多次。" },
    { t:"住普通病房，我多跑几趟", eff:{family:-11,health:-13,merit:-5},
      msg:"你开始每天下班往医院跑，跑了七个月。\n\n六人间的夜里很吵。有一次你在陪护椅上睡着，醒来发现她在看着你，什么也没说。\n\n后来你才知道，那天她已经说不出话了。" },
    { t:"想办法弄一笔", cost:1, eff:{risk:26,family:12},
      fn:s=>{ const got = Math.round(6*bribeMul(s)*10)/10;
        s.money += got; s.grey = (s.grey||0) + got;
        s.pendMsg="你只打了一个电话，第二天钱就到了。对方甚至没让你把话说完。\n\n母亲转进特护那天，你在走廊上坐了很久。\n\n你不后悔。你只是很清楚地知道，从今天起，你为她做的这件事，和你为她做过的所有别的事，性质已经不一样了。\n\n【进账 "+got.toFixed(0)+" 万 · 风险 +26】"; } },
  ]},

{ id:"facecost", w:9, cd:7, cond:s=>s.rank>=4, tag:"生活",
  title:"场面",
  text:s=>`这个级别有些开销是躲不掉的：随礼的规格、回请的档次、逢年过节该走的那几家。\n\n你算了算今年这些花掉多少：${(SALARY[s.rank]*0.55).toFixed(0)} 万，是你工资的一半还多。\n\n你不花，别人不会说什么。别人只是会渐渐不叫你。`,
  opts:[
    { t:"照规矩来，该花花", eff:{money:-11,network:11},
      msg:"你把该走的都走了，一家没落。\n\n这些钱换来的东西说不清楚，但你知道它是真的——因为有一年家里出了急事，两天之内有五个人打电话过来问要不要帮忙。" },
    { t:"能省则省，量力而行", eff:{network:-13,family:6,health:3},
      msg:"你减了一半，用的理由都很得体。\n\n没有人当面说什么。只是那年之后，一些饭局的通知开始晚一点才到你这儿，晚到你去不了。\n\n后来干脆不到了。" },
    { t:"这些钱不该我自己出", cost:1, eff:{risk:21,network:9},
      fn:s=>{ const got = Math.round(3.5*bribeMul(s)*10)/10;
        s.money += got; s.grey = (s.grey||0) + got;
        s.pendMsg="你没有开口要，只是有一次在饭桌上感慨了一句这些年应酬的花销。\n\n第二天就有人把事情办妥了，办得很干净——从此这一类的账，都不再经过你的手。\n\n这比直接给你钱更让你不安。因为你现在连自己花了多少、欠了多少，都不知道了。\n\n【进账 "+got.toFixed(0)+" 万 · 风险 +21】"; } },
  ]},

/* ---------- 提成线：一条越走越大的路 ---------- */
{ id:"broker1", w:12, pri:s=>1 + s.rank*0.25, cond:s=>s.rank>=4 && !s.flags.brokerAsked && !s.flags.brokerLvl, once:true, tag:"风险",
  title:"第一个项目",
  text:s=>`一个做工程的老板托人约你吃饭，第三次你才去。\n\n他要的东西很具体：城北片区那个标段，评审会上有你一票。他没有说「给你多少」，他说的是「按行规，两个点」。\n\n那个标段的盘子不小。他说的「两个点」，折下来是 ${(12*bribeMul(s)).toFixed(0)} 万上下——你需要不吃不喝干${Math.round(12*bribeMul(s)/SALARY[s.rank])}年。\n\n他把茶杯往你这边推了推，说：${RANKS[s.rank]}，这行的规矩就是这样，不是我一个人定的。`,
  opts:[
    { t:"在评审会上说了那句话", cost:2, eff:{bribe:12,risk:30,network:9},
      fn:s=>{ s.flags.brokerLvl=1; s.flags.brokerAsked=true; s.flags.brokerYear=s.year; },
      msg:"你说的那句话很短，短到会议纪要里只有半行。\n\n钱是三个月后到的，不是从他手上来的。\n\n到账那天你在办公室坐着，把手机银行打开又关掉，前后看了七次。\n\n那不是你的工资单上会出现的数字。那是另一种东西——你第一次意识到，这个世界上的钱，原来是分种类的。" },
    { t:"帮忙，但一分钱不要", cost:2, eff:{network:16,risk:11,merit:-4},
      fn:s=>{ s.flags.brokerAsked=true; s.flags.freeFavor=true; },
      msg:"你帮了，钱推了三次，推掉了。\n\n他很意外，后来跟人说：这个人不一样。\n\n你自己知道哪里不一样，哪里又一样。你没收钱，但你确实动了那一票。\n\n这个区别对纪委来说不算区别，对你自己来说是。" },
    { t:"这个饭我不该来", eff:{network:-14,risk:-6,merit:5},
      fn:s=>{ s.flags.brokerAsked=true; },
      msg:"你放下杯子就走了，走得有点急，外套落在了椅背上。\n\n第二天秘书把外套送了过来，口袋里多了一张卡。你让秘书原样退了回去。\n\n那个标段最后给了别人。你后来在工地围挡外面站过一次，什么也没想。" },
  ]},

{ id:"broker2", w:14, cd:3, pri:s=>1 + s.rank*0.3, cond:s=>s.flags.brokerLvl===1 && s.rank>=4, once:true, tag:"风险",
  title:"他带了个朋友来",
  text:s=>`还是那家馆子，这次多了一个人。\n\n新来的这位做的盘子更大，说话也更直接：「上次那个事办得漂亮。我这边有三个项目，一个比一个大。」\n\n他报了个数。那个数字后面的零，你数了两遍。\n\n${s.flags.kidIntl ? "你想起下学期的学费还没交。" : s.money < 60 ? "你想起你账上还剩不到六十万。" : "你不缺这笔钱。这让你更难解释自己为什么还在听。"}`,
  opts:[
    { t:"三个都接了", cost:3, eff:{bribe:26,risk:36,network:14},
      fn:s=>{ s.flags.brokerLvl=2;
        s.pendMsg="三个项目跨了两年，你一共说了不到十句话。\n\n钱不再是分两笔到账了，是一个人拎着东西到你家楼下，打电话让你下来拿。\n\n你下楼的时候特意换了双旧鞋。你也不知道为什么要换鞋。\n\n那年你换了车、还清了房贷、给你妈换了个带电梯的房子。你母亲问钱哪来的，你说单位效益好。\n\n她信了。她那么容易就信了。"; } },
    { t:"只接一个，试试水", cost:2, eff:{bribe:11,risk:22},
      fn:s=>{ s.flags.brokerLvl=1; s.flags.brokerSlow=true;
        s.pendMsg="你只点了头一次，另外两个推给了别人。\n\n他没有不高兴，反而说：张处谨慎，这是好事。\n\n后来你才明白这句话的意思——他夸的不是你的人品，是你还能用多久。"; } },
    { t:"到此为止", cost:1, eff:{network:-18,risk:-9},
      fn:s=>{ s.flags.brokerLvl=0; s.flags.brokerOut=true;
        s.pendMsg="你说得很客气，理由是身体不好。\n\n他们也很客气，说理解，以后还是朋友。\n\n此后再没有人找过你。你安全了，但你偶尔会算一笔账：如果那三个项目都接了，现在会是什么样。\n\n这笔账你算过很多次，每次都算得很清楚。"; } },
  ]},

{ id:"broker3", w:15, pri:s=>1.4 + s.rank*0.3, cond:s=>s.flags.brokerLvl>=2 && s.rank>=5, once:true, tag:"风险",
  title:"你的名字成了一块牌子",
  text:`一个你不认识的人，在一场你没参加的饭局上，用了你的名字。\n\n事情办成了。三天后有人送来一份「顾问费」，你连那个项目叫什么都不知道。\n\n你忽然明白了一件事：到了这一步，你已经不需要做任何事了。\n\n你只需要存在。`,
  opts:[
    { t:"默许。这钱不接白不接", cost:2, eff:{risk:44,network:11},
      fn:s=>{ const yearly = Math.round(4.5*bribeMul(s)*10)/10;
        s.flags.brokerLvl=3; s.flags.brokerName=true;
        s.flags.shareIncome = (s.flags.shareIncome||0) + yearly;
        s.pendMsg="你什么也没说，钱收下了。\n\n从那年起，每年都有几笔来路不同的钱进来，加起来是个稳定的数。你甚至开始能预估它——像预估工资一样。\n\n你在一个本子上记过一次账，记到一半就撕了。不是怕，是因为那个总数让你自己都愣了一下。\n\n【每年额外进账 "+yearly.toFixed(0)+" 万 · 风险每年持续累积】"; } },
    { t:"放话出去：谁再用我的名字，我办谁", cost:3, eff:{risk:-16,network:-24,merit:9},
      fn:s=>{ s.flags.brokerLvl=1;
        s.pendMsg="你在一个不大不小的场合把话说重了，重到当场有人脸色变了。\n\n话传得很快。此后确实没有人再用你的名字。\n\n也没有人再在任何场合替你说话。你把一扇门关上了，关的时候没想清楚门后面还连着什么。"; } },
    { t:"把这笔顾问费交了，同时打报告", cost:3, eff:{risk:-30,merit:14,network:-30},
      fn:s=>{ s.flags.brokerLvl=0; s.flags.confessed=true; s.flags.brokerOut=true;
        s.pendMsg="你交了钱，写了一份很长的情况说明，把前面那两次也一并写了进去。\n\n组织上给了处分，不重。真正重的是之后那些年——每一次有你的名字出现在讨论里，都会有人补一句「他那个事」。\n\n你干净了。你也就到这儿了。"; } },
  ]},

{ id:"broker_cash", w:12, cd:5, cond:s=>s.flags.brokerLvl>=2 && s.money>=280, tag:"风险",
  title:"钱太多了",
  text:s=>`你账上有 ${s.money.toFixed(0)} 万。\n\n这个数字本身不是问题，问题是它没法解释。你的工资条、你的公积金、你申报的那几行，加起来撑不住这个数的十分之一。\n\n你在书房坐了一晚上，第一次认真地想一个问题：这些钱，到底怎么才能变成「我的」。`,
  opts:[
    { t:"找人代持，房子和股份都挂到别人名下", cost:2, eff:{risk:-18},
      fn:s=>{ const cut = Math.round(s.money*0.12);
        s.money = Math.max(0, s.money - cut); s.flags.nominee=true;
        s.pendMsg="你找了两个人，都是这些年你最信得过的。\n\n手续办得很干净，干净到连你自己都要翻本子才能记起哪一样在谁名下。\n\n代价是 "+cut+" 万的「辛苦费」，还有一件你没敢细想的事——从今天起，有两个人手里攥着你的命。\n\n【风险 −18 · 但你把把柄交出去了】"; } },
    { t:"分散着买房，越多越好", cost:1, eff:{risk:8},
      fn:s=>{ s.flags.manyHouses=true;
        s.pendMsg="你把钱换成了几处不动产，一处也不在你名下。\n\n钥匙装在一个铁盒里，你有时候会打开数一数。\n\n房子是好东西——它不会说话，也不会被冻结。它只是很难在需要的时候变回钱。"; } },
    { t:"什么都不做。钱放着就放着", eff:{risk:5,health:-5},
      msg:"你决定不动。\n\n从那以后你睡得越来越轻。有一次银行打电话来推销理财，你在电梯里听到自己的名字，后背瞬间就湿了。\n\n那笔钱一直躺在那儿，像一件你脱不掉也穿不上的衣服。" },
  ]},

/* ---------- 钱能买到的东西 —— 也正是它让人停不下来 ---------- */
{ id:"bighouse", w:12, cond:s=>s.money>=210 && s.age>=38 && !s.flags.bigHouse, once:true, tag:"生活",
  title:"江边那套",
  text:s=>`中介带你去看了城南江边那套大平层，两百六十平，落地窗正对着江。\n\n${s.flags.married?"{配偶}站在窗前站了很久，回头笑了一下，什么也没说。":"你一个人在客厅里走了两圈，脚步声有回音。"}\n\n一千八百万，你现在拿得出首付和大部分尾款——一百八十万上下就能拿下，剩下的走「内部价」。\n\n你账上有 ${s.money.toFixed(0)} 万。`,
  opts:[
    { t:"买", eff:{money:-180,family:22,health:7},
      fn:s=>{ s.flags.bigHouse=true; },
      msg:s=>"搬家那天下午阳光很好，江面上有货船慢慢过去。\n\n"+(s.flags.married?"{配偶}在阳台上摆了三盆花，说这个房子好，站在这儿看得远。":"你一个人在阳台上站了很久。江面很宽，看得很远。")+"\n\n你这辈子第一次觉得，那些说不清的钱，有了一个说得清的样子。\n\n只有一件事你没跟任何人说：这套房的手续，你锁在了另一个抽屉里。\n\n【家庭大幅回升 · 身体状况改善】" },
    { t:"太扎眼了。再等等", eff:{family:-6,risk:-4},
      msg:"你说了一堆理由：太大、太远、物业费贵。\n\n那份资料在茶几上又放了两个星期，然后被收进了抽屉。\n\n那套房后来涨了三倍。你偶尔开车经过江边，会不自觉地放慢速度。" },
  ]},

{ id:"bestcare", w:12, cond:s=>s.money>=140 && s.age>=52 && s.health<=72 && !s.flags.privateCare, once:true, tag:"身体",
  title:"最好的那位",
  text:s=>`你的体检报告已经连着三年有红字了。\n\n有人给你介绍了省里最好的那位，私立诊所，一次两万八，全套跟到底：营养师、康复师、每季度一次全身评估。\n\n一年下来大概八十万。你账上有 ${s.money.toFixed(0)} 万。`,
  opts:[
    { t:"办。命是自己的", eff:{money:-80,health:20},
      fn:s=>{ s.flags.privateCare=true; },
      msg:"三个月后你的报告第一次全白。\n\n医生说你底子还行，就是这些年亏得太狠了。\n\n你现在每周有两个下午是空出来的，谁也不见。你在那两个下午里学会了一件事：原来不看手机是能做到的。\n\n【身体大幅回升 · 此后衰减放缓】" },
    { t:"不去了。单位体检也一样", eff:{health:-6,money:0},
      msg:"你把介绍信压在了抽屉底下。\n\n道理你都懂，你只是习惯了把自己排在所有事情的后面。\n\n那份报告后来的红字越来越多。你每年都看一眼，然后合上。" },
  ]},

{ id:"spouse_quit", w:11, cond:s=>s.money>=190 && s.flags.married && s.age>=45 && !s.flags.spouseQuit, once:true, tag:"家庭",
  title:"不用上班了",
  text:`{配偶}这些年一直在原单位，工资不高，班上得不轻。\n\n有天晚上{TA}揉着肩膀说了一句：还有十二年。\n\n你算了算你账上的钱，忽然发现这件事你今天就能解决。`,
  opts:[
    { t:"跟{TA}说：辞了吧，家里养得起", eff:{money:-55,family:24,health:5},
      fn:s=>{ s.flags.spouseQuit=true; },
      msg:"{TA}愣了很久，说：真的？\n\n你说真的。\n\n{TA}辞职那天回来做了一桌菜，比过年还多。吃到一半{TA}放下筷子说了一句：这些年，辛苦你了。\n\n你「嗯」了一声，没敢抬头。因为你知道这句话该由谁来说。\n\n【家庭大幅回升】" },
    { t:"还是再干几年，稳一点", eff:{family:-8},
      msg:"你说了「稳一点」这三个字。\n\n{TA}说好，然后再没提过。\n\n{TA}一直干到退休。退休那天你在外地开会，是打电话说的恭喜。" },
  ]},

{ id:"kid_best", w:13, cond:s=>kidAge(s)>=16 && kidAge(s)<=22 && s.money>=260 && !s.flags.kidBest, once:true, tag:"家庭",
  title:"最好的那条路",
  text:s=>`{子女}的成绩不上不下，国内能上个不错的一本。\n\n有人给你指了另一条路：先去读预科，再申请海外前三十，四年下来两百三十万左右，还不算生活费。\n\n这条路你们家在十年前是想都不敢想的。现在你账上有 ${s.money.toFixed(0)} 万。`,
  opts:[
    { t:"走。别让{TA子}再走一遍我的路", eff:{money:-230,family:20},
      fn:s=>{ s.flags.kidBest=true; s.flags.kidAbroad=true; },
      msg:"送机那天{子女}回头挥了两次手。\n\n{TA子}后来发来的照片里，草坪很大，天很蓝，笑容是你没见过的那一种。\n\n你把照片存了下来，设成了屏保。\n\n只有一件事你没告诉任何人：那两百三十万里，有一百多万你说不清来路。你把{TA子}送出去了，也把这件事永远留在了这边。\n\n【家庭大幅回升 · 子女走了另一条路】" },
    { t:"国内挺好的。踏实", eff:{family:-9,merit:3},
      msg:"你讲了很多道理，讲得都对。\n\n{子女}没有争，只是那年暑假很少在家。\n\n很多年后你们喝酒，{TA子}提了一句：当年要是出去了，也不知道会怎么样。说完就笑了，说随口一说。\n\n你也笑了，说是啊。" },
  ]},

/* ---------- 作风线：处级以后才会遇到的另一种诱惑 ---------- */
{ id:"fangka", w:10, cd:9, pri:s=>1 + (s.rank-3)*0.22, cond:s=>s.rank>=3 && s.age<=58, tag:"风险",
  title:"房卡",
  text:s=>{
    const t = nth("fangka");
    if(t<=1) return `考察的最后一晚，饭局散得很晚。\n\n回房间脱外套的时候，你从口袋里摸出一张房卡。不是你的那间，房号比你高两层。\n\n没有纸条，没有留言。放的人知道你能看懂。\n\n你在床沿上坐了很久，手里捏着那张卡，一直捏到它不凉了。`;
    return `又一张。\n\n这些年你已经能一眼分辨这种事了。第一次你在床沿上坐了半宿，这一次你只用了两秒——你甚至先想的是，这一层楼有没有摄像头。\n\n你把卡放在台灯下面看了两秒，第一个念头不是要不要去，是这一层楼有没有摄像头。`;
  },
  opts:[
    { t:"第二天早上，交到前台", eff:{merit:4,risk:-4,network:-7},
      msg:"你交卡的时候说了句「捡的」，前台小姑娘看了你一眼，没接话。\n\n那天返程的车上，安排这件事的人跟你聊了一路的天气。\n\n他没有生气。他只是从此再没有单独跟你谈过任何事。" },
    { t:"揣着，但没去", eff:{risk:9,network:6,health:-4},
      msg:"你把卡放在了行李箱夹层，一直放到回家。\n\n你没有用它。你也没有交出去。\n\n这两件事之间的那段距离，后来你想了很多年——在纪委的口径里，这段距离是不存在的。" },
    { t:"上了两层楼", cost:1, eff:{risk:30,family:-14,health:-4,network:9},
      fn:s=>{ s.flags.affair = true; s.flags.affairYear = s.year;
        s.pendMsg="电梯上升的那十几秒里，你什么都没想。你后来反复回忆，确实什么都没想。\n\n第二天的会你开得比平时都专注。\n\n回程的车上，安排这件事的人给你递了瓶水，说了句「"+RANKS[s.rank]+"辛苦」。那四个字的语气跟前一天不太一样了——从那天起，你和他之间的关系变了，你在下，他在上。\n\n【风险 +30 · 从今往后，有人手里有你的东西】"; } },
  ]},

{ id:"xinlai", w:11, pri:s=>1 + (s.rank-3)*0.2, cond:s=>s.rank>=4 && s.age>=42 && s.age<=58 && !s.flags.xinlaiAsked, once:true, tag:"抉择",
  title:"新来的",
  text:`办公室新调来一个年轻人，二十七八，材料写得漂亮，人也机灵。\n\n{TA}对你格外热情：早上第一杯茶、你没说出口的会议材料、你随口提过一次的胃药。\n\n这些事本身都很正常。不正常的是，你开始留意{TA}今天穿了什么。\n\n有天加班到很晚，{TA}把改好的稿子送进来，站在桌边没走。`,
  opts:[
    { t:"把稿子接过来，说：早点回去", eff:{merit:6,family:5,network:-3},
      fn:s=>{ s.flags.xinlaiAsked=true; },
      msg:"{TA}「哦」了一声，走了。\n\n后来{TA}还是把稿子改得很好，只是不再送到你办公室，而是发在系统里。\n\n三年后{TA}调走了，去了一个更好的位置。走之前给你发了条消息：谢谢您那几年教我写材料。\n\n你回了两个字：应该。你盯着屏幕看了很久才发出去。" },
    { t:"用心带{TA子}，但守着那条线", cost:2, eff:{merit:9,network:11},
      fn:s=>{ s.flags.xinlaiAsked=true; s.flags.protege=true;
        s.pendMsg="你把{TA}当成正经的苗子来带：带{TA}去见人、把好的机会给{TA}、也当众骂过{TA}两次。\n\n有一次别人开你们的玩笑，你当场把脸沉下来了，桌上就没人再提。\n\n很多年后{TA}已经是正处，在一个你需要人帮忙的场合替你说了一句话。那句话不重，但说得很及时。\n\n【多了一个真正靠得住的人】"; } },
    { t:"没让{TA子}走", cost:1, eff:{risk:32,family:-16,network:7,merit:-4},
      fn:s=>{ s.flags.affair = true; s.flags.affairYear = s.year; s.flags.affairOffice = true;
        s.pendMsg="办公室的灯是感应的，到点会自己灭。那天晚上它灭了两次。\n\n之后的两年里，你们在单位里演得很好——好到你自己都开始相信没有人看得出来。\n\n事实上，最先看出来的是打扫卫生的阿姨。第二个是你的司机。第三个是纪委的人，只不过{TA}们不着急。\n\n【风险 +32 · 单位里的事，从来瞒不住】"; } },
  ]},

{ id:"she_house", w:14, cond:s=>s.flags.affair && !s.flags.sheHouseAsked && s.year - (s.flags.affairYear||s.year) >= 2, once:true, tag:"风险",
  title:"她开口了",
  text:s=>`第一次开口不是要钱。\n\n{TA}说房子租的，房东要卖，问你有没有认识的中介。说得很轻，说完还笑了一下。\n\n你听懂了。你也知道{TA}知道你听懂了。\n\n你账上有 ${s.money.toFixed(0)} 万。`,
  opts:[
    { t:"买了。全款，写{TA}的名字", eff:{money:-150,risk:26,family:-9},
      fn:s=>{ s.flags.sheHouseAsked=true; s.flags.sheHouse=true;
        s.pendMsg="房子在城西，八十六平，全款一百五十万。\n\n签字那天{TA}挽着你的胳膊，你下意识地往旁边挪了半步——不是嫌，是那条街上有你们单位的人。\n\n从那天起你多了一样东西：一个写着别人名字、但所有人都能查到钱是从哪来的房产。\n\n这样东西比任何一封举报信都完整。"; } },
    { t:"给{TA}安排个位置，比给钱稳当", cost:2, eff:{risk:38,network:-9},
      fn:s=>{ s.flags.sheHouseAsked=true; s.flags.sheJob=true;
        s.pendMsg="你打了两个电话，{TA}进了下属一个事业单位，编制内。\n\n你觉得这比给钱干净——看起来只像是在帮一个年轻人。\n\n你忘了一件事：编制这个东西，是有档案的。档案上会写清楚是谁在哪一年、经过哪几道手续把{TA}放进去的。\n\n这份档案会一直躺在那里，等着某一天被人从头翻一遍。"; } },
    { t:"到此为止。给一笔钱，断干净", cost:2, eff:{money:-60,risk:-9,health:-9},
      fn:s=>{ s.flags.sheHouseAsked=true; s.flags.affair=false; s.flags.affairEnded=true;
        s.pendMsg="你把话说得很难听，难听到自己都愣了一下——你知道只有难听才断得干净。\n\n{TA}没有哭，只是把卡收下了，说了句：你早该这么说的。\n\n这句话之后的很多年，你都会在某些没什么道理的时刻突然想起来。\n\n【关系已了结 · 但世上多了一个知道你全部事情的人】"; } },
  ]},

{ id:"she_claim", w:14, cond:s=>s.flags.affair && s.flags.married && !s.flags.sheClaimAsked && s.year - (s.flags.affairYear||s.year) >= 4, once:true, tag:"抉择",
  title:"一个说法",
  text:`这件事撑不住了。\n\n{TA}要一个说法，{配偶}也要一个说法——{配偶}是在你手机充电的时候看到的，只看到一条，但一条就够了。\n\n那天晚上家里没有开电视。你们两个人在客厅坐了三个小时，一共说了不到二十句话。\n\n最后{配偶}说：你自己想清楚。`,
  opts:[
    { t:"离。人这辈子总要选一次", cost:3, eff:{family:-34,network:-20,risk:14,merit:-9},
      fn:s=>{ s.flags.sheClaimAsked=true; s.flags.divorced=true; s.flags.married=false;
        s.pendMsg="手续办得很快，财产分得很干净，你几乎什么都没要。\n\n单位里没有人当面提这件事。但从那一年起，你在任何一次讨论中都多了一个不需要说出口的减分项——组织上对这个的说法是「家庭情况」。\n\n{子女}有很长一段时间不接你电话。\n\n【已离婚 · 家庭大幅下降 · 晋升评价受影响】"; } },
    { t:"断了那边，回家认错", cost:3, eff:{family:-16,health:-13,risk:-11,money:-70},
      fn:s=>{ s.flags.sheClaimAsked=true; s.flags.affair=false; s.flags.affairEnded=true;
        s.pendMsg="你写了一份东西，不是给组织的，是给{配偶}的。写了四页。\n\n{配偶}看完没说话，第二天照常做了早饭。\n\n你们后来又过了很多年。这些年里{TA}再没有提起过这件事，一次都没有——这比提起要重得多。\n\n【关系已了结 · 家里的账要还很久】"; } },
    { t:"拖。两边都不说死", cost:2, eff:{risk:26,family:-20,health:-14},
      fn:s=>{ s.flags.sheClaimAsked=true; s.flags.dragging=true;
        s.pendMsg="你选了最省力的一条路：谁也不答复，谁也不得罪。\n\n这条路你走了很多年。它的代价不是某一天突然爆发，而是每一天都消耗一点。\n\n后来你体检查出的那几项，医生说主要是「长期紧张」。\n\n【两头都没断 · 风险持续累积】"; } },
  ]},

{ id:"she_photo", w:13, pri:s=>1.5, cond:s=>(s.flags.affair||s.flags.affairEnded) && !s.flags.photoAsked && s.rank>=4, once:true, tag:"危 机",
  title:"照片",
  text:s=>`一个陌生号码发来三张照片和一句话。\n\n照片是很多年前的，画质不好，但足够清楚。那句话只有六个字：\n\n「${RANKS[s.rank]}，聊一聊？」\n\n对方开的价是 ${Math.round(30*bribeMul(s))} 万。`,
  opts:[
    { t:"给钱。这个事不能见光", cost:2,
      fn:s=>{ const c = Math.round(30*bribeMul(s));
        s.money = Math.max(0, s.money - c); s.flags.photoAsked=true; s.flags.blackmailed=true;
        s.risk = cl(s.risk + 12, 0, 140);
        s.pendMsg="钱是在一个地下车库给的，现金，装在一个纸箱里。\n\n对方数都没数，拎着就走了。\n\n你在车里坐到手不抖了才开出去。那天你想明白一件事：这种事没有「一次」，只有「第一次」。\n\n果然，四个月后那个号码又响了。\n\n【花 "+c+" 万 · 风险 +12 · 从此每年被人拿着】"; } },
    { t:"不给。就当没收到", eff:{health:-16},
      fn:s=>{ s.flags.photoAsked=true;
        if(chance(0.55)){ s.risk = cl(s.risk + 34, 0, 140);
          s.pendMsg="你没有回。\n\n三个月后，那三张照片出现在一封寄往省纪委的信里，随信还有一份很详细的时间地点说明。\n\n写这封信的人显然不是为了钱——钱只是{TA}给你的一次机会，你没要。\n\n【风险 +34】"; }
        else { s.risk = cl(s.risk + 6, 0, 140);
          s.pendMsg="你没有回。那个号码后来再没响过。\n\n你不知道是对方放弃了，还是{TA}也怕，还是{TA}只是在等一个更值钱的时候。\n\n这件事没有结果，所以它永远没有结束。接下来的很多年，每次手机响起陌生号码，你的心都要沉一下。\n\n【风险 +6 · 但这件事一直悬着】"; } } },
    { t:"自己报告组织", cost:4, eff:{merit:-24,network:-30,family:-18,health:-11},
      fn:s=>{ s.flags.photoAsked=true; s.flags.confessed=true;
        s.risk = cl(s.risk*0.35, 0, 140);
        s.pendMsg="你把照片、号码、和整件事的来龙去脉，写成材料交了上去。\n\n敲诈的人抓了，判了四年。\n\n你受了处分，级别没动，但从此在这个系统里，你成了一个「有故事的人」。有些会你还去，有些名单上你不再出现。\n\n你后来跟人说过一句话：那天交材料的时候，我知道我把自己毁了一半，可我留下了另一半。\n\n【风险大幅下降 · 前程受损 · 但把柄不在别人手里了】"; } },
  ]},

{ id:"laopo", w:13, cond:s=>s.flags.affair && s.flags.married && !s.flags.laopoAsked && s.year - (s.flags.affairYear||s.year) >= 1, once:true, tag:"家庭",
  title:"她什么都没问",
  text:`{配偶}今天做了四个菜，其中两个是你爱吃的。\n\n吃饭的时候{TA}说起小区里谁家孩子考上了哪儿，说得很热闹。\n\n洗碗的时候{TA}背对着你，忽然说了一句：\n\n「你最近好像很忙。」\n\n然后{TA}就继续洗碗了，水声很大。\n\n{TA}什么都没问。`,
  opts:[
    { t:"什么也没说，过去帮{TA}擦碗", eff:{family:-9,health:-7},
      fn:s=>{ s.flags.laopoAsked=true;
        s.pendMsg="你站在{TA}旁边，两个人谁也没再说话。\n\n那天晚上你们像往常一样睡下，中间隔着一床被子的距离——那个距离是从什么时候开始有的，你们两个人都说不上来。\n\n这件事从此在家里成了一个不存在的东西。它不存在，但它占地方。"; } },
    { t:"当场断了。第二天就断", cost:2, eff:{family:6,health:-9,risk:-12,money:-40},
      fn:s=>{ s.flags.laopoAsked=true; s.flags.affair=false; s.flags.affairEnded=true;
        s.pendMsg="你第二天就把事情了了，处理得很不体面，但很干净。\n\n你从没跟{配偶}承认过，{TA}也从没问过第二遍。\n\n很多年后有一次你们喝多了，{TA}说：那年我其实都收拾好行李了。\n\n你问那为什么没走。{TA}说：因为你后来天天按时回家。\n\n【关系已了结 · 有些话这辈子都不会说破】"; } },
    { t:"编了个理由", eff:{family:-15,risk:8},
      fn:s=>{ s.flags.laopoAsked=true;
        s.pendMsg="你说单位在忙一个专项，年底就结束了。\n\n{TA}「嗯」了一声，说注意身体。\n\n年底那个专项当然没有结束，因为它从来就不存在。{TA}也没有再问过。\n\n你后来才慢慢明白：{TA}不问，不是因为{TA}信了。"; } },
  ]},

/* ---------- 新浪潮配套事件 ---------- */
{ id:"w_rotate", w:14, waveTag:"rotate", cond:s=>s.rank>=3 && s.age<=58, tag:"变局",
  title:"调令",
  text:`调令下来了：平级，异地，三百二十公里。\n\n你在这儿经营了六年。你知道哪个科长办事拖、哪个副职心里有想法、哪家饭店的包厢隔音好。\n\n到了那边，这些全部归零。`,
  opts:[
    { t:"去。这是规矩", cost:2, eff:{merit:14,family:-18,health:-7},
      fn:s=>{ s.network = cl(s.network*0.55); s.flags.rotated=true;
        s.pendMsg="你一个人去的，租了个五十平的房子，周末回来。后来变成两周回来一次，再后来变成一个月。\n\n新地方的人对你很客气。客气了整整两年，才有人开始跟你说真话。\n\n【人脉大幅折损 · 但异地经历是硬通货】"; } },
    { t:"托关系留下来", cost:3, eff:{network:-16,risk:16,merit:-9},
      msg:"你找了两个人，说了很多话，最后留下来了，理由是「工作需要连续性」。\n\n你确实留下了。你也确实在原地又待了六年。\n\n组织部那本册子上，你的名字后面从此有了一个小小的记号。没有人告诉你那是什么意思，但你后来自己看出来了。" },
    { t:"举家搬过去", cost:2, cond:s=>s.flags.married, eff:{merit:11,family:-7,money:-16,health:-5},
      msg:"{配偶}辞了工作，{子女}转了学。转学手续办了三个月。\n\n{子女}在新学校头半年一句话都不说。有天晚上{TA子}问你：我们还回去吗。\n\n你说回。你说的时候自己都不信。" },
  ]},

{ id:"w_shrink", w:14, waveTag:"shrink", cond:s=>s.rank>=3, tag:"变局",
  title:"最后一届",
  text:`城东那所小学今年只招到十一个学生，撤并方案报上来了。\n\n校长是个快退休的老头，他在会上没有反对，只说了一句：「那栋楼是九三年全村人凑钱盖的。」\n\n然后他就不说话了。`,
  opts:[
    { t:"按方案撤并，学生统一送到镇上", cost:2, eff:{merit:12,network:5,family:-4},
      msg:"手续办得很规范，校车也配了，家长会开了三场。\n\n撤并那天老校长把国旗降下来，叠好，抱在怀里走了。\n\n三年后你路过那个村，那栋楼的窗户全空着。你没有下车。" },
    { t:"保留一年，等最后那批孩子毕业", cost:3, eff:{merit:-6,network:-9,family:9,health:-5},
      msg:"你顶着压力签了缓撤的意见，被上面点过一次名。\n\n那十一个孩子在原来的教室里读完了小学。毕业照上，老校长站在最边上。\n\n这件事没有进你的任何一份材料。它只在那个村子里被人记着，一直记到现在。" },
    { t:"往上报，让上面定", eff:{merit:-3,network:6,risk:-4},
      msg:"你把球踢了上去。上面批得很快，就是照原方案办。\n\n你什么责任也没担，什么也没得到。\n\n老校长后来在县里见过你一次，他认得你，冲你点了点头。你也点了点头。" },
  ]},

{ id:"w_payrise", w:15, waveTag:"payrise", cond:s=>s.rank>=2, tag:"变局",
  title:"阳光工资",
  text:s=>`新工资条发下来了，基本工资从 ${(SALARY[s.rank]/12).toFixed(1)} 万涨到 ${(SALARY[s.rank]*1.75/12).toFixed(1)} 万一个月。\n\n办公室里一片安静。因为大家同时想起了同一件事：从这个月开始，所有别的口子都堵死了。\n\n老张算了一笔账，算完说了句：我们科室，一半人涨了，一半人跌了。\n\n跌的那一半，是原来在别的地方有收入的那一半。`,
  opts:[
    { t:"挺好的。以后钱是干净的", eff:{merit:9,health:5,network:-4},
      fn:s=>{ s.flags.sunshine=true;
        s.pendMsg="你是真心觉得挺好的。你算了算，工资涨的那部分，够你不用再想那些事了。\n\n后来有几年你确实过得很轻松。\n\n轻松到你有时候会怀疑，前面那些年自己到底在紧张什么。"; } },
    { t:"钱变干净了，事就不好办了", eff:{network:9,merit:-4,risk:5},
      msg:"你在小范围里说了句实话：以前有些事，是靠一些说不清的东西转起来的。\n\n没有人反驳你，也没有人接话。散了以后你想了很久，不知道那句话最后会停在谁那儿。\n\n这句话后来被人转述过。转述的时候少了前半句，只剩下后半句。" },
    { t:"该怎么办还怎么办", cost:1, eff:{risk:22,network:6},
      msg:"你没有变。只是所有动作都要多绕两道弯，多找一个人。\n\n成本高了，风险也高了。你算过一次账，发现现在做同样一件事，代价是过去的三倍。\n\n你还是做了。人是很难改的，尤其是在尝过甜头之后。" },
  ]},

{ id:"w_cold", w:14, waveTag:"cold", tag:"变局",
  title:"零下十九度",
  text:`供暖停了第四天。你在指挥部待了七十个小时，靠泡面和劣质速溶咖啡撑着。\n\n凌晨三点有人来报：城北老旧小区有位独居老人，敲门没人应。\n\n你抓起大衣就往外走。到楼下才发现自己没戴手套，手已经不听使唤了。`,
  opts:[
    { t:"跟着去", cost:3, eff:{merit:16,health:-16,network:9},
      fn:s=>{ s.flags.crisis=true;
        s.pendMsg="老人没事，只是睡得沉，屋里冷得像冰窖。你们把{TA}接到了安置点。\n\n临走时{TA}拉着你的手说了句什么，你没听清，因为你的耳朵已经冻麻了。\n\n那年春天你落下了一个毛病：一到冬天关节就疼。\n\n【扛过大事 · 但身体留下了东西】"; } },
    { t:"让下面的人去，你在指挥部盯全局", cost:2, eff:{merit:11,network:-5},
      msg:"你在指挥部盯了一夜，调度了十七个点位，没有出一起事故。\n\n这是对的。这个位置上的人本来就该在指挥部。\n\n只是后来看新闻，画面里冲在最前面的是别人。你把电视关了。" },
    { t:"回去睡两个小时", eff:{health:9,merit:-11,network:-7},
      msg:"你确实撑不住了。你睡了两个小时，醒来的时候事情已经处理完了。\n\n没有人说什么。这一夜后来在总结材料里被写成了「全体干部连续奋战」。\n\n你签发了那份材料。" },
  ]},

/* ---------- 新词条的来源 ---------- */
{ id:"yuanzang", w:11, cond:s=>s.rank>=3 && s.rank<=6 && s.age>=32 && s.age<=48 && !s.flags.zangAsked, once:true, tag:"抉择",
  title:"三年",
  text:s=>`援藏名额下来了，组织上找你谈话。\n\n三年，海拔四千二。回来之后，一般都会有个交代。\n\n谈话的人说得很直白：「去过的人回来，路会宽一些。但那三年，是拿命换的。」\n\n${s.flags.married ? (s.flags.child ? "{配偶}那天问了一句：三年，你想过{子女}那时候多大了吗。" : "{配偶}那天问了一句：三年，你想过我一个人在这边吗。") : "谈话的最后他问了一句：你身体扛得住吗。"}`,
  opts:[
    { t:"去", cost:3, eff:{health:-20,family:-20,merit:16,network:11},
      fn:s=>{ s.flags.tibet=true; s.flags.zangAsked=true;
        s.pendMsg="第一个月你睡不着，第三个月你开始流鼻血，第一年你瘦了十六斤。\n\n你在那儿修了一条路，二十七公里，通到一个只有四十户人家的村子。通车那天全村人给你献了哈达，你站在风里哭了，理由说不上来。\n\n回来那年你的名字排在提拔名单的很前面。\n\n【援藏经历 · 晋升评分大幅提升 · 身体永久受损】"; } },
    { t:"不去。孩子还小", eff:{family:11,merit:-6},
      fn:s=>{ s.flags.zangAsked=true; },
      msg:"你说了家里的实际困难，组织上表示理解。\n\n去的是另一个人。他回来之后连升两级。\n\n你在他的欢迎会上鼓了掌，鼓得很用力。" },
  ]},

{ id:"foupiao", w:9, cond:s=>s.rank>=3 && s.rank<=7 && !s.flags.vetoed, once:true, tag:"危机",
  title:"一票否决",
  text:`你分管的领域出了事：一起安全事故，两死一伤。\n\n事故本身跟你没有直接关系——那家企业的手续是三任前领导批的，检查记录也齐全。\n\n但「一票否决」这四个字不看这些。它只看事情发生在谁的任上。`,
  opts:[
    { t:"扛下来。这是我分管的", cost:3, eff:{merit:-14,network:14,health:-11},
      fn:s=>{ s.flags.vetoed=true;
        s.pendMsg="你在会上说了「我负主要领导责任」这八个字，说得很清楚。\n\n处分下来了，年度考核一票否决。\n\n单位里有几个人从此对你不一样了——他们知道这件事本来可以推给别人。\n\n【一票否决 · 晋升评分永久 −9 · 但你换来了一些别的东西】"; } },
    { t:"把责任理清楚，该谁的是谁的", cost:3, eff:{merit:4,network:-24,risk:9},
      msg:"你做了一份很扎实的责任梳理，把时间线拉到了十一年前。\n\n材料无懈可击，你被免于追究。\n\n代价是三个人因此被处理，其中一个是跟了你六年的处长。他走的时候没有来找你，也没有说过任何难听的话。\n\n这比说什么都难受。" },
    { t:"往上汇报，请示怎么定", cost:2, eff:{merit:-7,network:5,risk:-4},
      msg:"上面研究了两个星期，最后的处理意见是「予以通报」。\n\n通报是给单位的，不是给个人的。你躲过去了。\n\n从那以后你养成了一个习惯：任何一份需要签字的材料，你都要先看一遍历任签字人是谁。" },
  ]},

{ id:"beiguo", w:9, cond:s=>s.rank>=4 && s.rank<=7 && !s.flags.tookblame, once:true, tag:"抉择",
  title:"谁签的字",
  text:`一份三年前的批复出了问题，上面要查是谁签的。\n\n签字的是你的老领导，现在他在省里。找你谈话的人话说得很客气，客气到你听出了另一层意思：\n\n这件事如果落在一个已经退居二线的人身上，是最好的结果。\n\n而那个人，恰好是你的老领导。`,
  opts:[
    { t:"说：那份批复是我起草并建议的", cost:3, eff:{merit:-11,network:22,risk:12,health:-9},
      fn:s=>{ s.flags.tookblame=true;
        s.pendMsg="你把这件事接了下来。处理不重，一个诫勉。\n\n老领导后来给你打过一个电话，只说了三个字：我知道。然后就挂了。\n\n从那以后，在某些完全用不上你的场合，会有人替你说话，而你根本不知道那个人是谁。\n\n【背过锅 · 人脉每年自然增长 · 但风险再也回不到零】"; } },
    { t:"实事求是，签字的是谁就是谁", cost:2, eff:{merit:6,network:-26},
      msg:"你把档案调出来，复印，附上说明，交了上去。\n\n老领导受了处分，退休金档次降了一级。\n\n他没有找过你。这个系统里也没有人当面说过你什么。\n\n只是从那一年起，你发现自己再也没有被任何人真正当作「自己人」。" },
    { t:"说自己记不清了", eff:{merit:-6,network:6,risk:11},
      msg:"你说了三次「时间太久了」。\n\n查了两个月，最后不了了之，档案里加了一份「情况说明」。\n\n两边都没得罪，两边也都没记住你。" },
  ]},

{ id:"dianshi", w:9, cond:s=>s.rank>=4 && !s.flags.ontv, once:true, tag:"人事",
  title:"三十秒",
  text:`省台要做一期专题，点名要采访你分管的那项工作。\n\n宣传部把提纲送来了，一共七个问题，答案也附了。\n\n你看了一遍，发现第四个问题的标准答案是错的——不是政治上错，是事实上错。`,
  opts:[
    { t:"照稿子念", eff:{network:11,merit:-4},
      fn:s=>{ s.flags.ontv=true;
        s.pendMsg="节目播了三十秒，你出现在其中的十九秒。\n\n那十九秒你自己看了六遍，主要是在看有没有说错话。\n\n没有说错。一个字都没说错。\n\n【上过电视 · 人脉每年自然增长】"; } },
    { t:"把第四个问题改对了再念", cost:2, eff:{merit:11,network:-9},
      fn:s=>{ s.flags.ontv=true;
        s.pendMsg="你改了那一句，改得很小心，播出来的时候听不出区别。\n\n只有两个人听出来了：一个是写稿子的干事，另一个是那项工作真正的负责人。\n\n后来那位负责人在一个跟你完全无关的场合，替你说了句好话。\n\n【上过电视 · 而且你说的是对的】"; } },
    { t:"推掉。让更合适的同志上", eff:{merit:5,network:-11,health:4},
      msg:"你说自己不上镜，让分管副职去了。\n\n他上得很好，后来又上了两次。\n\n三年后有个位置，最终定的是他。定的理由里有一条：「群众认知度高」。" },
  ]},

{ id:"bingtui_ask", w:0, force:true, tag:"身 体",
  title:"医生的建议",
  text:s=>`复查结果出来，医生把片子挂上去看了很久，最后转过身来，说话比以往都慢：\n\n「按你现在这个状态，我建议你办病退。」\n\n他停了一下，补了一句：「我不是吓唬你。我这儿一年签几十份这样的建议书，签完还能来复查的，不到一半。」\n\n你今年${cn(s.age)}岁，${RANKS[s.rank]}，离退休还有${cn(Math.max(1,s.retireAge-s.age))}年。`,
  opts:[
    { t:"办。命比这身衣服要紧", 
      fn:s=>{ s.flags.bingtuiAsked=true; s.sickLeave=true; s.retired=true;
        s.health=cl(Math.max(s.health,22));
        s.log.push([s.year, "因健康原因提前退出岗位"]);
        return retireFlow(); } },
    { t:"再撑两年。手上这摊事没人接", cost:2, eff:{merit:12,health:-9,network:6},
      fn:s=>{ s.flags.bingtuiAsked=true; s.flags.pushedOn=true; s.flags.illness=true;
        s.pendMsg="你把建议书折起来，放进了公文包最里面那一层。\n\n那两年你确实把事情办完了，办得还不错。\n\n体检报告你再没打开过。你把它们叠在一起，压在抽屉最底下，一共七份。\n\n【硬撑下去 · 身体持续恶化】"; } },
    { t:"退二线，但不办手续", cost:1, eff:{merit:-14,health:6,family:9,network:-9},
      fn:s=>{ s.flags.bingtuiAsked=true;
        s.pendMsg="你跟组织上谈了一次，说想换个轻一点的位置。\n\n他们给你安排了一个调研员的岗位，没有分管，没有例会，办公室在走廊尽头。\n\n第一个月你很不习惯，第三个月你开始每天中午睡四十分钟。\n\n从此再没有人问过你的意见。这件事让你难受了很久，但你的血压降下来了。\n\n【前程基本停在这里 · 身体好转】"; } },
  ]},

/* ---------- 良心账：钱越脏，越睡不着 ---------- */
{ id:"sleepless", w:12, cd:6, pri:s=>1 + (s.grey||0)/400,
  cond:s=>(s.grey||0)>=120 && !s.busted, tag:"生 活",
  title:"夜里醒着",
  text:s=>{
    const t = nth("sleepless");
    if(t<=1) return `凌晨两点四十，你醒了。\n\n不是被什么吵醒的，就是醒了。你躺着，能听见楼上水管的声音，能听见冰箱的嗡嗡声。\n\n你开始在脑子里过一遍：那笔钱走的哪个账户，经手的有几个人，那几个人现在都在哪儿，哪一个最有可能先出事。\n\n这套程序你已经很熟了。做完一遍，天就快亮了。`;
    if(t===2) return `你现在有一个习惯：看到穿深色夹克的陌生人在单位门口停留，会先数一数有几个。\n\n今天有两个。他们在等人，等的不是你——十分钟后他们上了另一辆车。\n\n你回到办公室，坐下，发现自己手心是湿的。\n\n你这才想起来，你已经很久没有为一件好事这样紧张过了。`;
    return `你算过一笔账。\n\n这些年你拿到手的，折算下来，比你规规矩矩干到退休能挣的多出很多倍。\n\n然后你算了另一笔：这些年你睡好的夜晚，比你规规矩矩干的时候，少了大概三千个。\n\n三千个夜晚，换了那个数字。\n\n你到现在也说不清楚这笔买卖到底划不划算——你只知道，它已经没法退货了。`;
  },
  opts:[
    { t:"起来抽根烟，天亮照常上班", eff:{health:-6,merit:3},
      msg:"你在阳台上站到四点半，然后洗了个澡去了单位。\n\n那天你把三份积压的材料都批完了，效率高得反常。\n\n人在心里有事的时候，反而特别能干活。这个道理你是后来才想明白的。" },
    { t:"开始一样一样往回退", cost:3, eff:{risk:-20,network:-16,health:5},
      fn:s=>{ const back = Math.min(s.money*0.45, (s.grey||0)*0.5);
        s.money = Math.max(0, s.money - back); s.grey = Math.max(0, (s.grey||0) - back);
        s.pendMsg="你没有惊动任何人，只是把能退的一样一样退了回去，前后花了两年。\n\n有人不肯收，说这不合规矩。你说你知道。\n\n退完那天晚上你睡了七个小时，中间没醒。这是很多年里的第一次。\n\n【退出 "+yuan(back,0)+" · 风险 −20 · 有些人从此不再信你】"; } },
    { t:"什么也别想了，这条路没有回头", eff:{risk:6,health:-9,family:-6},
      fn:s=>{ s.flags.hardened = true;
        s.pendMsg="你告诉自己：想这些没有用。\n\n你确实不想了。你开始靠药物入睡，那个量后来一直在往上走。\n\n你变得很难被什么事情打动，包括好事。{配偶}有一次说你「像换了个人」，你笑了笑，没接话。\n\n你没换人。你只是把某个部分关掉了，因为它一直在响。"; } },
  ]},

{ id:"kid_knows", w:14, pri:s=>1.6, cond:s=>(s.grey||0)>=200 && kidAge(s)>=15 && !s.flags.kidKnows && !s.busted, once:true, tag:"家 庭",
  title:"{TA子}问了一句",
  text:s=>`吃饭的时候，{子女}忽然放下筷子，问了一句：\n\n「爸，我们家的钱，都是干净的吗？」\n\n{TA子}问得很平静，不像在质问，倒像在确认一件早就想过很多遍的事。\n\n桌上很安静。${s.flags.married ? "{配偶}起身去厨房了，走得有点急。" : "你放下了筷子。"}`,
  opts:[
    { t:"说：是。", eff:{family:-14,health:-9},
      fn:s=>{ s.flags.kidKnows=true;
        s.pendMsg="你说得很平稳。\n\n{子女}「哦」了一声，低头继续吃饭，那顿饭剩下的时间里{TA子}没有再抬过头。\n\n从那以后，{TA子}再没问过第二次。\n\n你曾经以为不问就是过去了。很多年后你才明白，不问是因为已经不需要问了。"; } },
    { t:"说：有些是，有些不是。", cost:2, eff:{family:-6,merit:-4,health:-5},
      fn:s=>{ s.flags.kidKnows=true; s.flags.toldKid=true;
        s.pendMsg="你说了实话，说得很难听，也很具体。\n\n{子女}听完没有哭，也没有走。{TA子}只说了一句：那你以后别再拿了。\n\n你答应了。你不知道自己能不能做到，但那天晚上你是真心的。\n\n这是你们两个人之间最难的一次对话，也是最像话的一次。"; } },
    { t:"发火：这是你该问的吗", eff:{family:-22,health:-6},
      fn:s=>{ s.flags.kidKnows=true;
        s.pendMsg="你把筷子拍在桌上，声音很大。\n\n{子女}站起来回房间了，门关得很轻——那种很轻的关门声，比摔门难受得多。\n\n你坐在那儿，忽然意识到自己刚才那个反应，本身就是答案。\n\n{TA子}也意识到了。"; } },
  ]},

/* ---------- 一直单身：不封死仕途，但确实有人会提 ---------- */
{ id:"single_talk", w:12, cond:s=>!s.flags.married && !s.flags.divorced && s.age>=34 && s.age<=48 && !s.flags.singleTalk, once:true, tag:"人事",
  title:"组织上的关心",
  text:s=>`年度谈话，谈到一半，主任把笔放下了。\n\n「小张啊，工作上没得说。就是……个人问题，什么时候解决一下？」\n\n你今年${cn(s.age)}岁。\n\n他说这话没有恶意，甚至带着点真诚的着急。他接着说了一句让你记了很久的话：\n\n「不是我们要管你私事。是有些位置，讨论到最后，总要看一眼这一栏。」`,
  opts:[
    { t:"说：在处，快了", eff:{network:8,merit:-2},
      fn:s=>{ s.flags.singleTalk=true;
        s.pendMsg="你说了一句不算谎话的谎话——你确实见过几个人，只是没有一个走到第二次。\n\n主任很高兴，说好好好，需要帮忙说一声。\n\n这句话此后每年都会被问一次。你的答案一年比一年熟练。"; } },
    { t:"说：我一个人挺好的", eff:{network:-11,health:6,family:5},
      fn:s=>{ s.flags.singleTalk=true; s.flags.singleFirm=true;
        s.pendMsg="你说得很坦然，坦然到主任有点意外。\n\n他「哦」了一声，说：那也行，各人有各人的活法。\n\n这句话是真心的。真心归真心，那一栏还是空着。\n\n后来有一次讨论到你，你听说有人问了一句：他那个情况，稳定吗？\n\n没有人回答这个问题，讨论就过去了。\n\n【晋升评分持续小幅受损 · 但你换来了自己的日子】"; } },
    { t:"托主任介绍一个", cost:2, eff:{network:14,merit:-4},
      fn:s=>{ s.flags.singleTalk=true; s.flags.matchmade=true;
        s.flags.married=true; s.flags.marryYear=s.year; s.flags.spouse="civil";
        s.pendMsg="主任真的很上心，前后介绍了三个。\n\n第三个成了。婚礼上主任坐主桌，喝得很高兴，说这是他这辈子办成的最实在的一件事。\n\n你和{TA}的开始不算浪漫。但很多年后回头看，那顿饭确实改变了很多东西——包括你后来的每一次讨论里，那一栏都是满的。\n\n【由此进入婚姻 · 人脉大幅提升】"; } },
  ]},

{ id:"single_old", w:11, cd:8, cond:s=>!s.flags.married && !s.flags.divorced && s.age>=46, tag:"生 活",
  title:"一个人的年夜",
  text:s=>{
    const t = nth("single_old");
    if(t<=1) return `除夕。单位值班表上你又签了自己的名字，连着第${cn(Math.max(3,Math.floor((s.age-32)/3)))}年。\n\n有人问你怎么老是你，你说家里没什么事。\n\n这是真话。九点多的时候你在值班室泡了碗面，外面的鞭炮声隔着窗户传进来，听着不太真切。`;
    return `又是除夕。\n\n这些年你已经把值班这件事做成了一种习惯，甚至有点依赖它——有事做的夜晚比没事做的夜晚好过。\n\n今年办公室的年轻人非要留下来陪你，你赶了两次才把人赶走。\n\n人走了以后，你在办公室坐了很久，把灯全打开了。`;
  },
  opts:[
    { t:"给老家打个电话", cost:1, eff:{family:9,health:3},
      msg:"你妈接的，聊了二十多分钟，大半是在说别人家的事。\n\n挂之前{TA}说：一个人也要好好吃饭。\n\n你说知道。你说完这两个字，那头停了两秒才挂。那两秒你听见了电视的声音。" },
    { t:"把明年的工作方案又改了一遍", eff:{merit:11,health:-6},
      msg:"你改到凌晨一点半，改出了一版比原来好得多的方案。\n\n那份方案第二年落地了，成了你履历上还算拿得出手的一笔。\n\n很多年后你翻到那个文件的修改时间，看见了那个日期。你盯着它看了一会儿，然后关掉了。" },
    { t:"提前走了，回家睡觉", eff:{health:9,merit:-5,network:-3},
      msg:"你九点半就锁门走了，路上一个人也没有。\n\n回家洗了个澡，十点半躺下，睡得意外地沉。\n\n第二天你发现值班群里有几条消息你没回。没有人追究，但那个记录一直在。" },
  ]},

/* ---------- 日常：这个系统里最好笑的部分，往往是最小的那些事 ---------- */
{ id:"yutou", w:11, cd:7, cond:s=>s.rank>=1 && s.rank<=6, tag:"应酬",
  title:"鱼头冲谁",
  text:s=>{
    const t = nth("yutou");
    if(t<=1) return `一条清蒸鱼端上来，服务员随手一放。\n\n鱼头正对着你。\n\n桌上一共九个人，你排第六。按规矩鱼头该冲主位那位，冲你算怎么回事。\n\n所有人都看见了，所有人都装作没看见。筷子悬在半空的有三个。`;
    if(t===2) return `又是这条鱼。\n\n这些年你已经养成了一个条件反射：菜一上桌先看鱼头朝哪儿。今天服务员转身走了，鱼头对着主陪。\n\n很标准。标准到你有点失落——你已经准备好那套转盘子的动作了。`;
    return `鱼上来了，鱼头冲着最下首那个刚入职的年轻人。\n\n他整个人僵在那儿，耳朵都红了，手放在膝盖上一动不敢动。\n\n你认得那个表情。你二十多年前也是那么坐着的。`;
  },
  opts:[
    { t:"不动声色转个盘子", cost:1, eff:{network:7,merit:2},
      msg:"你伸手扶了一下转盘，很自然地转了大概三十度，然后顺势给旁边的人夹了一筷子。\n\n鱼头稳稳地停在了主位面前。\n\n全程不到四秒，没有人说话，但你能感觉到桌上有两个人的肩膀松了一下。\n\n这四秒是你这些年练出来的。它写不进任何一份材料。" },
    { t:"端起杯子说：鱼头冲我，我先干为敬", eff:{network:11,health:-7,merit:-2},
      msg:"你一口闷了，桌上笑成一片，气氛一下就开了。\n\n主位那位笑着说：这个同志实在。\n\n代价是接下来的一个半小时里，「实在」这两个字给你换来了另外五杯。\n\n你回家的时候是被人扶上车的。" },
    { t:"就当没看见，闷头吃菜", eff:{network:-9,health:3},
      msg:"你低头吃了三口青菜。\n\n最后是坐你对面那位站起来把盘子转过去的，动作很大，还笑着说了句「哎呀这个服务员」。\n\n他化解得很漂亮，也很响。全桌都记住了是谁化解的，也记住了是谁没动。" },
  ]},

{ id:"heying", w:10, cd:8, cond:s=>s.rank>=2 && s.rank<=7, tag:"办公室",
  title:"合影",
  text:`活动结束要合影，摄影师喊：领导站中间，其他同志两边站开。\n\n然后就没有然后了。二十多个人在原地缓慢地位移，像一群不太确定自己该去哪儿的鸽子。\n\n你在第二排和第一排之间的那个位置犹豫了大概三秒。`,
  opts:[
    { t:"往后退半步，站第二排", eff:{network:5,merit:2},
      msg:"你退了半步，正好把位置让给了另一个跟你同级但年长两岁的同志。\n\n他冲你点了下头。\n\n照片洗出来贴在宣传栏上，你在第二排，只露了大半张脸。这张照片没有任何人记得，除了那个跟你点头的人。" },
    { t:"稳住不动，就站这儿", eff:{network:-4,merit:5},
      msg:"你没动。摄影师喊了两遍「后面的同志再靠拢一点」，你也没动。\n\n照片上你在第一排边上，看得清清楚楚。\n\n后来这张照片被用在了年度画册里。有人在背后说了一句「他倒是会站」。这句话有两种听法，你选了好的那一种。" },
    { t:"主动去帮着排队形", cost:1, eff:{network:9,merit:-2},
      msg:"你开始指挥：高个子往后、这边再挤一挤、王科你往中间站站。\n\n队形排得又快又整齐，摄影师连说了三个「好」。\n\n然后他按下快门。\n\n照片洗出来你才发现，自己在最右边，半个身子在画框外面。" },
  ]},

{ id:"chenghu", w:11, cond:s=>(s.rank===3 || s.rank===5) && !s.flags.chenghuDone, once:true, tag:"办公室",
  title:"张副局",
  text:`你刚提副职，第一次下基层调研。\n\n乡里的干部很热情，一路上「张副局长」「张副局长」地叫，叫得非常标准，非常准确，非常刺耳。\n\n随行的办公室主任在第三次之后咳嗽了一声。第四次之后又咳嗽了一声。\n\n第五次的时候他直接说：叫张局就行。`,
  opts:[
    { t:"笑着说：叫我老张", eff:{network:9,merit:3},
      msg:"乡里那位愣了一下，然后真的开始叫「老张」，越叫越顺口。\n\n那天下午的座谈会开得特别好，他们说了很多平时不会跟上面人说的话。\n\n回程车上办公室主任说：您这一手挺高明。\n\n你说这不是手段。他「嗯」了一声，显然不信。" },
    { t:"什么也不说，默认「张局」", eff:{network:5},
      msg:"从那天起你就是张局了。\n\n那个「副」字被所有人心照不宣地省略掉，一省就是很多年。\n\n直到你真的成了正职那天，才发现称呼上什么都不用改。这让你有一瞬间觉得很没意思。" },
    { t:"认真纠正：我是副职，别叫错了", eff:{merit:6,network:-9},
      msg:"你说得很诚恳，说这是原则问题。\n\n那位乡干部立刻改了口，改得非常准确。整个下午他一共叫了你十一次「张副局长」。\n\n办公室主任一句话没说。回去的车上他睡着了，或者装睡。" },
  ]},

{ id:"dianti", w:10, cd:6, cond:s=>s.rank<=5, tag:"办公室",
  title:"电梯",
  text:s=>{
    const t = nth("dianti");
    if(t<=1) return `电梯门开了，里面只有一把手。\n\n从一楼到八楼，大概二十二秒。\n\n二十二秒是一个很尴尬的长度：短到说不完一件事，长到不能什么都不说。`;
    return `又是电梯，又是二十二秒。\n\n这些年你在这二十二秒里说过天气、说过食堂、说过楼下新开的那家店。\n\n今天你一进去就发现气氛不对——他在看手机，眉头锁着。`;
  },
  opts:[
    { t:"汇报一句手头的工作", cost:1, eff:{merit:7,network:-3},
      msg:"你用十四个字说清了一件事。\n\n他「嗯」了一声，到八楼出去了。\n\n三天后那件事的批示下来了，比正常流程快了两个星期。\n\n从此你养成了一个习惯：每天出门前，在心里准备一句十四个字以内的话。" },
    { t:"说天气", eff:{network:4},
      msg:"你说今天挺闷的，他说是啊。\n\n然后就到了。\n\n这段对话你们后来重复过大概四十次，措辞几乎没变过。它没有任何意义，但它维持着一种叫「认识」的东西。" },
    { t:"什么也不说，看着楼层数字", eff:{network:-4,health:2},
      msg:"你盯着那排数字看了二十二秒，看得非常专注。\n\n他也在看手机。\n\n出电梯的时候你们谁也没看谁。这二十二秒对你们两个人来说，可能都算是这一天里比较轻松的时刻。" },
  ]},

{ id:"jinqi", w:9, cd:9, cond:s=>s.rank>=3 && s.rank<=7, tag:"生活",
  title:"锦旗",
  text:`一位群众送来一面锦旗，说是感谢你们帮他解决了低保的事。\n\n锦旗是红底黄字，很正式。上面写着八个大字：\n\n「为民做主　青天再世」\n\n办公室主任盯着那八个字看了很久，然后小声说：领导，这个……「做主」这个提法，是不是有点……`,
  opts:[
    { t:"挂上。老百姓的心意", eff:{merit:5,network:-6,risk:5},
      msg:"锦旗挂在了会议室最显眼的位置。\n\n三个月后上级来检查工作，领导在会议室坐了两个小时，全程没有提那面锦旗。\n\n检查组走后第二天，办公室主任默默把它换了个位置，挪到了走廊尽头。" },
    { t:"收起来，跟人家好好解释一下", cost:1, eff:{merit:7,network:6},
      msg:"你亲自打电话给那位群众，说了很久，从「人民公仆」讲到「依法办事」。\n\n他听完说：懂了懂了，那我重新做一面。\n\n第二面送来的时候写着「情系群众　依法为民」。规范多了，也没什么意思了。\n\n你把第一面留在了自己的柜子里。" },
    { t:"让办公室去处理", eff:{network:3,merit:-2},
      msg:"你说了句「你们看着办」，就去开会了。\n\n回来的时候锦旗不见了，没有人提起过这件事。\n\n很多年后你在库房里找东西，翻出了一卷落灰的红布。你展开看了一眼，又卷了回去。" },
  ]},

{ id:"zongjie", w:11, cd:5, cond:s=>s.rank>=1 && s.rank<=6, tag:"工作",
  title:"年终总结",
  text:s=>{
    const t = nth("zongjie");
    if(t<=1) return `办公室通知：年终总结，八千字以上，本周五交。\n\n你翻出去年的那份，八千二百字。\n\n再翻前年的，八千一百字。你把两份并排放着看了一分钟，发现除了年份和三个数字，几乎一模一样。\n\n那两年你确实干了很多事。只是那些事，没有一件是能写进这种文体里的。`;
    return `又到年终总结。\n\n这些年你已经形成了一套方法论：先把去年的调出来，把年份改了，把数字换了，把去年没做成今年做成了的那几件挪到前面。\n\n四十分钟能出一版。这四十分钟是你一年里效率最高的四十分钟。`;
  },
  opts:[
    { t:"认真重写一份", cost:2, eff:{merit:9,health:-6},
      msg:"你写了两个晚上，写了一万一千字，里面有三段是你真想说的话。\n\n交上去以后，办公室把它删到了八千字。删掉的正好是那三段。\n\n理由是「篇幅所限，其他单位也都是八千」。" },
    { t:"改改去年的", eff:{merit:2,health:4,network:2},
      msg:"四十分钟，八千三百字，一稿过。\n\n办公室主任说写得好，有高度。\n\n你想了想，觉得他说得对——去年的那份确实有高度，毕竟它也是从前年那份改的。" },
    { t:"让新来的写，你把关", cost:1, eff:{merit:5,network:-4},
      msg:"小伙子写了三天，交上来一万四千字，里面有一段写得相当漂亮。\n\n你把那段留下了，其他的按老模板重排了一遍。\n\n他后来问你：领导，我写的那些为什么都不能用？\n\n你说：能用，就是不能今年用。你自己说完都愣了一下，因为这句话是你当年的主任对你说的。" },
  ]},

{ id:"baowen", w:9, cd:9, cond:s=>s.age>=40, tag:"生活",
  title:"保温杯",
  text:`你换了个保温杯。\n\n不是你想换，是原来那个玻璃杯的盖子丢了。你去超市随手买了一个，回来往桌上一放，办公室安静了两秒。\n\n然后小刘说：主任，您这就……正式进入下一个阶段了。\n\n全办公室都笑了。你也笑了，但你笑完低头看了一眼杯子里的枸杞——是你妈上周硬塞给你的。`,
  opts:[
    { t:"从此杯不离手", eff:{health:7,network:3},
      msg:"你不但用上了保温杯，还开始研究泡什么。\n\n三年后办公室里一半人都换成了保温杯，包括当年笑得最大声的小刘。\n\n他有一次端着杯子路过你桌边，你们对视了一眼，谁也没说话，但都懂了。" },
    { t:"第二天换回玻璃杯", eff:{health:-5,network:5},
      msg:"你专门去买了个新玻璃杯，透明的，看着很精神。\n\n你用了两个月，然后在一个特别冷的早上，默默把保温杯从抽屉里拿了出来。\n\n那天没有人笑。因为那天办公室里已经没有人还在用玻璃杯了。" },
  ]},

{ id:"weixin", w:10, cd:6, cond:s=>s.rank<=6, tag:"办公室",
  title:"收到",
  text:s=>{
    const t = nth("weixin");
    if(t<=1) return `晚上九点四十，一把手在大群里发了一段五十二秒的语音。\n\n你点开听了三遍，还是没太听清中间那句关键的。\n\n群里已经有四个人回了「收到」。第五个人回的是「收到！坚决落实！」，后面跟了三个感叹号。\n\n现在轮到你了。`;
    return `又是一条语音，这次一分十七秒。\n\n你现在已经能在听第一遍的时候就把重点抓出来了——这个能力花了你十几年。\n\n群里这次的格式是「收到，坚决贯彻落实」。已经有九个人这么回了，一字不差。`;
  },
  opts:[
    { t:"跟着回「收到」", eff:{network:3},
      msg:"你回了两个字。\n\n三十秒内又有六个人跟着回了。\n\n这条消息最终收到了二十三个「收到」，其中十九个是完全一样的。第二天开会才发现，有三个人根本听错了内容。" },
    { t:"回一条：已安排，明天上午出方案", cost:1, eff:{merit:8,network:-4},
      msg:"你是唯一一个回了具体内容的人。\n\n一把手单独回了你一个「好」。\n\n这个「好」字被你截图存了下来。你自己都觉得这个行为有点可笑，但你还是存了。\n\n代价是从此以后，所有需要「明天上午出方案」的事情，都会先想到你。" },
    { t:"装作没看见，明早再说", eff:{network:-7,health:4},
      msg:"你把手机扣过去，看完了那集电视剧。\n\n第二天早上八点，你在群里回了「收到」，是第二十四个。\n\n没有人说什么。但从此每次这种消息发出来，你都会下意识地数一数自己排第几。" },
  ]},

{ id:"divorce", w:0, force:true, tag:"家 庭",
  title:"这个家",
  text:s=>`{配偶}把一份东西放在餐桌上，压在盐罐底下。\n\n你回来的时候已经十一点半了，看见那张纸的时候还以为是水电费的单子。\n\n{TA}没有吵，也没有哭。{TA}只说了一句：\n\n「我不是怪你。我就是不想再一个人吃饭了。」\n\n你们结婚${cn(Math.max(1,s.year-(s.flags.marryYear||s.year-10)))}年。这些年你出差${cn(Math.min(99,Math.max(8,(s.year-2026)*3)))}次，{TA}一次也没问过你去哪儿。`,
  opts:[
    { t:"签", eff:{family:-24,network:-9,health:-13,money:-60},
      fn:s=>{ s.flags.divorced=true; s.flags.married=false;
        s.pendMsg="手续办得很快，快到你有点意外。房子给了{TA}，你搬进了单位附近一个五十平的地方。\n\n第一个月你不太习惯，因为不用给谁发「今晚不回来吃」的消息了。\n\n第三个月你习惯了。习惯这件事本身，才是最让你难受的。\n\n【已离婚 · 晋升评价从此多一栏「家庭情况」】"; } },
    { t:"求{TA}再给一次机会", cost:4, eff:{family:16,merit:-16,health:-9},
      fn:s=>{ s.flags.beggedBack=true;
        s.pendMsg="你说了很多，说到后来自己都听出来那些话有多空。\n\n{TA}最后说：那你明天几点回来。\n\n你说六点半。\n\n第二天你六点半到了家。第三天也是。第七天你有个走不开的会，你在会议室里给{TA}发了条消息，然后把手机扣了过去。\n\n{TA}没有再提离婚。这件事就这么放下了——放下的意思是，它一直在那儿。\n\n【家庭回升 · 但你得真的按时回家】"; } },
    { t:"什么也没说，第二天照常上班", eff:{family:-16,health:-9,merit:6},
      fn:s=>{ s.flags.coldWar=true;
        s.pendMsg="你把那张纸折好，放进了抽屉。\n\n你们谁也没有再提这件事。你们继续住在一个屋檐下，继续在过年时一起回老家，继续在别人问起时说「挺好的」。\n\n那张纸在抽屉里放了很多年。有一次你找东西翻出来，发现{TA}的名字已经签好了，只差你的。\n\n你又把它放了回去。\n\n【家里从此只剩下一个屋檐】"; } },
  ]},

/* ---------- 早期加厚：22–36 岁，科员到正科 ---------- */
{ id:"gongwei", w:11, cond:s=>s.rank<=1 && s.age<=30, once:true, tag:"办公室",
  title:"工位",
  text:`办公室重新调整座位。你的桌子被挪到了打印机旁边——全屋最吵、最热、人来人往最多的那个位置。\n\n没有人解释为什么。安排座位的人只是笑着说：小张年轻，不怕折腾。\n\n打印机每天响四百多次。你后来能从声音分辨出是谁在打印：老王打得慢，主任打得急，办公室小刘打完总忘了拿。`,
  opts:[
    { t:"忍着，顺便把打印机管起来", eff:{network:9,merit:4,health:-4},
      msg:"你成了那台机器的实际负责人：换纸、清卡、报修、教新来的人怎么双面。\n\n一年后全办公室没有人比你更清楚谁在干什么活——因为所有人的材料都从你眼皮底下过。\n\n这个位置最吵，但它也是这间屋子里信息最全的地方。你后来才想明白这一点。" },
    { t:"提一句，希望换个位置", eff:{network:-9,health:5},
      msg:"你说得很委婉，理由也很正当。\n\n主任说：行，等下次调整。\n\n下次调整是两年半以后。那次你换到了靠窗的位置，安静得让你有点不习惯。" },
    { t:"买了副降噪耳机", cost:1, eff:{money:-1.2,merit:6,health:3},
      msg:"耳机很贵，是你半个月工资。\n\n效果很好，好到有一次主任在你身后叫了你三声你都没听见。\n\n从那天起你只戴一只。这个姿势你保持了很多年——一只耳朵干活，一只耳朵听着这间屋子。" },
  ]},

{ id:"zhuanzheng", w:12, cond:s=>s.rank===0 && s.age<=26, once:true, tag:"人事",
  title:"转正",
  text:`一年试用期满，要写转正申请。\n\n模板是现成的，八百字，最后一段固定是「请组织上继续考验我」。\n\n人事科的老王提醒你：手写，别打印。字要工整，写错了整页重来。\n\n你写到第三页的时候明白了：这份东西没有人会认真读，但它必须由你亲手写完。`,
  opts:[
    { t:"一笔一画写完，写了四遍", cost:1, eff:{merit:5,network:7,health:-3},
      msg:"你写废了三张，第四张终于干净。\n\n老王收下的时候翻了翻，说：字不错。\n\n这三个字是你入职一年来听到的最具体的一句评价。你那天晚上骑车回去，路上唱了歌。" },
    { t:"打印了，签名手写", eff:{merit:2,network:-8},
      msg:"老王没说什么，收下了。\n\n转正照常通过。\n\n很多年后你自己带新人，看到有人交上来打印稿，你也什么都没说，也收下了。只是你记住了那个人。" },
    { t:"在最后一段写了两句真心话", cost:1, eff:{merit:8,network:-4},
      fn:s=>{ s.ability = cl2(s.ability + 4); },
      msg:"你写了自己这一年真正在想的事：材料很多，人很少，有些事明明可以更简单。\n\n没有人回应过这两句话。\n\n但十几年后，你在一份别人写的转正申请里看到了几乎一样的句子。你在那一页上停了很久，最后什么批注也没写。" },
  ]},

{ id:"dianhua", w:11, cond:s=>s.rank<=1 && s.age<=30, once:true, tag:"工作",
  title:"第一个电话",
  text:`上午九点四十，办公室的座机响了，只有你在。\n\n对面是个中年男人，一开口就是骂。他骂了四十分钟，中间只停下来喝过一次水。\n\n他的事不归你们管。你说了三次，他一次也没听见。`,
  opts:[
    { t:"听完，然后帮他问清楚该找谁", cost:2, eff:{merit:7,network:4,health:-5},
      msg:"你打了五个电话，把该找的部门、该带的材料、该走的流程写在一张纸上，回拨过去念给他听。\n\n他愣了几秒，说了句：谢谢。然后挂了。\n\n那张纸你留着，后来又用过十几次。这是你写过的第一份真正有人用的东西。" },
    { t:"礼貌地说不归我们管，挂了", eff:{health:4,merit:-3},
      msg:"你说得很规范，一个字都挑不出毛病。\n\n他还想说什么，你已经放下了听筒。\n\n下午他又打来了，还是那个号码。你看着屏幕响了很久，最后是老王接的。老王听了两分钟就把该找谁告诉了他。\n\n老王挂了电话，什么也没跟你说。" },
    { t:"把电话转给隔壁科室", eff:{network:-7,health:3},
      msg:"你转过去了。隔壁科室又转了回来，说这个真不是他们的事。\n\n这个电话在四个科室之间走了一圈，最后回到你桌上，那时候对方已经不骂了，只是反复说「你们到底谁管」。\n\n这句话你后来听过很多遍。" },
  ]},

{ id:"biaoge", w:12, cd:6, cond:s=>s.rank<=2 && s.age<=38, tag:"工作",
  title:"六张表",
  text:s=>{
    const t = nth("biaoge");
    if(t<=1) return `同一批数据，这个星期你填了六张表。\n\n六张表要的是同一件事，但格式各不相同：一张要季度累计，一张要同比，一张要按乡镇拆开，还有一张的备注栏要求「不超过五十字，须体现亮点」。\n\n六个部门，六个截止时间，没有一个知道另外五个的存在。`;
    return `又是同一批数据。\n\n这些年表格没有变少，只是从纸质变成了电子的，从电子的变成了系统里的，从系统里的变成了要同时填系统和电子版的。\n\n你现在填得很快。快到你已经不看它们要什么了——你知道它们要的是「填了」这个动作本身。`;
  },
  opts:[
    { t:"做个母表，一次填完自动生成", cost:2, eff:{merit:11,network:-3},
      fn:s=>{ s.ability = cl2(s.ability + 5); },
      msg:"你花了两个晚上做了一张母表，所有子表自动生成。\n\n效率提高了大概八倍。\n\n然后隔壁科室来借，隔壁的隔壁也来借，最后全局都在用。有人在会上表扬了这件事，用的措辞是「基层的智慧」。\n\n没有人问过这张表是谁做的。但需要改的时候，他们都知道来找谁。\n\n【能力提升】" },
    { t:"老老实实一张一张填", eff:{merit:4,health:-6},
      msg:"六张表填了三天半。\n\n交上去以后没有任何反馈，你也不知道它们后来去了哪里。\n\n年底整理文件夹的时候你翻到了它们，六个文件，一个也没被打开过。" },
    { t:"有一张编了，反正没人核", eff:{merit:5,risk:9,health:3},
      msg:"你编的是最不重要的那一张，数据合理，趋势也说得通。\n\n没有人发现。\n\n第二年那张表成了基数，你必须让新的数字跟去年对得上。第三年也是。\n\n你后来一直在为那个下午多花时间。" },
  ]},

{ id:"peixun", w:11, cond:s=>s.rank>=1 && s.rank<=3 && s.age<=42, once:true, tag:"人事",
  title:"培训班",
  text:`去省里参加一周的干部培训班。四十个人，来自全省各地，年龄相仿，级别相当。\n\n白天听课，晚上分组讨论。真正有用的东西不在课上——在食堂、在走廊、在晚上那顿谁也没组织的酒。\n\n第三天晚上，同宿舍那位说：来这儿的人，十年后至少有五个能用得上。`,
  opts:[
    { t:"每天晚上都出去认识人", cost:2, eff:{network:16,health:-7,family:-4},
      fn:s=>{ s.flags.trainNet = true; },
      msg:"一周下来你加了三十七个微信，记住了其中十来个人的单位和分管。\n\n十年后你查过一次：那四十个人里，两个进了省厅，一个出了事，五个还在原地。\n\n你确实用上过其中三个。也确实有人用上过你。" },
    { t:"认真听课，笔记做满一本", cost:2, eff:{merit:9,network:-4},
      fn:s=>{ s.ability = cl2(s.ability + 7); },
      msg:"你是全班唯一一个把所有课都听完的人，包括最后那节没人去的。\n\n讲课的老教授散场时问了你一句：你是哪个单位的？\n\n这句话在四年后帮了你一次，你到现在也不知道是怎么帮的。\n\n【能力大幅提升】" },
    { t:"请了三天假回家", eff:{family:12,network:-11,health:5},
      msg:"你回家陪了三天。那三天很平常，做饭、散步、把阳台收拾了一下。\n\n结业时你没拿到「优秀学员」，全班有十二个人拿到了。\n\n这件事对你的仕途没有任何影响。你后来也确实没想起过它。" },
  ]},

{ id:"jiaban_fei", w:11, cd:7, cond:s=>s.rank<=2 && s.age<=40, tag:"办公室",
  title:"调休",
  text:s=>{
    const t = nth("jiaban_fei");
    if(t<=1) return `这个月你加了六十三个小时的班。\n\n单位没有加班费，只有调休。你的调休余额现在是十一天半。\n\n你去问过怎么休。人事科的回答是：随时可以，报主任批。\n\n主任的回答是：你先把手头这个弄完。`;
    return `调休余额：四十七天。\n\n这个数字已经大到有点滑稽了。你算过，如果一次性休完，你可以从元旦躺到二月中旬。\n\n你也算过另一件事：这四十七天是用一千一百多个小时换的。`;
  },
  opts:[
    { t:"申请休三天，就三天", cost:1, eff:{health:9,family:9,merit:-5},
      msg:"批下来了，很顺利。\n\n第一天你睡到十点半，醒来盯着天花板看了很久。第二天你去了趟超市，买了很多用不上的东西。第三天下午三点，主任打来电话问一个数据。\n\n你在家里打开电脑，查了四十分钟。" },
    { t:"不休了，攒着", eff:{merit:6,health:-6},
      msg:"你把这件事从脑子里删掉了。\n\n那些天数一直在系统里挂着，像一笔永远不会兑现的存款。\n\n退休那年你查了一次余额：一百零四天。人事科的小姑娘说，这个清零。你说好。" },
    { t:"跟主任认真谈一次休假的事", cost:2, eff:{network:-7,merit:4,health:6},
      msg:"你说得很直接：这样下去人会坏掉。\n\n主任听完，沉默了一会儿，说了句你没想到的话：我知道。我也没休过。\n\n他后来给你批了五天。你去了趟海边，那五天他一个电话都没打。\n\n这件事你记了很久，比那五天本身久得多。" },
  ]},

{ id:"laotongzhi", w:11, cond:s=>s.rank<=1 && s.age<=30, once:true, tag:"办公室",
  title:"老周",
  text:`科室里有位老同志，五十七岁，还是科员。\n\n他不争、不抢、不加班，每天准时来准时走，桌上永远只有一个搪瓷缸和一份当天的报纸。\n\n别人私下叫他「老同志」，语气里有一半是同情。\n\n有天他忽然叫住你，说：那份材料第三页的数据，跟去年的对不上。`,
  opts:[
    { t:"回去查，果然对不上", cost:1, eff:{merit:9,network:6},
      fn:s=>{ s.ability = cl2(s.ability + 5); },
      msg:"你查了两个小时，发现是去年的口径改过一次，没人告诉你。\n\n改完你去谢他。他摆摆手，说：我在这儿坐了三十年，别的不会，就会看数。\n\n后来他教了你很多这样的东西——都不是能写进材料的东西，但每一样都让你少走过一次弯路。\n\n【能力提升】" },
    { t:"客气地应了一声，没当回事", eff:{merit:-7,network:-3},
      msg:"材料交上去了。半个月后上级来核，发现了那处数据。\n\n事情不大，但主任在会上说了句「基础工作要扎实」。\n\n散会后老同志从你桌边走过，什么也没说。他连看都没看你。这比说什么都难受。" },
    { t:"顺口问他：您怎么没往上走过", cost:1, eff:{network:5,merit:3,family:4},
      msg:"他笑了一下，说：年轻时候争过，没争上，后来就不争了。\n\n然后他说了一句你当时没听懂的话：这个地方不缺想上去的人，缺的是还愿意把数看一遍的人。\n\n三十年后你退休那天，办公室最里面也坐着一个不争的老同志。你路过他桌边，忽然很想坐下跟他聊两句，但你没有。" },
  ]},

{ id:"gongzhonghao", w:10, cd:8, cond:s=>s.rank<=3 && s.age<=45, tag:"工作",
  title:"阅读量",
  text:s=>{
    const t = nth("gongzhonghao");
    if(t<=1) return `单位公众号有阅读量指标：每篇不低于五百。\n\n全局在编四十七人。\n\n办公室的通知写得很客气：请各位同志转发至朋友圈，并动员亲友阅读。`;
    return `又到季度考核。这次的指标加了一项：单篇转发不低于八十。\n\n你翻了翻自己的朋友圈，最近三个月一共发了十一条，十一条全是单位的推送。\n\n你已经很久没有在朋友圈里说过一句自己的话了。`;
  },
  opts:[
    { t:"发朋友圈，还@了几个熟人", eff:{network:-5,merit:5,family:-3},
      msg:"阅读量凑够了。\n\n有个大学同学在下面评论：你现在朋友圈只发这个了。\n\n你回了个笑脸。那天晚上你翻了很久自己的朋友圈，翻到五年前，那时候你还会拍晚饭。" },
    { t:"自己刷，一条一条点开", eff:{merit:3,health:-4},
      msg:"你用三个设备刷到了四百七十，剩下的三十是同事帮的。\n\n数字达标了。后台显示平均阅读时长四秒。\n\n没有人关心那四秒。" },
    { t:"在会上提一句这个指标没意义", cost:1, eff:{merit:7,network:-13},
      msg:"你说得很克制，只讲了阅读时长四秒这个数据。\n\n会议室安静了两秒，然后办公室主任说：这个是上面定的。\n\n指标没有取消。但从那以后，再没有人在群里@过你转发。这算是一种解脱，也算是一种代价。" },
  ]},

{ id:"huibao1", w:11, cond:s=>s.rank<=2 && s.age<=34, once:true, tag:"工作",
  title:"三分钟",
  text:`科室要向局领导汇报工作，主任临时有事，让你上。\n\n给你三分钟。\n\n你准备了两个晚上，稿子改了九遍，最后背下来了。你在洗手间的镜子前面对着自己练过四次。`,
  opts:[
    { t:"照背，一字不差", cost:1, eff:{merit:8,network:5,health:-3},
      msg:"三分钟，两分五十二秒讲完，一个字没错。\n\n局长点了点头，说了句「不错」，然后问了个问题。\n\n那个问题不在你的稿子里。你愣了三秒，然后老老实实说：这个我回去查一下。\n\n局长说好。散会后主任跟你说：那三秒比前面两分五十二秒重要。" },
    { t:"开头两句就脱稿了", cost:2, eff:{merit:11,network:-4,health:-6},
      msg:"你讲到第二句就发现自己在念稿，然后你把稿子合上了。\n\n剩下的两分钟你讲得磕磕绊绊，但讲的是真的东西——哪儿卡住了、为什么卡住、你觉得该怎么办。\n\n局长听完没说话，隔了几秒才说：你们科室这个情况，我第一次听人这么说。\n\n主任那天晚上没批评你，也没表扬你。他只是让你把刚才讲的写成一页纸。" },
    { t:"太紧张，越讲越快", eff:{merit:-5,network:-4,health:-5},
      msg:"你一分四十秒就讲完了，快到局长以为你还没开始。\n\n他说：还有吗？\n\n你说没有了。\n\n回到座位上你才发现自己后背全湿了。这件事你记了很多年，久到后来你自己主持会议时，看到年轻人讲得太快，会说一句：不着急，时间够。" },
  ]},

{ id:"geshi", w:11, cd:9, cond:s=>s.rank<=2 && s.age<=38, tag:"工作",
  title:"格式",
  text:`材料退回来了，主任用红笔圈了七处。\n\n七处全是格式：一级标题该用黑体三号，你用了二号；正文行距应该是固定值二十八磅，你用了一点五倍；页码位置错了；「二〇二六年」的「〇」你打成了数字零。\n\n内容一个字没提。`,
  opts:[
    { t:"全部改对，顺便做了个模板", cost:1, eff:{merit:6,network:6},
      fn:s=>{ s.ability = cl2(s.ability + 4); },
      msg:"你按《党政机关公文格式》做了套模板，一键排版。\n\n主任用了以后再没圈过你的格式。他改用红笔圈内容了——那才是真正开始学东西的时候。\n\n【能力提升】" },
    { t:"改了，心里憋着", eff:{merit:3,health:-5,network:-3},
      msg:"你改到晚上十点，改的时候一直在想：这七处有哪一处影响了这份材料要说的事。\n\n答案是没有。\n\n但你后来也用红笔圈过别人的格式，圈得比主任还细。你圈的时候想起过这个晚上，圈完还是照样交了出去。" },
    { t:"问主任：内容有没有问题", cost:1, eff:{merit:9,network:-5},
      msg:"主任抬头看了你一眼，说：内容还行。\n\n然后他补了一句：内容还行的材料很多，格式对的不多。你要是想让人看你的内容，先得让人愿意翻开它。\n\n这句话有点强词夺理，但你后来发现它基本是对的。" },
  ]},

{ id:"bianzhi", w:11, cond:s=>s.rank<=1 && s.age<=32, once:true, tag:"办公室",
  title:"编制",
  text:`科室里有两个人干着几乎一样的活：一个在编，一个是聘用制。\n\n工资差一截，五险一金差一截，年底那笔差得更多。但真正的差别不在钱上——在开会时谁能进那间屋子，在名单出来时谁的名字有资格出现。\n\n聘用制那位比你早来四年，业务比你熟得多。今天他帮你改完了一份材料，笑着说：这个我在行。`,
  opts:[
    { t:"把他的名字署在材料上", cost:1, eff:{merit:-3,network:11,family:3},
      msg:"你在报送稿的落款处加了他的名字。\n\n办公室退了回来，说聘用人员不署名，这是规矩。\n\n你又送了一次，还是退了。第三次你没送，直接跟主任说了这件事。主任沉默了一会儿，说：我知道他行。但这个我改不了。\n\n那年年底，他拿到了一笔「特殊贡献奖」，是主任自己想的名目。" },
    { t:"什么也没做，材料照常交", eff:{merit:6,network:-4},
      msg:"材料很顺利。你的名字在落款上。\n\n他也没说什么，第二天照常帮你改下一份。\n\n三年后他离职了，去了一家企业，工资是这边的两倍多。走的那天科室凑钱请他吃饭，他喝了不少，最后说了句：其实我挺喜欢这个工作的。\n\n没人接话。" },
    { t:"私下问他有没有想过考", cost:1, eff:{network:7,merit:2},
      msg:"他说考过，三次，最后一次差两分。\n\n然后他说：三十五岁以后就不能考了。我今年三十四。\n\n那顿饭之后你再没提过这个话题。第二年他没再报名，你也没问为什么。" },
  ]},

{ id:"pizhu", w:11, cd:8, cond:s=>s.rank<=3 && s.age<=44, tag:"工作",
  title:"批示",
  text:s=>{
    const t = nth("pizhu");
    if(t<=1) return `一份材料转回来了，右上角有领导的批示，四个字。\n\n第一个字大概是「请」，第二个字看不出来，第三个像「阅」也像「办」，最后一个是签名。\n\n办公室的人围着看了十分钟，得出三种不同的解读，对应三种完全不同的做法。`;
    return `又是四个字。\n\n这些年你已经能认出好几位领导的笔迹了，认字的本事全是这么练出来的。\n\n但今天这份是新来的那位签的。你第一次见他的字。`;
  },
  opts:[
    { t:"去问秘书", cost:1, eff:{network:9,merit:4},
      msg:"秘书扫了一眼，说：「请阅研办」。意思是你们先研究，拿个意见上来。\n\n你道了谢。他说：以后这种事直接问我，别在下面猜。\n\n这句话价值很大。从那天起你多了一条线——不是关系，是一条能问清楚意思的通道。" },
    { t:"按最重的那种理解办", cost:2, eff:{merit:9,health:-6,network:-3},
      msg:"你按「立即办理并上报」的规格做了，动员了三个人干了四天。\n\n后来才知道那四个字是「请阅知」——看看就行。\n\n没有人批评你。但主任说了一句：下次先问。这四个字他说得很平，你听得很重。" },
    { t:"按最轻的理解，先放着", eff:{merit:-8,risk:6},
      msg:"你按「阅知」处理了，归档。\n\n十天后领导问起进展。那一刻办公室里很安静。\n\n事情后来补上了，加了两个通宵。从那以后，凡是看不清的批示你都会去问——不是因为怕，是因为你终于明白猜的成本有多高。" },
  ]},

{ id:"qinqi_ban", w:11, cd:7, cond:s=>s.rank>=1 && s.rank<=4 && s.age<=52, tag:"人情",
  title:"你不是在里面吗",
  text:s=>{
    const t = nth("qinqi_ban");
    if(t<=1) return `一个远房表哥打来电话，说他儿子的准考证丢了，问你能不能「帮着弄一下」。\n\n你解释了三遍这个事怎么补办、去哪儿补办、带什么材料。\n\n他听完说：你不是在里面吗。`;
    return `又一个电话。这次是营业执照的事，说系统里卡了半个月。\n\n你问他材料齐不齐，他说不知道。你问他有没有去大厅问过，他说没有。\n\n他说：我不是有你吗。`;
  },
  opts:[
    { t:"耐心讲清楚流程，让他自己去办", eff:{merit:4,family:-6,network:2},
      msg:"你讲了十分钟，讲得比办事大厅的窗口还清楚。\n\n他半信半疑地去了，两个小时就办完了。\n\n他后来跟别的亲戚说：找他没用，他就会讲政策。这句话传回你耳朵里的时候，你笑了一下，然后有点想解释，最后没解释。" },
    { t:"帮他打个电话问一声", cost:1, eff:{network:-4,family:6,risk:7},
      msg:"你打了一个电话，只是问进度，没说别的。\n\n对方很客气，第二天就办好了。\n\n表哥很高兴，逢人就说这事是你办的。你解释过一次，没人信——在他们的理解里，能问出进度的人，就是能办事的人。\n\n从那以后，这样的电话每年都有几个。" },
    { t:"说：这个真办不了", eff:{family:-11,health:4,risk:-3},
      msg:"你说得很干脆。他在那头沉默了几秒，说了句「行吧」就挂了。\n\n那年过年你没回老家。你妈打电话说，你表哥家没来拜年。\n\n你说哦。你妈说，你那个工作啊。然后就没往下说了。" },
  ]},

{ id:"tijian_di", w:10, cond:s=>s.rank<=2 && s.age>=28 && s.age<=38, once:true, tag:"身体",
  title:"第一次体检",
  text:s=>`入职后第一次单位体检。\n\n报告上有两项箭头朝上，都是轻度。医生说没什么大事，注意作息、少喝酒、多运动。\n\n你今年${cn(s.age)}岁。你上一次运动是大学的体育课。`,
  opts:[
    { t:"办了张健身卡", cost:1, eff:{money:-1.8,health:9,family:-3},
      fn:s=>{ s.flags.gymCard = true; },
      msg:"卡办了一年，你去了十一次。\n\n但那十一次里有一次你在跑步机上想通了一个卡了两周的问题，回办公室半小时就写完了。\n\n这张卡后来每年都续，去的次数逐年递减，最后变成了一种仪式——你续的不是卡，是那个还打算对自己好一点的想法。" },
    { t:"开始每天走路上班", eff:{health:7,merit:-2},
      msg:"四点二公里，五十分钟。头一个月很痛苦，第三个月你已经离不开这段路了。\n\n很多年后你在一次谈话里说过：我这辈子想明白的事，一半是在那条路上想明白的。\n\n对方以为你在说什么高深的东西。你说的是字面意思。" },
    { t:"把报告塞进抽屉", eff:{health:-4,merit:4},
      fn:s=>{ s.flags.ignoredFirst = true; },
      msg:"你太忙了。那两个箭头看起来一点也不急。\n\n第二年那两项还在，第三年多了一项。\n\n你后来翻到过第一份报告，看着那两个小小的箭头，忽然意识到你的身体从那一年就开始给你写信了，只是你一封也没回。" },
  ]},

/* ---------- 高位加厚：正厅到副国级 ---------- */
{ id:"mishu_huan", w:11, cond:s=>s.rank>=6 && !s.flags.mishuHuan, once:true, tag:"人事",
  title:"换秘书",
  text:`跟了你六年的秘书要走了，去下面一个县当副职。\n\n这是好事，是你替他争取的。\n\n新来的那个二十九岁，材料写得漂亮，眼睛很亮，第一天就把你桌上的东西按你从没说过的顺序摆好了——他打听过。`,
  opts:[
    { t:"照旧用，慢慢带", eff:{network:9,merit:4},
      fn:s=>{ s.flags.mishuHuan=true; },
      msg:"你花了半年才习惯新的节奏。他学得很快，快到有点让你不安。\n\n有一次你随口说了句「这个事要不缓缓」，第二天他就把三份相关材料都撤了回来。\n\n你没说什么。但你从那天起，说话开始更小心——因为你发现自己现在随口一句话，是有重量的。" },
    { t:"跟他把话说在前面", cost:1, eff:{network:6,merit:7,risk:-6},
      fn:s=>{ s.flags.mishuHuan=true; s.flags.mishuClean=true;
        s.pendMsg="你把他叫进来，说了三件事：我说的话不等于指示；不确定的事直接问我；任何人拿我的名字找你办事，你告诉我。\n\n他愣了一下，说记住了。\n\n后来他真的告诉过你两次。其中一次，让你躲过了一件很麻烦的事。\n\n【少了一条你自己都看不见的口子】"; } },
    { t:"还是让老的那个再留半年", eff:{network:-9,merit:5,family:3},
      fn:s=>{ s.flags.mishuHuan=true; },
      msg:"你跟组织上说了，把他的任命推迟了半年。\n\n他嘴上说没关系，但那半年他明显不如从前了——一个已经知道自己要走的人，很难再全心待在原地。\n\n半年后他走了。你们后来还联系，但那半年像一根小小的刺，谁也没提过。" },
  ]},

{ id:"jiedai_shang", w:11, cd:9, cond:s=>s.rank>=6, tag:"应酬",
  title:"接待",
  text:s=>{
    const t = nth("jiedai_shang");
    if(t<=1) return `上面来人调研，规格很高。\n\n方案报到你这儿：路线、点位、陪同人员、就餐标准、住宿安排，一共十一页。第八页写着「沿途环境整治」。\n\n你知道那六个字是什么意思——它意味着有一段路上的门头招牌要在三天内换成统一颜色。`;
    return `又是一份十一页的方案。\n\n这些年你签过很多份。每一份都很规范，每一份的第八页都写着差不多的话。\n\n今天你翻到第八页，停了一会儿。`;
  },
  opts:[
    { t:"照方案办，这是规矩", eff:{network:9,merit:4,risk:6},
      msg:"接待很成功，来的领导很满意，说这个地方精神面貌好。\n\n那条路上的招牌换了四十七块，花了十九万，走的是城市管理专项。\n\n半年后有几块开始掉漆。再没有人管过。" },
    { t:"把第八页划掉", cost:2, eff:{merit:11,network:-16},
      msg:"你在第八页上画了一道，写了两个字：不必。\n\n办公室主任来问了两次，你说不必就是不必。\n\n那天来的领导确实看到了没换的招牌，还问了一句「这条街是不是该整治一下」。你说正在做规划。\n\n没有人因此说什么。但从那以后，方案送到你这儿之前，第八页就已经不写了。" },
    { t:"留着，但把标准压到最低", cost:1, eff:{merit:7,network:3,risk:-3},
      msg:"你把「统一更换」改成了「破损的修一修」。\n\n最后修了九块，花了两万三。\n\n这不是一个能写进任何材料的决定。但那条街上有三十八家店，因为你这一笔，没有在三天之内被迫关门重装。" },
  ]},

{ id:"tongxue_lai", w:11, cd:10, cond:s=>s.rank>=5, tag:"人情",
  title:"老同学",
  text:s=>`大学同学来找你，二十多年没见。\n\n他现在做建材生意，人胖了很多，一见面就说：老同学出息了。\n\n吃到一半他从包里拿出一份资料，说不是要你办什么，就是想让你「知道有这么个事」。\n\n资料的封面上印着一个项目名。那个项目正好在你分管的范围里。`,
  opts:[
    { t:"资料收下，事情不办", eff:{network:5,risk:9,merit:-2},
      msg:"你把资料带回了办公室，看了一遍，放进了抽屉。\n\n那个项目后来公开招标，他没中。\n\n他没再找过你。有一次同学群里有人提起他，说他生意不太好。你在群里没说话。\n\n那份资料你一直没扔，也说不上为什么。" },
    { t:"当场推回去，话说得很难听", eff:{network:-11,risk:-7,merit:6},
      msg:"你把资料推了回去，说了一句：这个饭我们以后还是别吃了。\n\n他脸涨得通红，说了句「至于吗」，然后走了。\n\n同学群里后来有过一阵议论。有人说你不念旧情，也有人私下发消息给你说：做得对。\n\n发消息那个人，后来自己出了事。" },
    { t:"跟他讲清楚该怎么正经参与", cost:2, eff:{network:7,merit:5,risk:3},
      msg:"你把资料还给他，然后花了四十分钟讲了这个项目的招标条件、资质要求、和他现在差在哪里。\n\n他听得很认真，最后说：早知道该这么弄。\n\n第二年他补齐了资质，中了一个小标段，规规矩矩做完了。\n\n这件事你从没跟任何人提过。它既不算功劳，也不算把柄，它只是一件对的事。" },
  ]},

{ id:"lou_ceng", w:10, cond:s=>s.rank>=5 && !s.flags.louCeng, once:true, tag:"人事",
  title:"楼层",
  text:`你的办公室搬到了更高一层。\n\n新办公室朝南，面积大了一倍，窗外能看见整条江。搬家那天用了两个小时。\n\n下午你想去楼下找人问个事，走到电梯口才反应过来：现在不是你去找他们，是他们上来找你。\n\n你在电梯口站了几秒，然后回了办公室。`,
  opts:[
    { t:"每周固定下楼转一圈", cost:1, eff:{merit:9,network:7,health:-3},
      fn:s=>{ s.flags.louCeng=true; s.flags.staysDown=true;
        s.pendMsg="你定了个规矩：每周三下午下去转一圈，不带秘书，不提前通知。\n\n头几次所有人都很紧张。第七八次之后，开始有人敢跟你说真话了。\n\n你后来能提前知道很多事——不是因为有人汇报，是因为你还在那些楼层里出现过。\n\n【你还听得见下面的声音】"; } },
    { t:"习惯了，让他们上来", eff:{merit:4,network:-5},
      fn:s=>{ s.flags.louCeng=true; },
      msg:"这很快就变得自然了，自然到你后来完全想不起自己曾经在那些楼层里待过十几年。\n\n有一次你需要一个具体数据，问了三个人，转了两天才拿到。\n\n那个数据就在四楼那间办公室的电脑里。你以前坐在那间办公室的第三张桌子。" },
    { t:"把办公室里多出来的地方隔了个会客区", cost:1, eff:{network:9,merit:2,money:-4},
      fn:s=>{ s.flags.louCeng=true; },
      msg:"你让人隔了个小会客区，摆了张矮桌和几把不那么正式的椅子。\n\n效果出乎意料：人坐在那儿说话，跟隔着办公桌完全不一样。\n\n有一次一个处长在那把椅子上坐了四十分钟，说了一件他憋了两年的事。\n\n那件事后来救了整个科室。" },
  ]},

{ id:"jianghua", w:10, cd:9, cond:s=>s.rank>=5, tag:"工作",
  title:"讲话的时候",
  text:s=>{
    const t = nth("jianghua");
    if(t<=1) return `全局大会，你在台上讲话。\n\n讲到第十四分钟的时候，你抬头扫了一眼台下。\n\n三百多个人，姿势出奇地一致：身体微微前倾，眼睛看着你，手上拿着笔。\n\n然后你注意到，前排有个年轻人的笔，从头到尾一个字都没落下去过。`;
    return `又是一次讲话。\n\n你现在能凭台下的空气判断自己讲得怎么样——不是掌声，是那种细微的声音：翻页的、挪椅子的、清嗓子的。\n\n今天的空气很安静。安静到你分不清是他们在听，还是他们已经不听了。`;
  },
  opts:[
    { t:"照稿讲完，一句不多", eff:{merit:6,network:4},
      msg:"四十二分钟，掌声适度。\n\n散会后没有一个人跟你讨论过其中任何一句话。\n\n这份稿子后来印进了汇编，你在书架上摆了一本，一直没翻开过。" },
    { t:"合上稿子，讲了十分钟自己的话", cost:2, eff:{merit:11,network:-7,health:-4},
      msg:"你讲了当年在青阳县那间办公室的事，讲了那摞二十七公分高的材料，讲了你到现在还记得的第一份被退回来的稿子。\n\n台下有人笑了，也有人低下了头。\n\n这段话没有进汇编。但那之后的很多年里，陆续有人跟你提起过它，最晚的一次是在你退休以后。" },
    { t:"讲完后留了十分钟给提问", cost:2, eff:{merit:9,network:-4,risk:5},
      msg:"前三分钟没有人举手。\n\n第四分钟，最后一排站起来一个人，问了一个很不客气的问题。\n\n你如实答了，包括那句「这个我们做得不好」。\n\n从那以后，你的会上开始有人举手了。也从那以后，有人在别的场合说你「不够讲究」。" },
  ]},

{ id:"fengsheng", w:0, force:true, tag:"风 声",
  title:"风声紧",
  text:s=>`巡视的通知还没正式下来，但该知道的人都知道了。\n\n这半年会有一段空窗期——过了这半年，很多事就不是你自己能决定的了。\n\n你把这些年过了一遍。有几件，是经得起翻的；有几件，不是。\n\n你现在的风险值是 ${Math.round(s.risk)}。`,
  opts:[
    { t:"该退的退，该断的断", cost:3, eff:{network:-14,health:-7},
      fn:s=>{ const back = Math.min(s.money * 0.4, (s.grey || 0) * 0.55);
        s.money = Math.max(0, s.money - back); s.grey = Math.max(0, (s.grey || 0) - back);
        s.risk = cl(s.risk * 0.45, 0, 140);
        s.pendMsg = "你用了三个月，把能退的一样一样退回去，把能断的关系一条一条断掉。\n\n有人不肯收，说这不合规矩。你说我知道，你收下。\n\n退完那天你在办公室坐到很晚，第一次觉得这间屋子有点空。\n\n【退出 " + yuan(back,0) + " · 风险大幅下降】"; } },
    { t:"把该说的先说了，主动一点", cost:4, eff:{merit:-13,network:-20,health:-6},
      fn:s=>{ s.risk = cl(s.risk * 0.28, 0, 140); s.flags.confessed = true;
        s.pendMsg = "你在巡视组进驻之前，自己去说了。\n\n谈了两次，写了一份东西。处理不重，但档案里从此有了一页。\n\n巡视组来的时候，你是这栋楼里最不紧张的人之一。\n\n【风险大幅下降 · 档案里留下一页 · 但巡视时这一页很管用】"; } },
    { t:"花钱找人，把几件事抹平", cost:2,
      cond:s=>s.money >= 60,
      fn:s=>{ const cost = Math.min(s.money * 0.5, 40 + 16 * s.rank);
        s.money = Math.max(0, s.money - cost);
        if(chance(0.62)){ s.risk = cl(s.risk - 26, 0, 140);
          s.pendMsg = "钱分了几次给出去，中间隔了很久。\n\n巡视组来的时候，有几样东西他们没有调到。\n\n你花了 " + yuan(cost,0) + "，买回来的东西没有名字，也没有凭据。\n\n【花 " + yuan(cost,0) + " · 风险 −26】"; }
        else { s.risk = cl(s.risk + 12, 0, 140);
          s.pendMsg = "钱给出去了，事情没办成。\n\n更糟的是，现在多了一个人知道你在这个节骨眼上找过人。\n\n【花 " + yuan(cost,0) + " · 风险 +12】"; } } },
    { t:"什么也不做，就这么过去", eff:{health:-9},
      fn:s=>{ s.flags.stoodStill = true;
        s.pendMsg = "你什么也没动。\n\n道理你想得很清楚：这个时候有任何动作，本身就是动作。\n\n那半年你照常上班、照常开会、照常在食堂排队。只有你自己知道，你每天早上醒来的第一件事是听走廊里有没有不该有的脚步声。"; } },
  ]},

/* ---------- 正科：第一次手底下有人 ---------- */
{ id:"diyige_xiashu", w:12, cond:s=>s.rank===2 && !s.flags.firstSub, once:true, tag:"办公室",
  title:"第一个下属",
  text:`科室分来一个应届生，二十三岁，坐在你当年那张桌子上。\n\n他第一天穿了西装，第二天就不穿了。第三天他问你：这份材料要写多少字？\n\n你想了想，说：写到说清楚为止。\n\n他愣了一下，显然这不是他想要的答案。`,
  opts:[
    { t:"手把手带，改稿改到深夜", cost:2, eff:{merit:6,network:9,health:-6},
      fn:s=>{ s.flags.firstSub=true; s.flags.taughtOne=true;
        s.pendMsg="你陪他改了七稿，每一稿都告诉他为什么改。\n\n他后来写得很好，好到第二年就被借调走了。\n\n走之前他请你吃饭，说了一句：我以后带人也这么带。\n\n很多年后你听说他真的这么带人。这大概是你这辈子做过的最划算的一笔投资。"; } },
    { t:"给个模板，让他自己琢磨", eff:{merit:5,health:3,network:-3},
      fn:s=>{ s.flags.firstSub=true; },
      msg:"你把自己这些年攒的模板打包发给他，说：照着写，不懂再问。\n\n他没再问过。三个月后他写得也还行——不够好，但够用。\n\n一年后他调走了。你们后来在走廊里遇到过几次，点头，没说过话。" },
    { t:"重活都给他，说这是锻炼", eff:{merit:9,health:6,network:-11},
      fn:s=>{ s.flags.firstSub=true; },
      msg:"你把最琐碎的活都给了他，理由充分：年轻人要多历练。\n\n他干了一年半，然后考走了。\n\n新来的那个你还是这么安排。第三个也是。到第四个的时候，办公室里已经没人愿意来你这个科室了。你花了很久才明白这中间的关系。" },
  ]},

{ id:"keshi_qian", w:11, cd:8, cond:s=>s.rank>=2 && s.rank<=4, tag:"工作",
  title:"办公经费",
  text:s=>{
    const t = nth("keshi_qian");
    if(t<=1) return `科室今年的办公经费下来了，比去年少了两成。\n\n打印纸、墨盒、下乡的油钱、加班的盒饭，都从这里出。\n\n办公室的意思是：不够就想办法。\n\n「想办法」这三个字在这个系统里有很多种意思，其中没有一种是「向上级申请增加」。`;
    return `又是这个数。\n\n这些年你已经很擅长这件事了：哪些开支能报、报到哪个科目、什么时候报最容易过。\n\n你有时候想，这套本事如果用在别的地方，能干成不少事。`;
  },
  opts:[
    { t:"自己贴一点，别让下面为难", eff:{money:-3.5,network:11,merit:3},
      msg:"你垫了几千块，谁也没说。\n\n下面的人后来知道了，是从财务那边传出来的。\n\n从那以后科室里有件事变得不一样了：你让干什么，没有人再问为什么。" },
    { t:"跟兄弟科室匀一匀", cost:1, eff:{network:7,merit:4,risk:4},
      msg:"你找了两个科室调剂，账目上做得很干净。\n\n事情办成了，人情也欠下了。\n\n年底那两个科室各来找过你一次，也都是调剂的事。这条线一旦开了，就没有关的道理。" },
    { t:"把该省的都省了，下乡改坐班车", eff:{merit:-4,health:-6,network:-5},
      msg:"你把下乡的车换成了班车，加班的盒饭换成了自带。\n\n经费够了，年底还剩了一点。\n\n办公室在会上表扬了你们科室「厉害行节约」。第二年你们的经费又少了一成——因为去年用不完。" },
  ]},

{ id:"dingtou", w:11, cd:10, cond:s=>s.rank>=2 && s.rank<=5, tag:"人事",
  title:"换了个头儿",
  text:s=>{
    const t = nth("dingtou");
    if(t<=1) return `你的直接上级调走了，新来的是外单位过来的，四十出头，此前从没在这个口子上干过。\n\n第一次见面他跟你握手，说：以后多靠你了。\n\n这句话有两种听法。你到现在也不确定他是哪一种。`;
    return `又换了一个。\n\n这些年你送走过四位，迎来过四位。你已经形成了一套流程：头三个月不主动、不表态、不站队，只把手上的事做干净。\n\n三个月之后，路线就自己出来了。`;
  },
  opts:[
    { t:"该怎么干怎么干，不迎不拒", eff:{merit:7,network:-3,health:3},
      msg:"你没有变。三个月里你交上去的每一份东西都和以前一样。\n\n第四个月他在会上点了你的名，说：这个同志的材料我放心。\n\n这句话来得比你预想的晚，但它比任何一次主动靠近都结实。" },
    { t:"主动去汇报，把情况摸清楚", cost:2, eff:{network:12,merit:2},
      msg:"你准备了三页纸，讲了四十分钟，把这个口子这些年的来龙去脉都讲了。\n\n他听得很认真，中间问了七个问题。\n\n从那以后你成了他理解这个单位的一个入口。这是好事，也意味着你从此被绑在了他这条船上。" },
    { t:"先看看，别急着表态", eff:{merit:-3,network:-6,risk:-4},
      msg:"你观望了半年。\n\n半年后局面清楚了，你也确实没站错。\n\n但那半年里有几件该推的事没推动，有两个该说话的场合你没说话。清楚是清楚了，代价是这半年在你的履历上是空白的。" },
  ]},

/* ---------- 正处：一个单位的最后一个签字人 ---------- */
{ id:"banzihui", w:12, cd:7, cond:s=>s.rank>=4 && s.rank<=6, tag:"抉择",
  title:"班子会",
  text:s=>{
    const t = nth("banzihui");
    if(t<=1) return `班子会上讨论一件事，你的意见和其他三位都不一样。\n\n你说的是对的——你有数据，有依据，有过去三年的教训。\n\n但这是四个人的会，你是一票。`;
    return `又一次三比一。\n\n这些年你已经能提前判断出结果了：会前谁跟谁通过气，谁的表态里有几分是真的。\n\n今天这件事，你还是那一票。`;
  },
  opts:[
    { t:"服从多数，会议纪要照实记你的保留意见", cost:1, eff:{merit:5,network:4,risk:-7},
      fn:s=>{ s.flags.paperTrail = true;
        s.pendMsg="你在纪要上留了一行：某某同志持保留意见。\n\n事情按多数意见办了，一年后出了问题。\n\n复盘的时候，那一行字被翻了出来。没有人因此表扬你，但也没有人再让你为那件事负责。\n\n从那以后你养成了一个习惯：凡事留一份底。\n\n【档案里从此有了记录的习惯】"; } },
    { t:"会上坚持，说服他们", cost:3, eff:{merit:9,network:-13,health:-6},
      msg:"你讲了二十分钟，把三年的数据一条一条摆出来。\n\n最后是二比二，一把手说：那就再研究研究。\n\n「再研究研究」的意思你懂——这件事从此没有下文。但至少它也没有按错的方向办下去。\n\n代价是那三位从此都知道，你是会在会上顶人的那种人。" },
    { t:"会后单独找一把手", cost:2, eff:{network:9,merit:6},
      msg:"你没在会上说，散会后去了他办公室，只说了十分钟。\n\n第二周他在另一个场合把方案调了一半。\n\n没有人知道是你说的。你也从此明白了一件事：在这个系统里，正确不重要，正确在哪儿说出来才重要。" },
  ]},

{ id:"gaozhuang", w:11, cd:9, cond:s=>s.rank>=4 && s.rank<=7, tag:"危机",
  title:"一封信",
  text:`一封实名举报信送到了上级，告的是你的副职。\n\n信里说了三件事。你看完之后心里很清楚：一件是编的，一件说不清，还有一件是真的。\n\n上级把信转给了你，附了六个字：请阅，妥善处理。`,
  opts:[
    { t:"真的那件查清楚，另外两件澄清", cost:3, eff:{merit:11,network:-14,health:-7},
      msg:"你没有和稀泥。查实的那件报了上去，副职受了处分，调离。\n\n另外两件你写了很详实的说明，把编造的部分一条一条驳了回去。\n\n举报人不满意，觉得你在包庇。被查的人也不满意，觉得你不讲情面。\n\n只有上级满意。这可能是你在这个位置上做过的最不讨好、也最正确的一件事。" },
    { t:"内部谈话，都压下来", cost:2, eff:{network:9,risk:16,merit:-6},
      msg:"你把副职叫来谈了两个小时，他承认了那一件，保证不会有下次。\n\n你回复上级：经核查，反映问题不实。\n\n这份回复上有你的签名。它现在躺在两个地方：上级的档案里，和写信那个人的手机相册里。" },
    { t:"原样退回上级，说该由上级处理", cost:1, eff:{network:-11,merit:3,risk:-6},
      msg:"你在文件上写了「我单位与被反映人有直接工作关系，建议由上级核查」，退了回去。\n\n上级查了，结论和你的判断一样。\n\n你什么责任都没担，也什么威信都没立。副职后来知道了这件事，从此对你客气得像对一个外人。" },
  ]},

{ id:"nianqingren_zou", w:11, cd:9, cond:s=>s.rank>=4 && s.rank<=7, tag:"人事",
  title:"他要走",
  text:s=>`你手底下最能干的那个年轻人递了辞职报告。\n\n三十一岁，正科，材料写得比你当年好。他去的那家企业开的价是这边的三倍多。\n\n他坐在你对面，把报告放在桌上，说：领导，我想清楚了。\n\n他确实想清楚了——你从他的表情就看得出来。`,
  opts:[
    { t:"劝。跟他讲这条路走下去是什么样", cost:2, eff:{network:9,merit:-3,health:-4},
      msg:"你讲了四十分钟，讲得很诚恳，也很具体：几年一个坎、哪些人熬过来了、你自己是怎么熬的。\n\n他听完说：领导，您说的这些我都信。可是我算了一下，我熬到您这个位置要二十年，二十年后我五十一。\n\n他还是走了。你没有再拦。" },
    { t:"不劝，帮他把手续办利索", eff:{network:11,family:3},
      msg:"你一个字没劝，只说了句「有事随时找我」，然后让办公室三天就把手续办完了。\n\n他走的时候有点意外。\n\n六年后他的公司要办一件事，卡在流程上。他没找你，是通过别人问的。你按规矩办了，办得很快。\n\n他后来托人带话：谢谢领导当年那三天。" },
    { t:"想办法给他一个位置", cost:3, eff:{merit:-7,network:-9,risk:9},
      msg:"你去争了一个副科的空缺，用了两次人情，说了一些不太好听的话。\n\n他留下了。\n\n三年后他还是走了。走之前他跟你说：那个位置我知道您是怎么争来的，可是领导，我要的不是位置。\n\n你没听懂。或者说，你听懂了，只是不愿意承认自己听懂了。" },
  ]},

/* ---------- 正厅：你说的话开始有重量 ---------- */
{ id:"yijuhua", w:11, cd:8, cond:s=>s.rank>=6, tag:"抉择",
  title:"你随口一句",
  text:s=>{
    const t = nth("yijuhua");
    if(t<=1) return `调研的时候你在车上随口说了一句：那个片区的路是不是该修了。\n\n三个月后，那条路开始施工了。\n\n没有人来问过你的意思，没有立项讨论，也没有人告诉你这件事——你是路过时看见的。\n\n你在车里坐了很久。这条路确实该修。问题不在这儿。`;
    return `又一件事，是因为你说了一句什么。\n\n你现在说话之前会先停半秒。这半秒不是在斟酌措辞，是在算：这句话出去之后，会有多少人开始动。`;
  },
  opts:[
    { t:"开会立规矩：我的话不是指示", cost:2, eff:{merit:11,network:-9},
      fn:s=>{ s.flags.paperTrail = true;
        s.pendMsg="你在班子会上讲了这件事，讲得很重。你定了个规矩：凡是要动钱动人的，必须有会议纪要，我口头说的一律不算。\n\n有人觉得你小题大做。\n\n三年后邻市出了一件类似的事，一个厅长因为「一句话工程」被问责。你们这边什么事也没有。\n\n【凡事留一份底】"; } },
    { t:"这次算了，但以后自己少说", eff:{merit:4,network:3,health:-3},
      msg:"你什么也没说，那条路修完了，质量还不错。\n\n从那以后你在下面说话变得很少。少到有人觉得你架子大。\n\n其实你只是发现，自己已经没有随口说话的资格了。" },
    { t:"顺水推舟，把这条路做成个样板", cost:2, eff:{merit:14,network:6,risk:11},
      msg:"你把这条路纳入了当年的重点项目，配了资金、配了班子，做得很漂亮。\n\n年底它成了全省的样板，来参观的人排到了第二年三月。\n\n只有你自己知道，这个样板是从一句没有任何依据的话开始的。这件事你想起来就有点不踏实，但你没跟任何人说过。" },
  ]},

{ id:"laobuxia_shi", w:11, cond:s=>s.rank>=6 && !s.flags.oldSubFell, once:true, tag:"危机",
  title:"你带过的那个人",
  text:`你带了十几年的一个老部下被带走了。\n\n他现在是下面一个县的一把手，是你一手推上去的。名单出来那天，有人给你打电话，第一句话是：您知道了吗。\n\n你放下电话，坐了很久。\n\n你想起的不是他出的事，是他二十六岁那年，抱着一摞材料站在你办公室门口，不敢进来。`,
  opts:[
    { t:"该说的都说清楚，包括当年是我推荐的", cost:3, eff:{merit:6,network:-16,health:-11,risk:-14},
      fn:s=>{ s.flags.oldSubFell=true;
        s.pendMsg="你主动去说明了情况，把推荐经过、当年的考察意见、后来的每一次交往都写了进去。\n\n组织上认可了你的态度。你受了个提醒谈话，没别的。\n\n有人说你不够仗义。也有人在很久以后跟你说了一句：那种时候还敢把自己写进去的人不多。\n\n【风险下降 · 但你在某些人眼里从此不一样了】"; } },
    { t:"什么都不说，等着", cost:2, eff:{network:9,risk:20,health:-9},
      fn:s=>{ s.flags.oldSubFell=true; },
      msg:"你没有主动说任何事。找你了解情况的时候，你只答问到的，一个字不多。\n\n事情过去了。\n\n但从那以后，凡是有你参与过的干部推荐，材料上都会多走一道程序。没有人告诉过你为什么。" },
    { t:"托人问问，能不能帮着说句话", cost:2, eff:{network:-9,risk:30,merit:-9},
      fn:s=>{ s.flags.oldSubFell=true; },
      msg:"你托了一个人。对方听完就说：这个事你别碰。\n\n你还是让他去问了。\n\n他后来回话说没办法。你说好，谢了。\n\n这通电话没有帮到任何人，但它现在存在于两个人的记忆里，其中一个不是你。" },
  ]},

{ id:"jijian_tongxue", w:10, cond:s=>s.rank>=3 && s.age>=38 && !s.flags.auditFriend && !s.flags.auditAsked, once:true, tag:"人情",
  title:"老同学在纪检",
  text:`大学同宿舍的老四，现在在省纪委。\n\n二十年没怎么联系，这次同学会他坐在你旁边。喝到一半他说了句：你们那个系统，最近不太平。\n\n然后他就转了话题，聊起了当年宿舍楼下的那家面馆。\n\n你端着杯子，忽然不知道该怎么接。`,
  opts:[
    { t:"什么也不问，就聊面馆", eff:{network:9,health:3},
      fn:s=>{ s.flags.auditFriend=true; s.flags.auditAsked=true;
        s.pendMsg="你顺着他聊了面馆，聊了老板娘，聊了当年谁欠了谁两块钱。\n\n一晚上你们没有再提工作。\n\n但从那以后，每年他都会给你打一两个电话，从来不说什么，只问一句「最近还好吧」。\n\n你后来慢慢听懂了：他打电话的时机，从来不是随机的。\n\n【纪检的老同学 · 有些风声你会比别人早一步听见】"; } },
    { t:"直接问：是不是有我们单位的事", cost:1, eff:{network:-11,risk:6},
      fn:s=>{ s.flags.auditAsked=true;
        s.pendMsg="他放下杯子看了你两秒，然后笑了，说：老同学，这个我不能说。\n\n那顿饭后面聊得都挺好，但有什么东西已经不一样了。\n\n他后来再没主动联系过你。你有时候会想，如果那天你没问那一句，会不会不一样。"; } },
    { t:"顺势请他吃个饭，单独的", cost:2, eff:{network:5,risk:16},
      fn:s=>{ s.flags.auditAsked=true;
        s.pendMsg="饭吃了，聊得很好，什么实质的东西都没说。\n\n你觉得这是一笔投资。\n\n三年后有一次核查，办案的人问过一句：你和某某某最近有没有单独吃过饭。\n\n那顿饭是三年前的事了。你才知道，有些账不是你自己在记。"; } },
  ]},

{ id:"digao", w:11, cd:9, cond:s=>s.rank>=3 && s.rank<=7 && !s.flags.paperTrail, tag:"工作",
  title:"底稿",
  text:`一件三年前的事被翻出来核查，问的是当时为什么那么定。\n\n办公室翻遍了档案，只找到最终件，找不到过程稿——谁提的、谁改的、哪一稿定的调子，全没有。\n\n最终件上有你的签字。`,
  opts:[
    { t:"从今往后凡事留底", cost:1, eff:{merit:4,network:-4},
      fn:s=>{ s.flags.paperTrail = true;
        s.pendMsg="这件事最后靠几个人的回忆圆过去了，圆得很勉强。\n\n你从那天起立了个规矩：所有过程稿归档，谁改的谁签，一份不删。\n\n办公室的人抱怨了半年。\n\n八年后又有一次核查，那次你们花了四十分钟就把整个过程还原了。抱怨过的那几个人，那天一句话没说。\n\n【凡事留一份底】"; } },
    { t:"这次先圆过去，以后再说", eff:{merit:-5,risk:11,health:-5},
      msg:"你们靠回忆和推断补了一份情况说明，逻辑基本自洽。\n\n核查过去了。\n\n但你心里清楚那份说明里有两处是猜的。这两处后来一直在你脑子里放着，每次有类似的核查，你都会先想起它们。" },
  ]},

{ id:"sishi", w:11, cond:s=>s.rank<=2 && s.age<=33, tag:"人情",
  title:"私事",
  text:`主任打电话来，说家里临时有事，问你能不能帮忙去学校接一下他儿子。\n\n现在是周三下午三点。你手上有个四点要交的东西。`,
  opts:[
    { t:"去接", eff:{network:11,merit:-5},
      msg:"你接到了孩子，送回家，还买了个面包给他。\n\n四点那个东西晚交了一小时，没人追究。\n\n从那以后主任家里的事你成了常客。这算好事还是坏事，你用了很多年才想明白：它是好事，但它有代价，代价是你从此不再只是个同事。" },
    { t:"说手上有活走不开", eff:{merit:4,network:-9},
      msg:"你说得很实在。他说没事没事，我再想办法。\n\n四点那个东西你按时交了，交得很漂亮。\n\n后来有个培训名额，去的是另一个人。那个人业务不如你。" },
    { t:"托同事去，自己继续干活", cost:1, eff:{network:3,merit:3},
      msg:"你找了个刚好没事的同事帮忙，两头都交代了。\n\n事情办成了，你也没耽误活。\n\n主任知道后笑了一下，说：这个小伙子会办事。\n\n「会办事」这三个字，比「稳」高一级。" },
  ]},

{ id:"gaozi", w:12, cond:s=>s.rank<=2 && s.age<=34, once:true, tag:"工作",
  title:"你写的话",
  text:`全局大会。局长在台上讲话，念的是你写的稿子。\n\n一字未改。\n\n台下三百多人，没有一个人知道这些话是谁写的。`,
  opts:[
    { t:"就那么坐着听完", eff:{merit:8,health:2},
      msg:"你听到自己写的那句「我们不能辜负这个时代」被念出来的时候，起了一身鸡皮疙瘩。\n\n散会后没有人提起这件事。\n\n但你知道，这个单位里有三百多个人，今天听了你说的话。这种感觉你后来又体会过很多次，每一次都没有第一次强烈。" },
    { t:"会后忍不住跟同批的人说了", eff:{merit:4,network:-6},
      msg:"你说得很含蓄，但意思很明白。\n\n对方「嗯」了一声，说：写稿子的活儿谁都干过。\n\n你后来再也没提过这种事。这个圈子里，功劳是不能自己说的——说了，那功劳就不算了。" },
    { t:"回去把这份稿子存了一份", eff:{merit:5,ability:0},
      fn:s=>{ s.ability=cl2(s.ability+6); s.flags.penman=true; },
      msg:"你建了个文件夹，叫「稿」。\n\n后来这个文件夹里存了四百多份东西，从科员时期的会议纪要，到很多年后你自己在台上念的稿子。\n\n有一次你翻到最早那一份，看着二十四岁的自己写的那些又空又热血的句子，看了很久。\n\n【能力提升】" },
  ]},


/* ================= 钱 ================= */
{ id:"shenbao", w:11, cond:s=>s.rank>=3 && s.age>=35, tag:"风险",
  title:"个人有关事项报告",
  text:s=>{ const t=nth("shenbao");
    if(t<=1) return `一年一度的个人有关事项报告表。\n\n本人及配偶子女的收入、房产、投资、经商情况，一栏一栏往下填。\n\n表格本身没什么，难的是你得决定，把哪一行写实。`;
    if(t===2) return `又到这个时候。\n\n你打开去年那份存档，照着往下抄。\n\n抄到一半停住了——有一行去年是空的，今年不该再空着。`;
    return `这张表你填了很多年，熟到不用看填表说明。\n\n熟到现在坐下来，脑子里冒出来的第一个念头不是「这行该怎么填」。\n\n是「哪一年填的那份最要命」。`; },
  opts:[
    { t:"全部如实填报", cost:1, eff:{},
      fn:s=>{
        const grey = greyMoney(s);
        if(grey < 8){
          s.risk = cl(s.risk - 7, 0, 140);
          s.pendMsg = "半小时填完，每一栏都对得上。\n\n交表的时候你忽然意识到，这份表填得这么轻松，本身就是一件挺奢侈的事。";
        } else {
          s.risk = cl(s.risk + Math.min(24, 3 + grey/9), 0, 140);
          s.pendMsg = "你把数字都写上去了。\n\n写完自己看了一遍，那个存款数字和你的工资年限摆在一起，怎么看怎么显眼。\n\n表交上去了。抽查是随机的，但你从此每年这个时候都会想起它。";
        }
      } },
    { t:"该写的写，个别地方模糊处理", eff:{},
      fn:s=>{
        const grey = greyMoney(s);
        s.risk = cl(s.risk + (grey<8 ? 6 : Math.min(30, 8 + grey/7)), 0, 140);
        s.pendMsg = grey<8
          ? "其实也没什么好瞒的，你只是习惯性地少写了一笔亲戚的房子。\n\n交上去以后你有点后悔——为了一件根本不重要的事，你在一张表上撒了谎。"
          : "你把几笔说不太清的，换了个写法。表上就干净了。\n\n填表用了两个小时，比如实填多花了一个半小时。\n\n这一个半小时你后来还要花很多次。";
      } },
    { t:"填之前先把一部分转出去", cost:2, eff:{money:-9,risk:9},
      msg:"你花了点手续费，把几笔挪了位置，表填得很顺。\n\n钱还是那些钱，只是换了个名字待着。\n\n你开始理解为什么有些人会走到最后那一步——他们也是从填一张表开始的。" },
  ]},

{ id:"parent_surgery", w:10, cond:s=>s.age>=42 && s.age<=62 && !s.flags.surgeryDone, once:true, tag:"家庭",
  title:"三十八万",
  text:`母亲要做一个手术。自费部分三十八万，进口耗材，医生说效果确实好很多。\n\n医保能报的那部分已经算进去了。剩下的是实打实的现金。`,
  opts:[
    { t:"砸锅卖铁也上最好的", eff:{money:-26,family:19,health:-4},
      fn:s=>{s.flags.surgeryDone=true},
      msg:"你把能取的都取了，还跟两个朋友开了口。\n\n手术很成功。母亲后来又活了很多年，每次见你都说那年多亏了你。\n\n那三十八万你还了四年。这四年你没买过一件超过五百块的衣服。" },
    { t:"选常规方案，钱留着", eff:{money:-8,family:-13},
      fn:s=>{s.flags.surgeryDone=true},
      msg:"常规方案也做完了，恢复得慢一些，但没出问题。\n\n你没跟母亲说过还有另一个选择。\n\n这件事你一个人知道，也就一个人记着。" },
    { t:"找人凑，能借的都借", cost:2, eff:{money:-17,family:15,network:-11,risk:6},
      fn:s=>{s.flags.surgeryDone=true},
      msg:"你一个下午打了十一个电话。有六个借了，三个说手头紧，两个没接。\n\n钱凑齐了，手术做了。\n\n那两个没接电话的人，后来你们还是照常来往，只是你再也没找过他们。" },
  ]},

{ id:"car", w:9, cond:s=>s.money>=95 && s.rank>=3, once:true, tag:"风险",
  title:"车",
  text:`旧车开了九年，该换了。\n\n你在两款之间犹豫了很久——不是因为差价，是因为其中一款停进大院，会有人多看两眼。`,
  opts:[
    { t:"买贵的那款，钱是自己的", eff:{money:-30,risk:19,family:6},
      msg:"提车那天你特意停在了车位最里面。\n\n第二天还是有人问了：这车不错啊，多少钱？\n\n你说，朋友帮忙拿的，便宜。\n\n这句话你后来又说了很多遍，每次都说得越来越自然。" },
    { t:"买便宜那款，够开就行", eff:{money:-13,risk:-4},
      msg:"车很普通，停在院里毫不起眼。\n\n有一次一个办事的人从你车上下来，说了句：领导您这车……\n\n他后面半句没说完。你知道他想说什么，你挺高兴他没说完。" },
    { t:"不换了，再开两年", eff:{money:1,health:-3,family:-5},
      msg:"你又开了三年。中间大修过两次。\n\n有次下雨天车打不着火，你在路边等了四十分钟。那天你想了很多，主要想的是钱。" },
  ]},

{ id:"relative_borrow", w:9, cond:s=>s.money>=120, tag:"人情",
  title:"都知道你有钱了",
  text:`这半年，来借钱的亲戚有四个。\n\n他们不知道你具体有多少，但他们知道你「在那个位置上」。在他们的理解里，这两件事是一回事。`,
  opts:[
    { t:"能帮的都帮了", eff:{money:-18,family:8,network:3},
      msg:"四家你帮了三家。剩下那家借的数目太大，你没敢答应。\n\n还回来的有一家。\n\n过年回老家，你成了那个「最有本事」的人。这个称呼像一件不合身的衣服，你穿了很多年。" },
    { t:"只帮最亲的那一个", eff:{money:-9,family:-6},
      msg:"你帮了小舅。剩下三家托人带过话，你都推了。\n\n第二年清明回去上坟，有两家没跟你打招呼。" },
    { t:"一个都不借，把话说死", eff:{money:2,family:-15,risk:-4},
      msg:"你在家族群里发了很长一段话，说了自己的难处和纪律要求。\n\n群里安静了很久，然后有人发了个「收到」。\n\n从那以后没人再找你借钱。也没人再找你了。" },
  ]},

{ id:"decorate", w:8, cond:s=>s.money>=160 && s.rank>=4, once:true, tag:"风险",
  title:"装修",
  text:`房子装修，预算超了不少。\n\n包工头是熟人介绍的，做完最后一天，他站在客厅里看了一圈，说了句：领导这房子，够气派。\n\n他说这话的时候是笑着的。`,
  opts:[
    { t:"按原计划做完，钱照付", eff:{money:-34,family:11,risk:11},
      msg:"你一分没少给，发票收据都留着。\n\n但装修队来来往往几十号人，每个人都看见了这个房子长什么样。\n\n有些账不是钱的账。" },
    { t:"砍掉一半，简装", eff:{money:-14,family:-6,risk:-5},
      msg:"你把大理石换成了瓷砖，把定制柜换成了成品。\n\n住进去以后一切照常。来过的同事都说：挺朴素啊。\n\n「朴素」这个词从他们嘴里说出来，是好话。" },
    { t:"让那位老板「看着办」", eff:{bribe:1.5,risk:31},
      msg:"最后结账他只收了个材料钱。你推了两次，他说都是自己人。\n\n这套房子你住了很多年。每次有人来家里做客夸装修好，你都会含糊地把话岔开。" },
  ]},

{ id:"tuition", w:13, pri:4, cond:s=>kidAge(s)>=20 && kidAge(s)<=23, once:true, tag:"家庭",
  title:"出国",
  text:`{子女}想出去读书。两年下来大概八十万。\n\n{TA子}说要是拿不出来就算了，不勉强。说这话的时候没看你。`,
  opts:[
    { t:"供，砸锅卖铁也供", eff:{money:-52,family:20},
      msg:"你把定期取了，把能动的都动了。\n\n{TA子}走的那天在机场抱了你一下，说爸你别太累。\n\n回来的路上你算了一笔账，算完发现自己五十多了，存款回到了三十岁的水平。你笑了一下，觉得挺值。" },
    { t:"供不起，让{TA子}在国内读", eff:{money:-9,family:-17},
      msg:"{TA子}说没关系，国内也挺好。说得很轻松。\n\n后来{TA子}确实在国内读得很好。\n\n但有一年过年，{TA子}的同学来家里坐了坐，聊起在国外的事，{TA子}一直在听，一句话没说。" },
    { t:"想想办法，找人帮忙", cost:3, eff:{money:-25,family:14,risk:28,network:-9},
      msg:"有人替你解决了一部分。你没问怎么解决的，对方也没说。\n\n{TA子}顺利出去了。\n\n从那以后，那个人偶尔会给你打电话，聊些不痛不痒的事。每次接电话你都很客气。" },
  ]},

{ id:"paylube", w:10, cond:s=>s.money>=45 && s.rank>=2 && s.rank<=6, tag:"抉择",
  title:"花钱办事",
  text:`一件卡了很久的事，其实有办法。\n\n有人给你指了条路：这个数——他比了个手势——就能疏通。\n\n你手里有这个数。`,
  opts:[
    { t:"花，事情要紧", eff:{money:-16,network:14,merit:7,risk:23},
      msg:"事情三天就办成了。\n\n你后来又用过两次这条路。第三次的时候你已经不需要别人指了。\n\n你也已经算不清，这条路上现在有多少人知道你的名字。" },
    { t:"不花，按程序磨", cost:3, eff:{merit:-5,health:-5,risk:-6},
      msg:"你跑了七趟，磨了四个月，最后还是办成了。\n\n办成那天你在楼道里长长舒了一口气。\n\n没有人知道你为什么那么高兴——在别人看来，这不过是件本来就该办成的事。" },
    { t:"换个思路，从别处绕", cost:4, eff:{merit:9,network:5,health:-6},
      msg:"你花了两个月找到了另一条完全合规的路径，还顺手把流程里的一个卡点提了整改建议。\n\n那份建议后来被采纳了。\n\n这是笨办法。笨办法的好处是，你不用记住自己说过什么。" },
  ]},

{ id:"sickleave_buy", w:11, cond:s=>s.health<=58 && s.money>=30 && s.age>=45, tag:"身体",
  title:"疗养",
  text:`体检的几项指标一直下不来。医生建议住院系统调理一个月。\n\n一个月。你上一次连续离开工作岗位超过三天，是十七年前。`,
  opts:[
    { t:"去，把手头的事都交出去", cost:4, eff:{money:-13,health:24,merit:-13,network:-6},
      msg:"你在疗养院住了三十一天。前十天睡不着，中间十天睡得很沉，最后十天开始能看进去书了。\n\n回单位那天，你发现没有你，一切照常运转。\n\n这个发现让你难受了半天，然后轻松了很多年。" },
    { t:"开药带回去，边干边治", eff:{money:-5,health:5,merit:4},
      msg:"药你吃了三个月，指标降了一点点。\n\n然后又升回去了。" },
    { t:"不去，忙完这阵再说", eff:{health:-9,merit:7},
      msg:"这阵一直没忙完。\n\n后来你才明白，这个系统里没有「忙完这阵」，只有「下一阵」。" },
  ]},

{ id:"laojia_house", w:8, cond:s=>s.money>=70 && s.age>=40 && s.age<=60, once:true, tag:"生活",
  title:"老家",
  text:`村里现在家家都盖了新房。你家那栋还是九十年代的样子。\n\n你妈在电话里说了三次「不用管我们」，说三次的意思你懂。`,
  opts:[
    { t:"盖，盖最好的那种", eff:{money:-28,family:16,risk:8},
      msg:"三层小楼，全村最气派。封顶那天放了很长的鞭炮。\n\n你妈在电话里的声音是你很多年没听过的。\n\n后来村里有人来找你办事，第一句话都是：「您家那房子真好。」" },
    { t:"翻修一下，够住就行", eff:{money:-14,family:9},
      msg:"换了屋顶、重铺了地、装了热水器和空调。\n\n你妈很满意。她这辈子想要的东西，其实一直都不多。" },
    { t:"接他们进城住", eff:{money:-9,family:11,health:-3},
      msg:"他们来住了四个月，然后坚持要回去。\n\n临走那天你妈说：城里好，就是没人跟我说话。\n\n你送他们上车，站在路边看了很久。" },
  ]},

{ id:"salary_card", w:8, cond:s=>s.flags.married && s.age<=50, once:true, tag:"生活",
