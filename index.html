  title:"工资卡",
  text:`结婚这些年，工资卡一直在你自己手里。\n\n有天晚上她很随意地提了一句：要不以后卡放我这儿吧，我来管。\n\n这句话她大概想了很久才说出口。`,
  opts:[
    { t:"给了", eff:{family:14,money:3},
      fn:s=>{s.flags.cardGiven=true},
      msg:"从那以后你每月有固定的零花钱。\n\n奇怪的是，家里的钱反而攒下来了——她比你会过日子。\n\n更奇怪的是，后来有人想给你点什么，你第一个念头是：这钱没法解释。\n\n这道防线是她无意中给你修的。" },
    { t:"说自己拿着方便", eff:{family:-9,risk:6},
      msg:"她「嗯」了一声，没再提。\n\n那张卡后来还是在你手里。你有过几笔钱，她一直不知道。\n\n不知道对她是好事。你一直这么跟自己说。" },
  ]},


/* ================= 孩子 ================= */
{ id:"kid_school", w:12, pri:4, cond:s=>kidAge(s)>=5 && kidAge(s)<=7, once:true, tag:"家庭",
  title:"择校",
  text:`{子女}该上小学了。片区对口的那所一般，好的那所在城东，隔了两个学区。\n\n你打听了一下，发现这件事对你来说其实不难——一个电话的事。\n\n难的是打不打这个电话。`,
  opts:[
    { t:"打了那个电话", cost:1, eff:{family:12,network:-6,risk:14},
      msg:"{TA子}进了城东那所。开学第一天你去送，校长在门口特意跟你握了手。\n\n那一握持续了大概三秒钟。三秒钟里你想了很多事，包括你二十二岁那年是怎么想的。" },
    { t:"就上片区对口的", eff:{family:-5,risk:-4,merit:3},
      msg:"你什么也没做。{TA子}在家门口那所读了六年，成绩中等偏上。\n\n后来有一次{TA子}随口说：我们班主任说，我们学校跟城东那边没法比。\n\n你「嗯」了一声，没接话。" },
    { t:"买学区房，正经排队", eff:{money:-38,family:9,risk:-3},
      msg:"你把积蓄拿出来大半，在城东买了套小的。\n\n这是最贵也最干净的一条路。签合同那天你手有点抖，但那晚睡得很踏实。" },
  ]},

{ id:"kid_teacher", w:11, pri:4, cond:s=>kidAge(s)>=8 && kidAge(s)<=11, once:true, tag:"家庭",
  title:"班主任",
  text:`家长会后，班主任单独留了你几分钟。\n\n聊了两句{子女}的情况，然后她忽然说：您是不是在市里工作？我先生单位有点事想请教……\n\n她说这话的时候，脸上带着一种你很熟悉的表情。`,
  opts:[
    { t:"顺水推舟，留了电话", eff:{network:8,risk:11,family:6},
      msg:"她先生的事你帮着问了一句，不难办。\n\n从那以后{子女}在班里成了「重点关照对象」——作业批得更细，座位调到了中间。\n\n{TA子}回家说：妈说老师最近对我特别好。你笑了笑，说那是你自己争气。" },
    { t:"客气地推了", eff:{network:-5,family:-3,risk:-5},
      msg:"你说自己就是个普通办事员，帮不上忙。\n\n她「哦」了一声，笑容淡了一点，然后继续说{子女}的作业问题。\n\n后来{TA子}的座位一直在最后一排。你不知道这两件事有没有关系，你宁愿相信没有。" },
    { t:"给她讲了正规的办事流程", cost:1, eff:{merit:4,network:2,family:2},
      msg:"你花了十分钟把该找哪个窗口、带什么材料、大概多久讲清楚了。\n\n她愣了一下，然后认真地记在了备课本背面。\n\n一个月后她发信息说事办成了，比想的还顺。这条信息你留了很久。" },
  ]},

{ id:"kid_grade", w:11, pri:4, cond:s=>kidAge(s)>=13 && kidAge(s)<=15, once:true, tag:"家庭",
  title:"下滑",
  text:`{子女}的成绩从年级前二十掉到了一百开外。\n\n班主任说，主要是初二这一年家里得多盯着。\n\n你上一次辅导{TA子}功课，是三年前。`,
  opts:[
    { t:"报最好的补习班，砸钱", eff:{money:-11,family:2,merit:2},
      msg:"一周五次课，接送有司机。成绩回到了七十名左右，再没上去过。\n\n有天晚上你回家，看见{TA子}趴在餐桌上睡着了，卷子铺了一桌。\n\n你把{TA子}抱回房间，才发现{TA子}已经比你想的重很多了。" },
    { t:"每周腾出三个晚上自己陪", cost:4, eff:{family:19,merit:-11,health:-4},
      msg:"你推掉了不少饭局。有两次是在办公室改完材料，赶回家陪{TA子}做完最后一道题。\n\n成绩慢慢回来了，但这不是重点。\n\n重点是那三个月里，{TA子}开始跟你讲学校里的事了。" },
    { t:"跟{TA子}谈了一次，讲道理", eff:{family:-6,merit:3},
      msg:"你讲了四十分钟，从自己当年怎么考出来讲到现在的位置。{TA子}一直点头。\n\n谈完你觉得挺成功。\n\n成绩没什么变化。你后来也没再谈第二次。" },
  ]},

{ id:"kid_silent", w:11, pri:6, cond:s=>kidAge(s)>=14 && kidAge(s)<=18 && s.family<62, once:true, tag:"家庭",
  title:"他不跟你说话了",
  text:`你已经记不清{子女}上一次主动跟你说话是什么时候。\n\n吃饭的时候{TA子}低头刷手机，你问一句{TA子}答一句，多一个字都没有。\n\n这不是一天变成这样的。这是很多年一点一点攒出来的。`,
  opts:[
    { t:"请假两天，带{TA子}出去走走", cost:4, eff:{family:24,merit:-9,health:-3},
      msg:"你们去了海边。前一天半几乎没说话。\n\n第二天傍晚，{TA子}忽然说：我小时候你答应过带我来，后来一直没来。\n\n你说我记得。\n\n{TA子}说：你不记得，是我妈告诉你的。\n\n{TA子}说得对。但{TA子}愿意说这句话，这件事本身就已经不一样了。" },
    { t:"跟{TA子}妈说说，让她多沟通", eff:{family:-8},
      msg:"你把这件事交给了别人。她试了，效果有限。\n\n很多年后你才明白，{子女}不跟你说话，和{TA子}跟谁说话，是两件事。" },
    { t:"孩子长大都这样，随他去", eff:{family:-14,merit:5},
      msg:"你把注意力放回了工作上。那一年你干得很好。\n\n{子女}后来考上了很远的大学，一年回来两次，每次待不满一周。\n\n你们相处得很客气。客气到你有时候会想，这大概就是你自己选的。" },
  ]},

{ id:"kid_ask", w:14, pri:4, cond:s=>kidAge(s)>=15 && kidAge(s)<=20 && s.risk>=35, once:true, tag:"家庭",
  title:"一个问题",
  text:`晚饭后{子女}没走，在餐桌边坐了一会儿。\n\n然后{TA子}说：爸，我同学他爸也在体制内，最近被查了。\n\n停了两秒，{TA子}又说：你们那边……是不是都那样。\n\n{TA子}问得很轻，不像是指控，倒像是真的想知道。`,
  opts:[
    { t:"说：不是，大部分人都很干净", eff:{family:5,risk:5},
      msg:"你说得很自然，自然到你自己都有点吃惊。\n\n{TA子}「哦」了一声，说那就好，然后回房间了。\n\n你在餐桌边又坐了很久。那顿饭的碗是你洗的，这是你半年来第一次洗碗。" },
    { t:"说：有的人是那样。我尽量不那样", eff:{family:11,health:-4},
      msg:"你没有替谁辩解，也没有把自己摘干净。\n\n{TA子}看了你几秒，说：那你要小心点。\n\n这是{TA子}这三年跟你说过的最长的一句关心。\n\n那天晚上你把书房柜子最上层的东西清理了一遍。" },
    { t:"说：这些事你别管，好好读书", eff:{family:-13,risk:3},
      msg:"{TA子}站起来回房间了，门关得不轻不重。\n\n后来{TA子}再没问过你任何跟工作有关的事。\n\n你不知道{TA子}是不再好奇了，还是已经自己有了答案。" },
    { t:"什么也说不出来", eff:{family:-6,health:-7,risk:-6},
      fn:s=>{s.flags.kidKnows=true},
      msg:"你张了张嘴，最后只说了句：饭凉了，去写作业吧。\n\n{TA子}走了以后你一个人坐着，坐到客厅的灯自动灭了。\n\n那天晚上你想了很多事。第二天你退了两件东西。\n\n【这一晚之后，你做事谨慎了很多】" },
  ]},

{ id:"kid_exam", w:14, pri:4, cond:s=>kidAge(s)>=21 && kidAge(s)<=25 && !s.flags.kidPathSet, once:true, tag:"抉择",
  title:"他想考公",
  text:`{子女}大学快毕业了。吃饭的时候{TA子}说，打算考公务员，问你的意见。\n\n你放下筷子，发现自己一时答不上来。\n\n你在这个系统里待了三十年。你比任何人都清楚它能给什么、要什么。而现在{TA子}要走进来。`,
  opts:[
    { t:"支持，还帮{TA子}参谋报哪个岗", cost:2, eff:{family:14,network:-4},
      fn:s=>{s.flags.kidCivil=true; s.flags.kidPathSet=true;},
      msg:"你翻了三个晚上的职位表，比{TA子}还认真。哪个单位有前途、哪个岗位是坑，你一眼就看得出来。\n\n{TA子}考上了，在另一个市。\n\n每次通电话你们聊的都是单位的事。{TA子}抱怨的那些，你三十年前一模一样地抱怨过。\n\n【档案 · 子承父业】" },
    { t:"劝{TA子}别来，去外面试试", eff:{family:-6,health:-4},
      fn:s=>{s.flags.kidPathSet=true;},
      msg:"你说了很多，说得比你想象的激动。\n\n{TA子}听完问了一句：那你为什么不走？\n\n你答不上来。\n\n{TA子}最后去了南方一家公司。头两年很难，后来站住了。你从没跟别人说过{TA子}在哪儿工作——不是不好意思，是不知道怎么说。" },
    { t:"说这是{TA子}自己的事，你不干涉", eff:{family:3},
      fn:s=>{ if(chance(.55)){ s.flags.kidCivil=true; }
              s.flags.kidPathSet=true;
              s.pendMsg = s.flags.kidCivil
                ? "{TA子}还是考了，自己复习，自己报的岗，没让你帮一点忙。\n\n上岸那天{TA子}给你发了条信息，就四个字：我考上了。\n\n你回了个「好」，然后一个人在办公室坐了很久。\n\n【档案 · 子承父业】"
                : "{TA子}没考。去了一家你说不清是做什么的公司。\n\n你从没问过{TA子}一个月挣多少。你怕问出来比你多，也怕问出来比你少。"; } },
  ]},

{ id:"kid_wedding", w:13, pri:4, cond:s=>kidAge(s)>=26 && kidAge(s)<=32 && !s.flags.kidWed, once:true, tag:"家庭",
  title:"婚礼",
  text:`{子女}要结婚了。\n\n办公室的人已经在打听日子。按你现在的位置，这场婚礼要是放开了办，能来几百号人。\n\n家里问你：办多大？`,
  opts:[
    { t:"两桌，只请至亲", eff:{family:15,money:-4,network:-9,risk:-11},
      fn:s=>{s.flags.kidWed=true},
      msg:"你提前跟办公室打了招呼：不收礼，不通知。\n\n那天只有十几个人，{子女}和爱人挨桌敬酒，敬到你这儿时说了句谢谢爸。\n\n有几个想来的人没能来，心里有点意见。这点意见你担得起。" },
    { t:"正常办，来的都是熟人", eff:{family:9,bribe:3.4,network:6,risk:16},
      fn:s=>{s.flags.kidWed=true},
      msg:"三十多桌。礼金你让办公室的人登了记，说以后都要还的。\n\n有些人的礼你根本不认识是谁送的。\n\n那本礼簿你锁在抽屉里，锁了很多年。" },
    { t:"放开办，这辈子就这一次", eff:{family:11,bribe:11,network:14,risk:36},
      fn:s=>{s.flags.kidWed=true},
      msg:"酒店最大的宴会厅，八十多桌。来的人里有一半你叫不出名字。\n\n{子女}后来说：爸，那天我像个道具。\n\n这句话你当时笑着挡过去了。很多年后你还记得。" },
  ]},

{ id:"kid_house", w:13, pri:4, cond:s=>kidAge(s)>=25 && kidAge(s)<=33 && !s.flags.kidHouse, once:true, tag:"家庭",
  title:"首付",
  text:`{子女}要买房，首付还差六十万。\n\n你手上有这个钱。问题是这六十万一旦转出去，就变成了一笔需要解释的钱——如果哪天有人问起的话。`,
  opts:[
    { t:"转，光明正大地转", eff:{money:-40,family:17},
      fn:s=>{s.flags.kidHouse=true},
      msg:"你一次性转了过去，还留了转账凭证和一份简单的说明。\n\n钱是干净的，账是清楚的。\n\n{子女}拿到钥匙那天发了张照片过来，空荡荡的客厅里站着{TA子}和{TA子}爱人。你把那张照片存了下来。" },
    { t:"分几次给，走亲戚的账", eff:{money:-40,family:12,risk:22},
      fn:s=>{s.flags.kidHouse=true},
      msg:"这笔钱没有直接从你账上出去。麻烦，但表面上看不出来。\n\n房子买了，{子女}很高兴。\n\n你没告诉{TA子}这笔钱是怎么过去的。有些事情知道的人越少越好，你一直这么认为。" },
    { t:"只给三十万，剩下让{TA子}自己扛", eff:{money:-20,family:-4,risk:-4},
      fn:s=>{s.flags.kidHouse=true},
      msg:"{子女}贷了更多的款，每个月还得紧巴巴。\n\n{TA子}没抱怨，只是有一次提到房贷时说了句：也挺好，自己挣的踏实。\n\n这句话你听着有点耳熟。你二十多岁的时候，好像也说过差不多的话。" },
  ]},


/* ================= 冲顶通道：正部之后的四步 ================= */
{ id:"top1", w:0, force:true, tag:"顶 局",
  title:"名单",
  text:s=>{
    const t = s.flags.topTries || 0;
    if(t === 0) return `一个很小范围的会上，有人提到了你的名字。\n\n消息传到你耳朵里时已经隔了两道弯，措辞很谨慎：「上面在考虑几个人。」\n\n你在这个位置上待了${s.yearsInRank}年。你比谁都清楚，这种消息传到你这儿，本身就是一种信号。`;
    if(t === 1) return `又是那句话，又隔了两道弯：「上面在考虑几个人。」\n\n上一次听到这句话是${s.year - (s.flags.topStageYear||s.year)}年前。那之后什么也没发生，你把办公室的绿萝换了两茬。\n\n这一次你听完没什么反应，先把手里那页翻完了。`;
    return `第三次了。\n\n这一回连传话的人都换了，语气比前两次都更客气一点——客气到你听得出来，他自己也不太信。\n\n你忽然意识到，你已经不再关心这句话是真是假，你只想知道它还要来几次。`;
  },
  opts:[
    { t:"什么都不做，照常上班", cost:1, eff:{merit:5,risk:-4},
      fn:s=>{ s.flags.topStage=1; s.flags.topStageYear=s.year; s.flags.topQuiet=true; s.flags.topTries=(s.flags.topTries||0)+1;
        s.pendMsg="接下来的半年你什么都没变：一样开会，一样批文件，一样六点半到办公室。\n\n有人来试探，你都笑着岔开了。\n\n【进入考察视野 · 你选择了最稳的那种姿态】"; } },
    { t:"该走动的走动，让该知道的人知道", cost:3, eff:{network:14,risk:12},
      fn:s=>{ s.flags.topStage=1; s.flags.topStageYear=s.year; s.flags.topPush=true; s.flags.topTries=(s.flags.topTries||0)+1;
        s.pendMsg="你见了几个人，说了些很含蓄的话。\n\n效果是有的——你的名字从「几个人」里被单独提出来过一次。\n\n代价也是有的：有人开始注意你最近在见谁。\n\n【进入考察视野 · 但你留下了痕迹】"; } },
    { t:"主动表态：年龄大了，让年轻人来", eff:{network:9,merit:-6},
      fn:s=>{ s.flags.topStage=1; s.flags.topStageYear=s.year; s.flags.topHumble=true; s.flags.topTries=(s.flags.topTries||0)+1;
        s.pendMsg="你在一次谈话里说了这句话，说得很诚恳。\n\n对方看了你几秒，说：这个不是你说了算的。\n\n这句话你回味了很久。它可能是拒绝，也可能是别的意思。\n\n【进入考察视野 · 以退为进】"; } },
  ]},

{ id:"top2", w:0, force:true, tag:"顶 局",
  title:"考察",
  text:s=>((s.flags.topTries||1) > 1 ? `考察组又进驻了。还是七个人，换了三张脸。\n\n流程你已经熟了：他们会找你谈三次，找你的下属谈四十多次。上一次他们也是这么问的。\n\n第十八天，组长单独找你，问了同一个问题：\n\n「这些年，有没有什么是你希望我们别查到的？」` : `考察组进驻了，七个人，为期二十天。\n\n他们找你谈了三次，找你的下属谈了四十多次，调走了你近十五年经手的全部重大事项。\n\n第十八天,组长单独找你,只问了一个问题：\n\n「这些年，有没有什么是你希望我们别查到的？」`),
  opts:[
    { t:"说：有。然后把该说的都说了", cost:3, eff:{health:-7},
      fn:s=>{
        const bad=[];
        if(s.risk >= (s.flags.recused ? 34 : 24)) bad.push("你说的那些，比他们查到的少。");
        if(s.health < 42) bad.push("体检报告出来了，两项指标画了红圈。");
        if(!(s.flags.bigwin || s.flags.crisis)) bad.push("履历很完整。完整得像一份没有起伏的档案。");
        if(s.ability < 50) bad.push("专业能力这一项，评价是「尚可」。这两个字在这个层级是差评。");
        if(bad.length){
          s.flags.topStage=0; s.flags.topStageYear=s.year; s.risk=cl(s.risk-6,0,140);
          const shut = (s.flags.topTries||0) >= 4;
          if(shut) s.flags.topDoorShut = true;
          s.pendMsg="谈话结束得很平静。\n\n三个月后考察组撤了，没有下文。\n\n很久之后你才听到一句：\n\n「"+pick(bad)+"」\n\n"
            + (shut ? "【这一次之后，再没有人提起过你的名字】" : "【考察未通过 · 若干年后或许还有机会】");
        } else {
          s.flags.topStage=2; s.flags.topStageYear=s.year; s.risk=cl(s.risk-12,0,140);
          s.pendMsg="你说了四个多小时。有些事你自己都快忘了。\n\n组长一直在记，中间没有打断过你一次。\n\n最后他合上本子，说：谢谢你说这些。\n\n【考察通过 · 只剩最后一步】";
        }
      } },
    { t:"说：没有", eff:{},
      fn:s=>{
        const clean = s.risk < 12 && (s.flags.bigwin || s.flags.crisis) && s.health >= 45 && s.ability >= 55;
        if(clean){
          s.flags.topStage=2; s.flags.topStageYear=s.year;
          s.pendMsg="你说得很干脆。\n\n组长笑了一下，说：这句话我这些年听过很多次，能站得住的不多。\n\n二十天后他们撤了。你的材料一路往上走。\n\n【考察通过 · 只剩最后一步】";
        } else {
          s.flags.topStage=0; s.flags.topStageYear=s.year; s.risk=cl(s.risk+10,0,140);
          const shut = (s.flags.topTries||0) >= 4;
          if(shut) s.flags.topDoorShut = true;
          s.pendMsg="你说得很干脆。\n\n组长点点头，没有接话，翻过了那一页。\n\n后来什么消息也没有。你到很久以后才明白，那个问题不是问你有没有，是问你敢不敢说。\n\n"
            + (shut ? "【三次都停在同一道门口。这一次你知道不会再有第四次了】" : "【考察未通过】");
        }
      } },
  ]},

{ id:"top3", w:0, force:true, tag:"顶 局",
  title:"最后一件事",
  text:s=>`还剩最后一道。\n\n上面交给你一件事：一个跨了三个省、拖了十一年、四任前任都没能推动的事。给你两年。\n\n交办的时候只说了一句：「做成了再说别的。」`,
  opts:[
    { t:"接。两年里什么都不管，只干这一件", cost:5, eff:{health:-14,family:-16},
      fn:s=>{
        const score = s.merit*0.42 + s.network*0.30 + s.ability*0.20 + rnd(0,26);
        if(score >= 96){
          s.rank = 9; s.topped = true; s.flags.topDone = true;
          s.log.push([s.year, "任副国级职务"]);
          return endGame();
        } else {
          s.flags.topStage=0; s.flags.topStageYear=s.year; s.merit=cl(s.merit-10);
          s.pendMsg="两年到了。事情推进了大概六成。\n\n没有人说你失败，材料里写的是「取得阶段性进展」。\n\n这六个字你看了很久。你知道它的意思是：不够。\n\n【最后一步未成】";
        }
      } },
    { t:"接，但按常规节奏推，不拿命换", cost:3, eff:{health:-6,family:-4},
      fn:s=>{
        const score = s.merit*0.42 + s.network*0.30 + s.ability*0.20 + rnd(0,26);
        if(score >= 112){
          s.rank = 9; s.topped = true; s.flags.topDone = true;
          s.log.push([s.year, "任副国级职务"]);
          return endGame();
        } else {
          s.flags.topStage=0; s.flags.topStageYear=s.year;
          s.pendMsg="两年过去，事情停在了老地方。\n\n你身体还好，家里也还好。只是那件事没成。\n\n后来接手的人用了四年做成了。他比你年轻十二岁。\n\n【最后一步未成】";
        }

/* ==================================================================
   游戏状态
   ================================================================== */
let S = null;

function newGame(){
  S = {
    gender:"male", year:2026, age:22, rank:0, yearsInRank:0,
    merit:5, network:5, health:90, family:60, money:2, risk:0, legit:2, grey:0,
    ability:10,
    energyPool:0, alloc:{work:0,rel:0,fam:0,hp:0,study:0},
    phase:"event", queue:[], curEv:null, evIdx:0,
    seen:{}, evLast:{}, evCount:{}, flags:{}, log:[], deltas:{}, pendMsg:null,
    circle:{ in:false, name:null, depth:0, since:0, doomed:false, fell:false, fallAt:99 },
    evMul: rollEventPrefs(),
    nextInspect: 2026 + ri(5, 9), inspecting:false, inspectWarned:false,
    patron:{ name:"李主任", favor:20, alive:true },
    rival:{ name:"王建", rank:0 },
    waves:[], wavePool:WAVES.map(w=>w.id), nextWave:2030+ri(0,2),
    retireAge:65, retired:false, overtime:false, dead:false,
    busted:false, quit:false, sickLeave:false, diedInOffice:false,
    yearEnd:null, ending:null, notices:[], forceEvent:null, lowFamYears:0,
    promoMsg:null, guojiFailMsg:null,
  };
  startYear();
}

/* ---------- 浪潮 ---------- */
function waveMods(){
  const m = { meritMul:1, slotMul:1, incomeMul:1, healthMul:1, familyMul:1,
              studyMul:1, riskGainMul:1, riskLower:0, ageCoefBonus:0, retirePlus:0,
              greyMul:1, netDecayMul:1 };
  S.waves.forEach(w=>{
    const W = WAVES.find(x=>x.id===w.id); if(!W) return;
    for(const k in W.mods){
      if(k==="riskLower"||k==="ageCoefBonus"||k==="retirePlus") m[k]+=W.mods[k];
      else if(typeof W.mods[k]==="number") m[k]*=W.mods[k];
    }
  });
  return m;
}
function activeTags(){ return S.waves.map(w=>(WAVES.find(x=>x.id===w.id)||{}).tag).filter(Boolean); }

function tickWaves(){
  S.waves = S.waves.filter(w=>S.year < w.end);
  if(S.year >= S.nextWave && S.wavePool.length){
    const id = pick(S.wavePool);
    S.wavePool = S.wavePool.filter(x=>x!==id);
    const W = WAVES.find(x=>x.id===id);
    S.waves.push({ id, end:S.year + ri(5,7) });
    S.nextWave = S.year + ri(6,9);
    if(W.mods.retirePlus) S.retireAge += W.mods.retirePlus;
    S.notices.push({ t:"时 代 浪 潮", b:`【${W.name}】\n\n${W.desc}` });
    S.log.push([S.year, "时代浪潮：" + W.name]);
  }
}

/* ---------- 折旧系数：年轻时成绩转瞬即逝，年长后履历与人脉都更"结构化" ---------- */
function decayMul(){
  const byAge = S.age < 40 ? 1.00
              : S.age < 50 ? 0.76
              : S.age < 58 ? 0.54
              : 0.36;
  const byRank = S.rank >= 7 ? 0.75      // 副部以上：履历进档案，关系是位置带来的
              : S.rank >= 5 ? 0.85       // 副厅以上
              : 1.00;
  return byAge * byRank;
}

/* ---------- 健康损耗系数：年轻时扛得住，35 岁后每一下都更贵 ---------- */
function hpLossMul(){
  const a = S.age;
  return a < 30 ? 0.42
       : a < 35 ? 0.68
       : a < 50 ? 1.00
       : a < 60 ? 1.15
       : 1.30;
}

/* ---------- 精力 ---------- */
function baseEnergy(){
  let e = S.age<=35 ? 12 : S.age<=50 ? 10 : 9;
  if(S.health < 34) e -= 2;
  if(S.health < 16) e -= 2;
  return Math.max(3, e);
}

/* ---------- 每周目洗牌 ----------
   事件池 171 个，一局只走得完 50 来个。如果每局都用同一套权重，
   抽中的就永远是那批高权重、低门槛的，于是"池子很深但每把都差不多"。
   开局时给整个池子随机分配偏好：一部分这周目直接不出现，剩下的权重各有高低。
   链条型事件（提成、山头、作风、长回响）和浪潮配套事件不参与，否则会断链。
------------------------------------------------ */
const NO_SHUFFLE = new Set([
  "start","blinddate","single_talk","broker2","broker3","broker_cash","circle_favor",
  "she_house","she_claim","she_photo","laopo","intschool_bill",
  "echo_archive","echo_liu","echo_zhou",
]);
function rollEventPrefs(){
  const m = {};
  EVENTS.forEach(e=>{
    if(e.force || e.waveTag || NO_SHUFFLE.has(e.id)){ m[e.id] = 1; return; }
    // once 事件每局必被逐个消耗，且每局都是同一批，是"似曾相识"的主要来源，压得重一些；
    // 可重复事件要给冷却机制留足池子，压得轻一些。
    const bench = e.once ? 0.20 : 0.42;
    m[e.id] = chance(bench) ? 0                      // 这一周目见不到
            : 0.30 + Math.random() * 1.70;           // 其余各有高低
  });
  return m;
}

/* ---------- 受贿金额缩放 ----------
   同样一个信封，科员收到的和正部收到的不是一个东西。
   基数 × 1.42^职级：正科 ×2.0、正处 ×4.1、正厅 ×8.2、正部 ×16.6
------------------------------------------------ */
function bribeMul(st){
  const r = (st||S).rank;
  // 正处以下按 1.42^级 平稳增长；正处往上再叠一层，因为那一层能动的东西完全不是一回事
  return Math.pow(1.42, r) * Math.pow(1.44, Math.max(0, r - 4));
}
/* 钱到了一定量级，用「万」已经不好读了 */
function yuan(v, dp){
  const d = dp==null ? 1 : dp;
  return Math.abs(v) >= 10000 ? (v/10000).toFixed(2) + " 亿" : v.toFixed(d) + " 万";
}

/* ---------- 事件复现控制 ----------
   DEFAULT_CD 冷却年数：同一事件多少年内不再抽中（可被事件自身的 cd 覆盖）
   FATIGUE    疲劳系数：每看过一次，权重按 1/(1+FATIGUE*次数) 递减
   nth(id)    当前是第几次看到这个事件，供文案分层使用
------------------------------------------------ */
const DEFAULT_CD = 9, FATIGUE = 1.15;
function nth(id){ return S.evCount[id] || 1; }

/* ---------- 年度开始 ---------- */
function startYear(){
  S.notices = []; S.pendMsg = null; S.promoMsg = null; S.yearEnd = null;
  S.deltas = {};
  tickWaves();
  S.energyPool = baseEnergy();
  S.alloc = {work:0,rel:0,fam:0,hp:0,study:0};

  // 抽事件
  S.queue = [];
  if(S.year === 2026){ S.queue.push(EVENTS.find(e=>e.id==="start")); }
  else if(S.forceEvent){
    const fe = EVENTS.find(e=>e.id===S.forceEvent);
    S.forceEvent = null;
    if(fe) S.queue.push(fe);
  }
  if(!S.queue.length && S.year !== 2026){
    const n = S.overtime ? 1 : (S.age>=62 ? 1 : ri(1,2));
    const tags = activeTags();
    const base = EVENTS.filter(e=>{
      if(e.force) return false;
      if(S.evMul && S.evMul[e.id] === 0) return false;   // 这一周目不出现
      if(e.once && S.seen[e.id]) return false;
      if(e.waveTag && !tags.includes(e.waveTag)) return false;
      if(e.cond && !e.cond(S)) return false;
      if(!S.overtime && e.tag==="晚局") return false;
      return true;
    });
    // 冷却：刚出过的事件先压一段时间；池子被压太狠就放宽
    const cooled = base.filter(e=>{
      const last = S.evLast[e.id];
      return last == null || (S.year - last) >= (e.cd != null ? e.cd : DEFAULT_CD);
    });
    const pool = cooled.length >= 6 ? cooled : base;
    const chosen = [];
    for(let i=0;i<n && pool.length;i++){
      // 看过越多次，再抽中的概率越低
      const wOf = e => e.w * (e.waveTag ? 1.6 : 1)
                       * (typeof e.pri === "function" ? e.pri(S) : (e.pri || 1))
                       * (S.evMul && S.evMul[e.id] != null ? S.evMul[e.id] : 1)
                       / (1 + FATIGUE * (S.evCount[e.id] || 0));
      let tot = 0; pool.forEach(e=>tot += wOf(e));
      let r = Math.random()*tot, sel = pool[0];
      for(const e of pool){ r -= wOf(e); if(r<=0){ sel=e; break; } }
      chosen.push(sel);
      pool.splice(pool.indexOf(sel),1);
    }
    S.queue = chosen;
  }
  S.queue.forEach(e=>{ if(e){ S.evLast[e.id]=S.year; S.evCount[e.id]=(S.evCount[e.id]||0)+1; } });
  S.evIdx = 0;
  S.phase = S.queue.length ? "event" : "alloc";
  S.curEv = S.queue[0] || null;
  render();
}

/* ---------- 应用效果 ---------- */
function applyEff(eff){
  if(!eff) return;
  const m = waveMods();
  const D = S.deltas;
  const add = (k,v)=>{ D[k]=(D[k]||0)+v; };
  if(eff.merit!=null){ const v=eff.merit>0?eff.merit*m.meritMul:eff.merit; S.merit=cl(S.merit+v); add("merit",v); }
  if(eff.network!=null){ S.network=cl(S.network+eff.network); add("network",eff.network); }
  if(eff.health!=null){ const v=eff.health<0?eff.health*0.55*m.healthMul*hpLossMul():eff.health; S.health=cl(S.health+v); add("health",v); }
  if(eff.family!=null){ const v=eff.family<0?eff.family*(m.familyMul||1):eff.family; S.family=cl(S.family+v); add("family",v); }
  if(eff.bribe!=null){ const v=Math.round(eff.bribe*bribeMul()*m.greyMul*10)/10;
    S.money=Math.max(0,S.money+v); add("money", v); S.grey=(S.grey||0)+v; }
  if(eff.money!=null){ S.money=Math.max(0,S.money+eff.money); add("money",eff.money);
    if(eff.money>0 && eff.risk>0) S.grey = (S.grey||0) + eff.money; }   // 说不清的那部分
  if(eff.risk!=null){ const v=eff.risk>0?eff.risk*0.8*m.riskGainMul:eff.risk; S.risk=cl(S.risk+v,0,140); add("risk",v); }
}

function chooseOpt(i){
  const ev = S.curEv, o = ev.opts[i];
  if(o.cond && !o.cond(S)) return;
  if(o.cost && o.cost > S.energyPool) return;
  const needM = (o.eff && o.eff.money < 0) ? -o.eff.money : 0;
  if(needM > S.money && ev.opts.some(x=>{
      const n2 = (x.eff && x.eff.money < 0) ? -x.eff.money : 0;
      return !(x.cost && x.cost > S.energyPool) && n2 <= S.money;
  })) return;
  if(o.cost) S.energyPool -= o.cost;
  S.seen[ev.id] = true;
  S.pendMsg = null;
  const before = activeTraits().map(t=>t.id);
  applyEff(o.eff);
  if(o.fn) o.fn(S);
  if(S.phase === "end") return;      // fn 里已经终局（登顶／落网），不要再覆盖回事件结果页
  S.newTraits = activeTraits().filter(t=>!before.includes(t.id)).map(t=>t.name);
  S.evResult = S.pendMsg || (typeof o.msg === "function" ? o.msg(S) : o.msg) || "";
  S.evEff = {...S.deltas};
  S.phase = "evresult";
  render();
}

function nextEvent(){
  S.evIdx++;
  S.deltas = {};
  if(S.evIdx < S.queue.length){
    S.curEv = S.queue[S.evIdx];
    S.phase = "event";
  } else {
    S.phase = "alloc";
    if(S.quit || S.escaped){ endGame(); return; }
  }
  render();
}

/* ---------- 精力分配 ---------- */
const ALLOC_CAP = 5;   // 单项精力投入上限：逼玩家取舍，不能全押一栏
function setAlloc(k, d){
  const used = Object.values(S.alloc).reduce((a,b)=>a+b,0);
  if(d>0 && (used >= S.energyPool || S.alloc[k] >= ALLOC_CAP)) return;
  if(d<0 && S.alloc[k]<=0) return;
  S.alloc[k] += d;
  render();
}
function confirmAlloc(){
  const m = waveMods(), a = S.alloc;
  const D = S.deltas = {}, P = S.parts = {};
  const add=(k,v,why)=>{ D[k]=(D[k]||0)+v;
    if(why){ (P[k] = P[k] || {}); P[k][why] = (P[k][why] || 0) + v; } };
  const abMul = 1 + S.ability/200;

  if(a.work){ const v=a.work*2.2*abMul*m.meritMul*tMul("workMul"); S.merit=cl(S.merit+v); add("merit",v,"工作");
              const h=-a.work*0.45*m.healthMul*hpLossMul(); S.health=cl(S.health+h); add("health",h,"工作");
              const f=-a.work*0.32; S.family=cl(S.family+f); add("family",f,"工作"); }
  if(a.rel){  const v=a.rel*2.3*tMul("relMul"); S.network=cl(S.network+v); add("network",v,"关系");
              const mo=-a.rel*0.28; S.money=Math.max(0,S.money+mo); add("money",mo,"应酬");
              const f=-a.rel*0.35; S.family=cl(S.family+f); add("family",f,"关系"); }
  if(a.fam){  const v=a.fam*2.8*(m.familyMul||1); S.family=cl(S.family+v); add("family",v,"陪家人");
              const mo=-a.fam*0.16; S.money=Math.max(0,S.money+mo); add("money",mo,"家用"); }
  if(a.hp){   const v=a.hp*2.6; S.health=cl(S.health+v); add("health",v,"锻炼"); }
  if(a.study){const v=a.study*1.7*m.studyMul*studyEff(); S.ability = Math.max(0, S.ability + v);
              const h=-a.study*0.18*hpLossMul(); S.health=cl(S.health+h); add("health",h,"熬夜"); }

  settle();
}

/* ---------- 年终结算 ---------- */
function settle(){
  const m = waveMods();
  const D = S.deltas, P = (S.parts = S.parts || {});
  const add=(k,v,why)=>{ D[k]=(D[k]||0)+v;
    if(why){ (P[k] = P[k] || {}); P[k][why] = (P[k][why] || 0) + v; } };
  const rows = [];

  // 收入支出
  let inc = SALARY[S.rank] * m.incomeMul + tSum("income") + (S.flags.shareIncome || 0);
  let exp = 3.6 + Math.max(0,(S.age-25))*0.10;
  exp += SALARY[S.rank] * 0.26;          // 位置越高，人情往来、场面开销越贵
  exp += tSum("expense");                // 词条带来的固定开销（国际学校、场面……）
  if(S.flags.house) exp += 4.6;
  if(S.flags.married && S.age>=32) exp += 2.2;
  exp += rnd(0.5,1.8);
  const net = inc - exp;
  S.money = Math.max(0, S.money + net); add("money", net, "工资");
  S.legit = Math.max(0, (S.legit ?? 2) + net);   // 只累计工资口径的净额
  S.incExp = [inc, exp];

  // 自然衰减
  let hd = S.age<30 ? -0.15 : S.age<35 ? -0.35 : S.age<50 ? -1.2 : S.age<60 ? -2.0 : S.age<70 ? -3.2 : -5.0;
  hd *= m.healthMul * tMul("hpDecay");
  S.health = cl(S.health + hd); add("health", hd, "自然衰减");

  let fd = -1.5 + tSum("famDecay");
  S.family = cl(S.family + fd); add("family", fd, "自然疏远");

  // 政绩/人脉折旧
  const dm = decayMul();
  const md = -S.merit*0.055*dm*tMul("meritDecay"), nd = -S.network*0.032*dm*tMul("netDecay")*m.netDecayMul;
  S.merit = cl(S.merit+md); S.network = cl(S.network+nd);
  add("merit", md, "折旧"); add("network", nd, "折旧");
  S.decayLabel = dm >= 0.95 ? "" : `折旧加速 ×${dm.toFixed(2)}`;

  // 档案词条带来的逐年增减
  const nY = tSum("netYear"), rY = tSum("riskYear");
  if(nY){ S.network = cl(S.network + nY); add("network", nY, "档案词条"); }
  if(rY){ S.risk = cl(S.risk + rY, 0, 140); add("risk", rY, "档案词条"); }

  // 旧事渐远：风险随时间缓慢淡化
  if(S.risk > 0){ S.risk = Math.max(0, S.risk*(S.risk>60 ? 0.930 : 0.955) - 0.7); }

  // 山头：上面有人，很多事在你听说之前就被摆平了；代价是你每年都陷得更深
  if(S.circle.in && !S.circle.fell){
    S.circle.depth += 0.6;
    if(S.risk > 0){ S.risk = Math.max(0, S.risk - 1.6); add("risk", -1.6, "有人替你摆平"); }
  }
  // 塌方：靠山倒了，你这些年欠的一次结清
  if(S.circle.in && !S.circle.fell && S.circle.doomed && !S.forceEvent
     && S.year - S.circle.since >= S.circle.fallAt){
    S.forceEvent = "circle_fall";
  }

  // 冲顶通道：到了正部之后按阶段推进，不再靠每年掷骰子
  if(!S.forceEvent && !S.flags.topDoorShut){
    const st = S.flags.topStage || 0;
    const wait = S.year - (S.flags.topStageYear || 0);
    // 摔下来过就得晾几年，不能隔年又把你叫回去谈一次
    const again = S.flags.topTries ? 3 : 0;
    if(S.rank === 8 && st === 0 && S.yearsInRank >= 2 && wait >= again) S.forceEvent = "top1";
    else if(S.rank === 8 && st === 1 && wait >= 1)          S.forceEvent = "top2";
    else if(S.rank === 8 && st === 2 && wait >= 1)          S.forceEvent = "top3";
  }

  // 病退窗口：身体撑不住了，给一次正式的选择，一生一次
  if(!S.retired && !S.forceEvent && !S.flags.bingtuiAsked && S.health <= 26 && S.age < S.retireAge - 2){
    S.forceEvent = "bingtui_ask";
  }

  // 外逃窗口：办了境外后路 + 风险到位 → 必然找上门，一生一次
  // 外逃：级别太高走不掉，钱不够也没必要走。处厅级捞了大钱又随时可能落网的人，才会真动这个念头。
  if(S.flags.assetsOut && !S.flags.escapeAsked && !S.forceEvent
     && S.risk >= 55 && S.rank <= 6 && (S.grey || 0) >= 600 && S.money >= 500){
    S.forceEvent = "escape";
  }

  // 婚姻危机计数：家庭长期低于 15，触发离婚事件
  if(S.flags.married && S.family < 15) S.lowFamYears = (S.lowFamYears||0) + 1;
  else S.lowFamYears = 0;
  if(S.flags.married && S.lowFamYears >= 3 && !S.forceEvent){
    if(S.flags.married && !S.flags.divorced){ S.forceEvent = "divorce"; }
    S.lowFamYears = 0;
    S.notices.push({ t:"家 中", b:"这个家已经很久没有人说话了。\n\n你有时候会想，是从哪一年开始的。" , gray:true});
  }

  // 家庭崩盘反噬
  if(S.family < 30 && chance(S.family < 15 ? 0.55 : 0.3)){
    const p = -ri(2,5), h = -ri(1,4);
    S.merit = cl(S.merit+p); S.health = cl(S.health+h);
    add("merit",p); add("health",h);
    S.notices.push({ t:"家 中", b: S.family<15
      ? (S.flags.married ? "{配偶}提出了分居。你在客厅坐到天亮，第二天照常去上班。\n\n那天的会你走神了两次。"
                         : "你已经很久没回过老家了。上次通电话是什么时候，你想不起来。")
      : "家里最近气氛不对。你在办公室也静不下心。" , gray:true});
  }
  // 健康崩盘
  if(S.health < 25 && !S.overtime){
    S.notices.push({ t:"医 院", b:"医生说，你必须做个选择了。", gray:true });
  }

  S.yearEnd = rows;
  S.phase = "settle";
  render();
}

/* ---------- 晋升判定 ---------- */
function ageCoef(target){
  const p = PROMO[target]; if(!p) return 1;
  const over = S.age - p.line;
  let c = over<=0 ? 1 + Math.min(.1, -over*0.012) : 1 - over*0.06;
  c += waveMods().ageCoefBonus;
  return Math.max(0.35, Math.min(1.15, c));
}

function rivalTick(){
  const R = S.rival;
  if(R.rank>=8) return;
  const need = PROMO[R.rank+1];
  if(!need) return;
  const yrs = S.year - 2026;
  const expect = [0,4,8,13,19,26,34,43,53][R.rank+1] || 99;
  if(yrs >= expect && chance(.42)) R.rank++;
}

function advanceYear(){
  rivalTick();
  S.year++; S.age++; S.yearsInRank++;

  // 死亡判定
  if(S.health <= 0){
    if(!S.retired && S.age < S.retireAge){
      S.sickLeave = true; S.retired = true; S.health = 20;
      S.log.push([S.year, "因健康原因提前退出岗位"]);
      S.notices = [{t:"病 退",b:"医生把片子挂上去看了很久，然后说：你不能再这样下去了。\n\n你签字的时候手很稳，签完才发现出了一身汗。"}];
      return retireFlow();
    }
    S.diedInOffice = !S.retired;
    return endGame();
  }
  let dp = S.age<50?0.0018 : S.age<60?0.006 : S.age<70?0.019 : S.age<80?0.05 : S.age<90?0.12 : 0.27;
  dp *= 1 + Math.max(0,(70 - S.health)) / 42;   // 健康越差，风险成倍放大
  dp *= Math.max(0.22, 1 - Math.max(0, S.health - 68) * 0.026);  // 健康越好，越不容易出事
  if(S.health < 12) dp += 0.10;
  if(chance(dp)){ S.diedInOffice = !S.retired; return endGame(); }   // 没退休就死了，就是死在任上

  /* ---------- 风险什么时候才真的要命 ----------
     平时没有人天天盯着你，把柄攒着也就攒着。真正危险的是巡视组进驻的那一年——
     所以巡视是有周期的，而且提前一年会有风声，给你时间去把该退的退掉、该断的断掉。
  ------------------------------------------------ */
  if(!S.retired){
    // 提前一年放风
    if(!S.inspectWarned && S.year === S.nextInspect - 1){
      S.inspectWarned = true;
      if(S.risk >= 22 && !S.forceEvent) S.forceEvent = "fengsheng";
      S.notices.push({ t:"风 声", b:"有消息说，明年上面要来一轮巡视。\n\n通知还没下，但办公室已经有人开始整理这几年的档案了。\n\n" +
        (S.risk >= 45 ? "你心里过了一遍那几件事，睡得不太好。" :
         S.risk >= 20 ? "你想了想自己这些年，觉得应该没什么大问题。应该。" :
                        "你没什么可想的。这种时候，干净是一件很实在的东西。") });
    }
    // 进驻那一年
    if(S.year >= S.nextInspect){
      S.nextInspect = S.year + ri(5, 9);
      S.inspectWarned = false;
      const shield = (S.circle.in && !S.circle.fell ? 14 : 0) + tSum("shield");
      const exposure = Math.max(0, S.risk - shield);
      const p = exposure <= 26 ? 0 : Math.min(0.86, (exposure - 26) / 88);
      if(chance(p)){
        if(S.flags.tape && !S.flags.tapeUsed){      // 那份录音，用掉了
          S.flags.tapeUsed = true; S.flags.tape = false;
          S.risk = cl(S.risk - 30, 0, 140);
          S.notices.push({ t:"惊 险", b:"谈话进行到第三个小时，你把那段录音放了出来。\n\n屋里安静了很久。\n\n后来这件事不了了之。你保住了自己，也彻底得罪了另一个人——而且你手里再没有第二份录音了。" });
        } else { S.busted = true; return endGame(); }
      } else if(exposure > 8){
        S.risk = Math.max(0, S.risk * 0.82);        // 查过一轮，有些旧事就算翻篇了
        S.notices.push({ t:"巡 视", b:"巡视组进驻了两个月。\n\n他们调走了很多东西，找了很多人谈话，也找了你。\n\n" +
          (p >= .3 ? "撤的那天你在办公室坐到很晚，一直等到确认没有下文。那两个月你瘦了六斤。"
                   : "过程比你想的平静。他们撤的时候，你才发现自己一直绷着。") });
      }
    }
  }
  // 攒到这个地步，不用等巡视也会出事
  if(S.risk >= 118 || (S.risk >= 88 && chance((S.risk - 88) / 1500))){
    S.busted = true; return endGame();
  }

  // 退休/加时赛
  if(!S.retired && !S.overtime){
    if(S.rank >= 8){ S.overtime = true; S.notices.push({t:"加 时",b:"到了这个位置，退休年龄不再由制度决定，由你自己决定。\n\n从今往后，每一年都是你自己选的。"}); }
    else if(S.age >= S.retireAge){ S.retired = true; return retireFlow(); }
  }
  if(S.overtime && S.age >= 66 && S.wantRetire){ S.retired = true; return retireFlow(); }

  startYear();
}

/* ---------- 退休后 ---------- */
function retireFlow(){
  if(S.careerEnd == null) S.careerEnd = S.year;
  if(!S.retiredBonus){ S.retiredBonus = true; S.health = cl(S.health + 10); }
  S.phase = "retired";
  S.log.push([S.year, "退休"]);
  render();
}
function retireYear(){
  S.year++; S.age++;
  S.health = cl(S.health - (S.age<75?2.1:S.age<85?3.4:5.2));
  S.family = cl(S.family + 2.4);
  const rnet = SALARY[S.rank]*0.55 - 6;
  S.money = Math.max(0, S.money + rnet);
  S.legit = Math.max(0, (S.legit ?? 2) + rnet);
  S.retireNote = null;
  // 退休不等于翻篇，但也不是每年都在查你——隔几年才会有一次倒查
  if(S.riskRetireClock == null) S.riskRetireClock = S.year + ri(3, 7);
  if(S.year >= S.riskRetireClock){
    S.riskRetireClock = S.year + ri(4, 8);
    const ex = Math.max(0, S.risk - (S.flags.confessed ? 30 : 0) - tSum("shield"));
    if(ex > 30 && chance(Math.min(0.5, (ex - 30) / 110))){ S.busted = true; return endGame(); }
  }
  let rdp = S.age<75?0.028 : S.age<85?0.085 : S.age<93?0.2 : 0.34;
  rdp *= 1 + Math.max(0,(70 - S.health)) / 42;
  rdp *= Math.max(0.22, 1 - Math.max(0, S.health - 68) * 0.026);
  if(S.health<=0 || chance(rdp)) return endGame();
  const notes = [
    "你开始每天早上六点半在小区里走两圈。有人在电梯里叫你老领导，你摆摆手。",
    "孙子上小学了。你去接过两次，站在校门口，觉得比开会还紧张。",
    "老同事组织了个群，一开始很热闹，后来一年也响不了几次。",
    "你把办公室带回来的那个搪瓷缸洗干净了，摆在阳台上养多肉。",
    "你偶尔还会梦见开会。醒了以后要愣一会儿才想起来自己已经退了。",
    "有个当年的下属来看你，聊了两个小时。走的时候你送到楼下。",
  ];
  S.retireNote = pick(notes);
  render();
}

/* ---------- 结局 ---------- */
function endGame(){
  S.dead = true;
  if(S.careerEnd == null) S.careerEnd = S.year;
  if(S.busted){
    const grey = S.grey || 0;
    S.seized = Math.min(S.money, grey);          // 违法所得，全额追缴
    S.money = Math.max(0, S.money - S.seized);
    S.flags.shareIncome = 0;
    S.log.push([S.year, "接受组织审查，被开除公职"]);
    if(S.seized >= 1) S.log.push([S.year, "违法所得 " + yuan(S.seized, 0) + " 全部追缴"]);
  } else if(S.sickLeave && S.careerEnd === S.year){
    S.log.push([S.year, "逝世，享年 " + S.age + " 岁"]);
  } else {
    S.log.push([S.year, "逝世，享年 " + S.age + " 岁"]);
  }
  S.ending = ENDINGS.find(e=>e.test(S)) || ENDINGS[ENDINGS.length-1];   // 传完整状态，别再漏字段
  S.phase = "end";
  render();
}

/* ==================================================================
   渲染
   ================================================================== */
function fmt(t){
  if(t==null || !S) return t;
  return String(t)
    .replace(/\{配偶\}/g, "妻子")
    .replace(/\{TA\}/g,   "她")
    .replace(/\{子女\}/g, S.flags.childBoy ? "儿子" : "女儿")
    .replace(/\{TA子\}/g, S.flags.childBoy ? "他" : "她")
    .replace(/\{下一级\}/g, RANKS[Math.min(9, S.rank + 1)]);
}

const riskText = r =>
  r<10 ? "心里踏实" : r<25 ? "偶尔会想起某些事" : r<45 ? "半夜有时候会醒" :
  r<62 ? "听见走廊的脚步声会停一下" : r<80 ? "你知道那一天迟早会来" : "你已经开始整理东西了";

function statBar(nm, v, key, color){
  const d = S.deltas[key];
  const pct = cl(v);
  // 只有「生活线」低了才是危险；政绩/人脉低只是还没积累，开局本来就是 5，不该报红
  const warn = (key === "health" || key === "family") && v < 25;
  const dt = d && Math.abs(d)>=0.5
    ? `<span class="dt ${(key==="risk" ? d<0 : d>0) ? 'up':'dn'}">${d>0?'+':''}${d.toFixed(0)}</span>` : "";
  return `<div class="stat"><span class="nm${warn?' warn':''}">${nm}</span>
    <span class="bar"><i class="b-${color}" style="width:${pct}%"></i></span>
    <span class="vl${warn?' warn':''}">${Math.round(v)}${dt}</span></div>`;
}

function panelStats(){
  const md = S.deltas.money;
  const used = Object.values(S.alloc||{}).reduce((a,b)=>a+b,0);
  const left = Math.max(0, (S.energyPool||0) - used);
  const maxE = (S.energyPool||0);
  let pips = "";
  for(let i=0;i<maxE;i++) pips += `<i class="${i<left?'on':''}"></i>`;
  return `<div class="card tight">
    <div class="stats">
      ${statBar("政　绩", S.merit, "merit", "merit")}
      ${statBar("人　脉", S.network, "network", "net")}
      ${statBar("身　体", S.health, "health", "hp")}
      ${statBar("家　庭", S.family, "family", "fam")}
      ${statBar("风　险", S.risk, "risk", "risk")}
    </div>
    ${(!S.retired && S.nextInspect) ? (()=>{
      const d = S.nextInspect - S.year;
      const txt = d <= 0 ? "巡视组今年进驻" : d === 1 ? "明年就要来巡视了" : `下一轮巡视 · 大约 ${cn(d)} 年后`;
      const hot = d <= 1;
      return `<div class="inspect${hot?" hot":""}"><span class="nm">巡　视</span><span class="vl">${txt}</span></div>`;
    })() : ""}
    <div class="enrow">
      <span class="nm">本年精力</span>
      <span class="epips">${pips}</span>
      <span class="vl">${left} / ${maxE}</span>
    </div>
    <div class="moneyrow">
      <span>存款 <b>${yuan(S.money)}</b>${md&&Math.abs(md)>=.5?` <span class="dt ${md>0?'up':'dn'}">${md>0?'+':''}${md.toFixed(1)}</span>`:""}</span>
      <span>能力 <b>${Math.round(S.ability)}</b><span class="ab">　工作产出 ×${(1+S.ability/200).toFixed(2)}</span></span>
      <span class="risknote">${riskText(S.risk)}</span>
    </div>
  </div>`;
}

function traitEffText(t){
  const e = t.eff, p = [];
  if(e.workMul)  p.push(`工作产出 +${Math.round((e.workMul-1)*100)}%`);
  if(e.relMul)   p.push(`关系产出 +${Math.round((e.relMul-1)*100)}%`);
  if(e.netDecay) p.push(`人脉折旧 −${Math.round((1-e.netDecay)*100)}%`);
  if(e.meritDecay) p.push(`政绩折旧 −${Math.round((1-e.meritDecay)*100)}%`);
  if(e.promo)    p.push(`晋升评分 +${e.promo}`);
  if(e.income)   p.push(`年收入 +${e.income} 万`);
  if(e.famDecay) p.push(`家庭每年 ${e.famDecay>0?"+":""}${e.famDecay}`);
  if(e.netYear)  p.push(`人脉每年 +${e.netYear}`);
  if(e.riskYear) p.push(`风险每年 +${e.riskYear}`);
  if(e.special)  p.push(e.special);
  return p.join("　");
}
function toggleTraits(){ S.showTraits = !S.showTraits; render(); }

function panelStatus(){
  const tr = activeTraits();
  const wv = S.waves.map(w=>(WAVES.find(x=>x.id===w.id)||{}).name).join(" · ");
  const kid = S.flags.child ? ` · 有${S.flags.childBoy?"子":"女"}` : "";
  const ms = S.flags.married ? "已婚" + kid
           : (S.flags.divorced ? "离异" + kid : "未婚");
  return `<div class="statusbar">
    <span class="yr">${S.year}</span>
    <span class="rk">${S.age} 岁 · ${RANKS[S.rank]} · ${ms}</span>
    <span class="meta">
      ${wv ? `<span class="wv">时局：${wv}</span>` : ""}
      ${tr.length ? `<button class="tchip${S.showTraits?" on":""}" onclick="toggleTraits()">档案 <b>${tr.length}</b> ${S.showTraits?"▴":"▾"}</button>` : ""}
    </span>
  </div>
  ${S.showTraits && tr.length ? `<div class="card tight tcard">
    <div class="sec-title">档 案</div>
    ${tr.map(t=>`<div class="ti"><span class="tn">${t.name}</span><span class="te">${traitEffText(t)}</span>
      <div class="td">${t.desc}</div></div>`).join("")}
  </div>` : ""}`;
}

function panelNotices(){
  return S.notices.map(n=>`<div class="notice ${n.gray?'gray':''}"><div class="nt">${n.t}</div>${fmt(n.b)}</div>`).join("");
}

/* 年度结算：一项指标一行，左边是最终结果，右边是它由什么构成 */
function settleTable(){
  const NM = { merit:"政　绩", network:"人　脉", health:"身　体", family:"家　庭", risk:"风　险", money:"存　款" };
  const ORDER = ["merit","network","health","family","risk","money"];
  const D = S.deltas || {}, P = S.parts || {};
  const rows = ORDER.filter(k => Math.abs(D[k]||0) >= 0.05).map(k=>{
    const v = D[k], isM = k === "money";
    let why;
    if(isM && S.incExp){
      why = `收入 ${S.incExp[0].toFixed(1)} · 支出 ${S.incExp[1].toFixed(1)}　万`;
    } else {
      why = Object.entries(P[k]||{})
        .filter(([,x]) => Math.abs(x) >= 0.05)
        .sort((a,b) => Math.abs(b[1]) - Math.abs(a[1]))
        .map(([n,x]) => `${n} ${x>0?"+":"−"}${Math.abs(x).toFixed(1)}`)
        .join(" · ");
      if(k === "merit" && S.decayLabel) why += "　" + S.decayLabel;
    }
    const num = isM ? (v>0?"+":"−") + yuan(Math.abs(v))
                    : (v>0?"+":"−") + Math.abs(v).toFixed(0);
    // 风险涨了是坏事，跌了是好事，颜色要反过来
    const good = k === "risk" ? v < 0 : v > 0;
    return `<div class="sr"><span class="k">${NM[k]}</span>` +
           `<span class="v ${good?"up":"dn"}">${num}</span>` +
           `<span class="why">${why}</span></div>`;
  }).join("");
  return rows || `<div class="sr"><span class="k">这一年</span><span class="v">—</span><span class="why">什么也没有变</span></div>`;
}

function effLine(D){
  const NM = {merit:"政绩",network:"人脉",health:"身体",family:"家庭",money:"存款",risk:"风险"};
  const out = [];
  for(const k in D){
    if(k==="risk") continue;
    const v = D[k]; if(Math.abs(v)<0.5) continue;
    const u = k==="money"?" 万":"";
    out.push(`<span class="dt ${v>0?'up':'dn'}">${NM[k]} ${v>0?'+':''}${k==="money"?v.toFixed(1):v.toFixed(0)}${u}</span>`);
  }
  return out.length ? `<div class="eff">${out.join("")}</div>` : "";
}

let lastViewKey = null;
function scrollTopIfNewView(key){
  if(key === lastViewKey) return;     // 同一画面内的操作（如加减精力）不滚动
  const first = lastViewKey === null;
  lastViewKey = key;
  if(first){ window.scrollTo({ top:0, behavior:"auto" }); return; }
  // 换画面时对齐到正文卡片顶部，红头和属性栏留在上面，不再整页弹回
  const anchor = document.getElementById("focus");
  if(!anchor){ window.scrollTo({ top:0, behavior:"smooth" }); return; }
  const y = anchor.getBoundingClientRect().top + window.pageYOffset - 8;
  if(window.pageYOffset > y + 4 || window.pageYOffset < y - 4){
    window.scrollTo({ top: Math.max(0, y), behavior:"smooth" });
  }
}

function render(){
  const app = $("#app");
  if(!S){ return renderTitle(); }
  saveProgress();                       // 放在提前 return 之前，结局页/退休页也要能续上

  if(S.phase==="end") return renderEnd();
  if(S.phase==="retired") return renderRetired();

  let h = panelStatus() + panelStats() + panelNotices() + `<div id="focus"></div>`;

  if(S.phase==="event"){
    const e = S.curEv;
    h += `<div class="card">
      <span class="ev-tag">${e.tag||"事件"}</span>

      return `<div class="arow">

  }

  else if(S.phase==="settle"){
    h += `<div class="card">
      <div class="sec-title">${S.year} 年 度 结 算</div>

  }

  else if(S.phase==="promo"){

    h += `<div class="card">

/* 小数字写成中文，跟公文口吻对得上 */
function cn(n){
  n = Math.round(n);
  if(n < 0 || n > 99) return String(n);
  const d = "零一二三四五六七八九";
  if(n < 10) return d[n];
  if(n < 20) return "十" + (n%10 ? d[n%10] : "");
  return d[Math.floor(n/10)] + "十" + (n%10 ? d[n%10] : "");
}

/* ---------- 任命：每一级都该有它自己的分量 ----------
   引用玩家的真实状态：熬了多少年、多大岁数、比参考线早还是晚、同届那个人到哪了。
------------------------------------------------ */
function promoScene(t, waited){
  const s = S, age = s.age, line = PROMO[t] ? PROMO[t].line : 99;
  const early = age <= line - 4, late = age >= line + 3;
  const rival = s.rival.name, rivalRank = RANKS[s.rival.rank];

  switch(t){
    case 1: return `任免文件是下午三点贴出来的，一共十九个人，你在第七行。\n\n你在公告栏前面站了一会儿，装作在看旁边那张通知。等走廊里没人了，你才回过头，把那一行又看了一遍。\n\n晚上你给家里打了电话。你妈问副科是多大的官，你想了想说：就是科员上面那一级。\n\n她「哦」了一声，然后你听见她在那头跟你爸说：儿子当官了。\n\n那天你${cn(age)}岁，工作满${cn(yrs)}年。`;

    case 2: return `「张科长。」\n\n第一次有人这么叫你，是在楼梯口。你「嗯」了一声，走出三步才反应过来那是在叫你。\n\n${s.flags.dorm ? "你搬出了单位宿舍，租了个带阳台的房子。" : "你换了张新桌子，靠窗。"}办公室里那摞材料还在，只是现在轮到你往别人桌上放了。\n\n${late ? `你比参考线晚了${cn(age-line)}年。这几年你想过很多次会不会就到此为止了。` : `你比参考线早了${cn(line-age)}年。有人在背后说你运气好——你没有辩解，因为辩解也没用。`}`;

    case 3: return `处级是一道坎。\n\n全县两千多名干部，跨过这道坎的不到两百个。你在${RANKS[2]}这个位置上待了${cn(yrs)}年，中间报过三次${RANKS[3]}的名额，前两次都没有你。\n\n宣布的那天你坐在会议室第二排，念到你名字的时候，你正在低头看手机上的一条无关消息。\n\n散会后有五个人跟你握手，其中两个你叫不出全名。\n\n${'同届那个'+rival+'现在还是'+rivalRank+'。'}`;

    case 4: return `你现在是一个单位的一把手。\n\n这句话的具体含义是：所有材料的最后一个签字人是你；所有出了事要在电视上说话的人是你；所有下班后还亮着的那一盏灯，是你办公室的。\n\n上任第一天你在办公室转了一圈，最后在那把椅子后面站了很久，没有坐下去。\n\n${s.flags.bigwin ? "他们把你调来，是因为你干成过一件事。这一点你自己比谁都清楚。" : "你不知道为什么是你。这个问题你后来问过很多次，一次答案都没有得到。"}\n\n你今年${cn(age)}岁。`;

    case 5: return `副厅是另一个世界的门槛。\n\n从这一天起：你有了专车和司机；开会时你的座次固定在第二排中间；你说的每一句话都会被人记下来，包括你自己都觉得不重要的那些。\n\n还有一件小事——秘书开始在你进门前把茶泡好，水温刚好能入口。你从来没有说过你喜欢多少度。\n\n${s.circle.in && !s.circle.fell ? `你知道这一步里有多少是自己挣的，有多少是别人替你说的话。这个账你不敢细算。` : `这一步是你自己走上来的。这句话你没跟任何人说过，因为说出来就掉价了。`}\n\n熬到这里，你用了${cn(age-22)}年。`;

    case 6: return `任命宣布那天，会场里坐了四百多人。\n\n你讲了十二分钟，稿子是别人写的，但你在第七段加了一句自己的话。加的那句没有人记住，包括写稿的人。\n\n散会后你回到新办公室，一百二十平，落地窗，会议桌能坐十六个人。\n\n你在窗前站着，忽然想起二十多年前青阳县那间办公室——最里面那张桌子，一台落了灰的电脑，一个印着「先进工作者」的搪瓷缸。\n\n那个缸子后来去哪了，你想不起来了。`;

    case 7: return `这一级的任命不在本单位宣布，是上面来人宣布的。\n\n来的人级别比你高一级，讲了八分钟，最后说了句「希望同志们支持新班子的工作」。你坐在旁边，手放在膝盖上，姿势和二十多年前听领导讲话时一模一样。\n\n从今天起，全国和你同一级别的人，数得过来。\n\n${s.flags.child ? "你{子女}打来电话，说在新闻上看见你了。{TA子}的语气有点陌生，像在跟一个不太熟的长辈说话。" : "这天晚上你一个人吃的饭。你给自己倒了半杯酒，喝了三分之一就放下了。"}\n\n${'同届的'+rival+'去年退了，退休前是'+rivalRank+'。'}`;

  }
  return null;
}

function evaluatePromotion(){
  const t = S.rank + 1;
  if(t > 9) return;
  const p = PROMO[t], m = waveMods();
  if(S.yearsInRank < p.years) return;
  if(t === 9){
    const fails = [];
    if(!S.flags.topDone) fails.push("你还没有做成那件足以让所有人闭嘴的事。");
    if(!S.flags.zhengbuInTime) fails.push("组织上综合考虑，认为年龄结构不合适。");
    if(S.risk >= (S.flags.recused ? 26 : 15)) fails.push("考察期间，有人反映了一些情况。");
    if(S.ability < 64) fails.push("同志们认为在专业素养上还需要再沉淀。");
    if(!(S.flags.bigwin || S.flags.crisis)) fails.push("履历很完整，但缺一件真正扛过事的经历。");
    if(S.merit < 76) fails.push("分量还差一点。差的这一点，没有人说得出具体是什么。");
    if(S.network < 70) fails.push("推荐环节，票数不够。");
    if(S.health < 45) fails.push("体检结论，不予通过。");
    if(fails.length){
      if(chance(.5)) S.promoMsg = { fail:true, txt:"考察组来了，谈了三天，然后走了。\n\n很久以后你才辗转听到一句评价：\n\n「"+pick(fails)+"」" };
      return;
    }
  }
  const wait = Math.max(0, S.yearsInRank - p.years);
  const slotP = Math.min(0.85, p.slot * m.slotMul * (1 + 0.12*wait));
  if(!chance(slotP)){
    if(chance(.35)) S.promoMsg = { fail:true, txt:`今年${RANKS[t]}的位置没有空出来。\n\n没有人正式告诉你这件事，你是从别人的语气里知道的。` };
    return;
  }
  const score = (S.merit*0.45 + S.network*0.35 + rnd(0,100)*0.20) * ageCoef(t) + tSum("promo")
        + (S.circle.in && !S.circle.fell ? 5 : 0) - (S.circle.fell ? 9 : 0)
        - (!S.flags.married && !S.flags.divorced && S.age >= 34 ? (S.age >= 44 ? 6 : 4) : 0);
  if(score >= p.need){
    if(t === 9){                        // 副国级即终局，不再继续游戏
      S.rank = 9; S.topped = true;
      S.log.push([S.year, "任副国级职务"]);
      return endGame();
    }
    const waitedYears = S.yearsInRank;
    S.rank = t; S.yearsInRank = 0; S.merit *= 0.74;
    if(t===8) S.flags.zhengbuInTime = true;   // 硬门槛已由冲顶链承担，此处不再卡年龄
    S.log.push([S.year, "晋升为 " + RANKS[t]]);
    const base = RETIRE_AGE(t), plus = S.retireAge>65 ? S.retireAge-65 : 0;
    if(base!==999) S.retireAge = base + plus;
    const scene = t===9
      ? "任命通知下来那天，办公室里很安静。\n\n你走到窗前，看见楼下一个年轻人抱着一摞材料快步走过。\n\n那摞材料大概有二十七公分高。\n\n从这一天起，退休时间由你自己决定。"
      : (promoScene(t, waitedYears) || "任前公示挂出来了，你的名字在第一个。");
    S.promoMsg = { fail:false, promo:true, from:RANKS[t-1], to:RANKS[t], txt:scene };
  } else {
    const who = `同年入职的${S.rival.name}（现${RANKS[S.rival.rank]}）`;
    S.promoMsg = { fail:true, txt:`名单公布了。\n\n本次提拔的是${who}。\n\n你把文件从头到尾看了两遍。` };
  }
}

function setPip(k, n){
  const other = Object.keys(S.alloc).reduce((a,x)=>a+(x===k?0:S.alloc[x]),0);
  const max = Math.min(ALLOC_CAP, S.energyPool - other);
  S.alloc[k] = Math.max(0, Math.min(n===S.alloc[k] ? n-1 : n, max));
  render();
}

/* ---------- 断点续玩 ----------
   不是存档系统，是防手滑：每渲染一次就把状态写进 localStorage，
   刷新 / 误关标签页 / 手机切后台被回收，回来还在原地。
   超过 12 小时自动作废，重开会清掉。
   事件和结局是带函数的对象，不能直接序列化，存 id、读回来再挂上。
------------------------------------------------ */
const SAVE_KEY = "tiefanwan.progress.v1";
const SAVE_TTL = 12 * 60 * 60 * 1000;

function saveProgress(){
  if(!S) return;
  try{
    const d = Object.assign({}, S);
    d.queue = (S.queue || []).map(e => e && e.id).filter(Boolean);
    d.curEv = S.curEv ? S.curEv.id : null;
    d.ending = S.ending ? S.ending.id : null;
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v:1, t:Date.now(), s:d }));
  }catch(e){ /* 无痕模式 / 存储被禁，静默放弃 */ }
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const box = JSON.parse(raw);
    if(!box || box.v !== 1 || !box.s) return null;
    const age = Date.now() - (box.t || 0);
    if(age > SAVE_TTL){ clearProgress(); return null; }
    const d = box.s;
    d.queue  = (d.queue || []).map(id => EVENTS.find(e => e.id === id)).filter(Boolean);
    d.curEv  = d.curEv  ? (EVENTS.find(e => e.id === d.curEv) || null) : null;
    d.ending = d.ending ? (ENDINGS.find(e => e.id === d.ending) || null) : null;
    if(d.curEv == null && d.phase === "event") return null;   // 存档不完整，宁可从头
    d.circle = d.circle || { in:false, name:null, depth:0, since:0, doomed:false, fell:false, fallAt:99 };
    d._resumedAge = age;
    return d;
  }catch(e){ return null; }
}

function clearProgress(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

function resumeOrTitle(){
  const d = loadProgress();
  if(!d){ return renderTitle(); }
  S = d;
  const mins = Math.round(d._resumedAge / 60000);
  const when = mins < 1 ? "刚才" : mins < 60 ? mins + " 分钟前" : Math.round(mins/60) + " 小时前";
  delete S._resumedAge;
  lastViewKey = null;
  render();
  toast("已回到" + when + "离开的地方");
}

/* 顶部短暂提示，两秒后自己消失 */
function toast(msg){
  try{
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(()=>{ el.classList.add("out"); }, 2200);
    setTimeout(()=>{ el.remove(); }, 2700);
  }catch(e){}
}

/* ---------- 启动 ---------- */
resumeOrTitle();
</script>
