<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>铁饭碗模拟器</title>
<meta name="description" content="一款文字类仕途模拟游戏。你 22 岁，考公上岸。每一年做一次选择，直到退休、或者走不动为止。">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#9c2b23">
<meta property="og:type" content="website">
<meta property="og:title" content="铁饭碗模拟器">
<meta property="og:description" content="你 22 岁，考公上岸。一年一个选择，直到退休、或者走不动为止。">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23e9e3d6'/%3E%3Ctext y='.9em' font-size='84' x='8' fill='%239c2b23' font-family='sans-serif' font-weight='bold'%3E铁%3C/text%3E%3C/svg%3E">
<style>
/* ============ 基础 ============ */
:root{
  color-scheme: light;
  --paper:#e9e3d6;
  --card:#fbf8f1;
  --card2:#f3eee2;
  --ink:#26221c;
  --ink2:#5c5548;
  --ink3:#8d8474;
  --red:#9c2b23;
  --red2:#c0392b;
  --line:#c9bfa8;
  --line2:#ddd4bf;
  --good:#3d6b45;
  --bad:#9c2b23;
  --c-merit:#35617f;
  --c-net:#9a7420;
  --c-hp:#3d6b45;
  --c-fam:#8c4f6b;
  --c-risk:#9c2b23;
  --display:"Heiti SC","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --serif:"Songti SC","STSong","SimSun","Source Han Serif SC","Noto Serif CJK SC","Noto Serif SC",serif;
}
*{box-sizing:border-box}
button, input, select, textarea{
  -webkit-appearance:none; -moz-appearance:none; appearance:none;
  background-image:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;              /* 长按不弹系统菜单 */
  -webkit-user-select:none; user-select:none;  /* 长按不出蓝色选中层 */
  -webkit-text-fill-color:currentColor;   /* iOS 会用系统色覆盖按钮文字，这条锁死 */
  font:inherit; color:inherit;
  border-radius:0;
}
button{ text-shadow:none; }
body{
  margin:0; padding:0;
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.014) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.5), transparent 60%);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px; margin:0 auto; padding:0 16px 80px}

/* ============ 红头 ============ */
header.doc{padding:26px 0 0; text-align:center}
.doc h1{
  font-family:var(--serif); font-weight:700;
  color:var(--red); margin:0;
  font-size:clamp(26px,6.5vw,40px);
  letter-spacing:clamp(4px,2vw,14px);
  text-indent:clamp(4px,2vw,14px);
}
.doc .sub{
  font-family:var(--serif); color:var(--ink3);
  font-size:12px; letter-spacing:3px; margin-top:6px;
}
.rule{border:0; border-top:2.5px solid var(--red); margin:12px 0 2px}
.rule.thin{border-top:1px solid var(--red); margin:0 0 18px}

/* ============ 卡片 ============ */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:2px;
  padding:18px 20px;
  margin:14px 0;
  box-shadow:0 1px 0 rgba(0,0,0,.04), 0 6px 18px -14px rgba(0,0,0,.4);
}
.card.tight{padding:14px 16px}
.sec-title{
  font-family:var(--display); font-size:13px; font-weight:700;
  letter-spacing:3px; color:var(--ink2);
  border-left:3px solid var(--red); padding-left:9px;
  margin:0 0 12px;
}

/* ============ 状态栏 ============ */
.statusbar{
  display:flex; flex-wrap:wrap; gap:8px 18px; align-items:baseline;
  font-family:var(--display); padding:12px 16px;
  background:var(--card2); border:1px solid var(--line);
  border-top:3px double var(--red);
  margin:0 0 14px;
}
.statusbar .yr{font-size:22px; font-weight:700; color:var(--red); letter-spacing:1px}
.statusbar .rk{font-size:17px; font-weight:700}
.statusbar .meta{
  font-size:12.5px; color:var(--ink2); margin-left:auto;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;
}
.statusbar .wv{line-height:1.5}
.tcard .ti{padding:8px 0; border-bottom:1px dotted var(--line2)}
.tcard .ti:last-child{border-bottom:0}

/* ============ 指标 ============ */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:9px 20px}
.stat{display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center}
.stat .nm{font-family:var(--display); font-size:13.5px; font-weight:800; color:var(--ink); letter-spacing:1px; white-space:nowrap}
.stat .bar{height:7px; background:#ded5c0; border-radius:0; overflow:hidden; position:relative}
.stat .bar i{display:block; height:100%; background:var(--ink2); transition:width .5s cubic-bezier(.2,.8,.3,1)}
.stat .bar i.b-merit{background:var(--c-merit)}
.stat .bar i.b-net  {background:var(--c-net)}
.stat .bar i.b-hp   {background:var(--c-hp)}
.stat .bar i.b-fam  {background:var(--c-fam)}
.stat .bar i.b-risk {background:var(--c-risk)}
.stat .vl.warn{color:var(--red)}
.stat .nm.warn{color:var(--red)}
.enrow{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center;
  margin-top:11px; padding-top:11px; border-top:1px dashed var(--line)}
.enrow .nm{font-family:var(--display); font-size:13.5px; font-weight:800; color:var(--red); letter-spacing:1px; white-space:nowrap}
.inspect{display:flex; justify-content:space-between; align-items:center; gap:12px;
  margin-top:9px; padding-top:9px; border-top:1px dashed var(--line)}
.inspect .nm{font-family:var(--display); font-size:13px; font-weight:800; color:var(--ink2); letter-spacing:1px; white-space:nowrap}
.inspect .vl{font-family:var(--display); font-size:12.5px; color:var(--ink3); white-space:nowrap}
.inspect.hot .nm, .inspect.hot .vl{color:var(--red)}
.inspect.hot .vl{font-weight:800}
.enrow .vl{font-family:var(--display); font-size:14.5px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap}
.epips{display:flex; gap:3px; flex-wrap:wrap}
.epips i{width:13px; height:13px; border:1px solid var(--line); background:#e2dac6; display:block}
.epips i.on{background:var(--red); border-color:var(--red)}
.stat .vl{font-family:var(--display); font-size:14.5px; font-weight:800; font-variant-numeric:tabular-nums; min-width:36px; text-align:right; color:var(--ink)}
.stat .dt{font-size:11px; font-variant-numeric:tabular-nums; margin-left:3px}
.dt.up{color:var(--good)} .dt.dn{color:var(--bad)}
.moneyrow{
  display:flex; justify-content:space-between; align-items:baseline;
  font-family:var(--display); margin-top:11px; padding-top:10px; border-top:1px dashed var(--line);
  font-size:13.5px; font-weight:700; color:var(--ink2); flex-wrap:wrap; gap:6px 14px;
}
.moneyrow b{font-size:19px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums}
.risknote{font-size:12.5px; color:var(--ink3); font-style:italic}
.moneyrow .ab{font-size:11.5px; color:var(--ink3); font-weight:400}
.tchip{
  font-family:var(--display); font-size:12.5px; font-weight:700; letter-spacing:1px; cursor:pointer;
  border:1.5px solid var(--red); background:#fff; color:var(--red);
  -webkit-text-fill-color:var(--red);
  padding:4px 12px; border-radius:2px; transition:.15s; white-space:nowrap;
  box-shadow:0 1px 0 rgba(156,43,35,.18);
}
.tchip.on{background:var(--red); color:#fff; -webkit-text-fill-color:#fff}
.tchip b{font-size:14px}
.tpanel{margin-top:11px; padding-top:11px; border-top:1px dashed var(--line)}
.tpanel .ti{padding:7px 0; border-bottom:1px dotted var(--line2)}
.tpanel .ti:last-child{border-bottom:0}
.tn{font-family:var(--display); font-weight:700; font-size:13.5px}
.te{font-family:var(--display); font-size:12px; color:var(--red); margin-left:8px}
.td{font-size:12.5px; color:var(--ink3); line-height:1.6; margin-top:2px}
.tgain{
  margin-top:11px; padding-left:9px; border-left:2px solid var(--red);
  font-family:var(--display); font-size:12.5px; color:var(--ink2); letter-spacing:.5px;
}

/* ============ 事件 ============ */
.ev-tag{
  display:inline-block; font-family:var(--display); font-size:11px; letter-spacing:2px;
  color:var(--red); border:1px solid var(--red); padding:1px 7px; margin-bottom:9px;
}
.ev-title{font-family:var(--display); font-size:20px; font-weight:700; margin:0 0 12px; letter-spacing:.5px}
.ev-text{white-space:pre-wrap; color:var(--ink); margin-bottom:4px; font-weight:450}
.ev-text em{color:var(--ink3); font-style:italic}

.opts{margin-top:16px; display:grid; gap:9px}
.opt{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  width:100%; text-align:left; cursor:pointer;
  background:var(--card2); border:1px solid var(--line);
  padding:12px 14px; font:inherit; color:var(--ink);
  border-radius:2px; transition:.14s; position:relative;
  -webkit-text-fill-color:var(--ink);
}
.opt:disabled{opacity:.45; cursor:not-allowed}
.opt .ot{font-weight:700; flex:1; line-height:1.5}
.opt .oc{
  flex:none; font-size:12px; color:var(--ink2); font-family:var(--display);
  letter-spacing:.5px; white-space:nowrap; padding:2px 8px;
  border:1px solid var(--line); border-radius:2px; background:var(--card);
}
.opt .oc.no{color:var(--red); border-color:var(--red)}
.result{
  margin-top:14px; padding:12px 14px; background:#f0ece0;
  border-left:3px solid var(--ink3); white-space:pre-wrap; font-size:14.5px;
}
.eff{margin-top:9px; font-family:var(--display); font-size:12.5px; letter-spacing:1px; display:flex; flex-wrap:wrap; gap:4px 12px}

/* ============ 精力 ============ */
.enhead{display:flex; justify-content:space-between; align-items:baseline; font-family:var(--display); margin-bottom:12px; flex-wrap:wrap; gap:6px}
.enhead .left{font-size:13px; letter-spacing:2px; color:var(--ink2)}
.enhead .pts{font-size:15px}
.enhead .pts b{font-size:24px; color:var(--red); font-variant-numeric:tabular-nums}
.alloc{display:grid; gap:10px}
.arow{display:grid; grid-template-columns:104px auto 1fr auto; gap:11px; align-items:center}
.arow .num{font-family:var(--display); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; color:var(--ink2); min-width:16px}
.arow .lb{font-family:var(--display); font-size:14px; letter-spacing:1px}
.arow .lb small{display:block; font-size:10.5px; color:var(--ink3); letter-spacing:0; font-family:var(--sans)}
.pips{display:flex; gap:5px; flex-wrap:wrap; align-items:center}
.pip{width:26px; height:26px; border:1px solid var(--line); background:#e2dac6; cursor:pointer; transition:.1s; border-radius:2px}
.pip.on{background:var(--ink2); border-color:var(--ink2)}
.allocnote{margin-top:14px; padding-top:11px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--ink3); line-height:1.7}
.actrl{display:flex; gap:4px}
.actrl button{
  width:27px; height:27px; border:1px solid var(--line); background:var(--card2);
  cursor:pointer; font:inherit; font-size:15px; line-height:1; color:var(--ink);
  -webkit-text-fill-color:var(--ink); border-radius:2px;
}
.actrl button:disabled{opacity:.35; cursor:not-allowed}

/* ============ 按钮 ============ */
.btn{
  display:inline-block; font-family:var(--display); letter-spacing:3px; font-size:15px;
  background:var(--red); color:#fff; -webkit-text-fill-color:#fff;
  border:0; padding:11px 30px;
  cursor:pointer; border-radius:2px; transition:.15s;
}
.btn.ghost{background:transparent; color:var(--ink2); -webkit-text-fill-color:var(--ink2); border:1px solid var(--line); letter-spacing:2px; font-size:13px; padding:8px 18px}
.btnrow{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-top:16px}
.toast{
  position:fixed; left:50%; top:14px; transform:translateX(-50%);
  background:var(--red); color:#fff; -webkit-text-fill-color:#fff;
  font-family:var(--display); font-size:12.5px; letter-spacing:1.5px;
  padding:8px 18px; border-radius:2px; z-index:99; white-space:nowrap;
  box-shadow:0 2px 10px rgba(0,0,0,.18); opacity:1; transition:opacity .45s;
  padding-top:calc(8px + env(safe-area-inset-top,0px));
}
.toast.out{opacity:0}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
/* ============ 交互态 ============
   iOS Safari 点完之后会把 :hover 留在元素上，而 render() 是整段替换 innerHTML，
   新按钮正好落在手指底下就继承了高亮。所以 hover 只给真正有鼠标的设备，
   触摸设备用 :active —— 它在 touchend 时一定会清掉。
================================================================ */
@media (hover:hover) and (pointer:fine){
  .opt:hover:not(:disabled){background:var(--card); border-color:var(--red); transform:translateX(3px)}
  .btn:hover{background:#7d211a}
  .btn.ghost:hover{border-color:var(--red); color:var(--red); -webkit-text-fill-color:var(--red); background:var(--card)}
  .tchip:hover{background:var(--red); color:#fff; -webkit-text-fill-color:#fff}
  .pip:hover{border-color:var(--red)}
  .actrl button:hover:not(:disabled){background:var(--card); border-color:var(--red); color:var(--red); -webkit-text-fill-color:var(--red)}
}
/* 触摸反馈：按下时给一点，松手立刻还原 */
.opt:active:not(:disabled){background:var(--card); border-color:var(--red)}
.btn:active{background:#7d211a}
.btn.ghost:active{border-color:var(--red)}
.tchip:active{background:var(--red); color:#fff; -webkit-text-fill-color:#fff}
.actrl button:active:not(:disabled){border-color:var(--red)}
.pip:active{border-color:var(--red)}
/* 点过之后按钮会留焦点，iOS 上同样表现为"亮着"；键盘操作仍然保留可见焦点圈 */
button:focus{outline:none}
button:focus:not(:focus-visible){outline:none; box-shadow:none}
button:focus-visible{outline:2px solid var(--red); outline-offset:2px}
.center{text-align:center}

/* ============ 年终 ============ */
.ledger{font-family:var(--display); font-size:14px}
.sr{display:grid; grid-template-columns:auto auto 1fr; align-items:baseline; gap:0 12px;
    padding:7px 0; border-bottom:1px dotted var(--line2); font-family:var(--display)}
.sr:last-child{border-bottom:0}
.sr .k{color:var(--ink2); font-size:14px; font-weight:700}
.sr .v{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:66px}
.sr .v.up{color:var(--good)} .sr .v.dn{color:var(--bad)}
.sr .why{font-size:11.5px; color:var(--ink3); text-align:right; font-variant-numeric:tabular-nums}
@media(max-width:400px){ .sr{grid-template-columns:auto 1fr} .sr .why{grid-column:1/-1; text-align:left; margin-top:2px} }
.ledger div{display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dotted var(--line2); gap:12px}
.ledger div:last-child{border-bottom:0}
.ledger .k{color:var(--ink2)}
.ledger .v{font-variant-numeric:tabular-nums; white-space:nowrap}
.notice{
  border:1px solid var(--red); border-left-width:4px; background:#fdf6f4;
  padding:13px 16px; margin:12px 0; font-size:14.5px; white-space:pre-wrap;
}
.notice .nt{font-family:var(--display); font-weight:700; color:var(--red); letter-spacing:2px; margin-bottom:5px; font-size:13px}
.notice.gray{border-color:var(--line); background:var(--card2)}
.notice.promo{border-width:2px; border-left-width:2px; background:#fdf3f0;
  box-shadow:0 0 0 1px #fdf3f0, 0 2px 0 0 rgba(156,43,35,.10)}
.promo-jump{display:flex; align-items:center; justify-content:center; gap:clamp(10px,4vw,26px);
  font-family:var(--serif); margin:6px 0 14px; padding-bottom:13px;
  border-bottom:1px dashed rgba(156,43,35,.32)}
.promo-jump .old{font-size:clamp(15px,4vw,19px); color:var(--ink3); letter-spacing:3px; white-space:nowrap}
.promo-jump .arw{color:var(--red); font-size:clamp(15px,4vw,19px); opacity:.75}
.promo-jump .new{font-size:clamp(23px,6.6vw,32px); font-weight:700; color:var(--red);
  letter-spacing:clamp(3px,1.4vw,7px); white-space:nowrap;
  text-shadow:0 1px 0 rgba(255,255,255,.7)}
.promo-yrs{text-align:center; font-family:var(--display); font-size:11.5px; color:var(--ink3);
  letter-spacing:2px; margin:-8px 0 13px}
.notice.gray .nt{color:var(--ink2)}

/* ============ 结局 ============ */
.ending{text-align:center; padding:14px 6px 6px}
.ending .seal{
  display:inline-block; border:3px double var(--red); color:var(--red);
  font-family:var(--display); font-size:clamp(22px,5.5vw,30px); font-weight:800;
  letter-spacing:6px; text-indent:6px; padding:16px 26px; transform:rotate(-3.5deg);
  margin:10px 0 22px; opacity:.92;
}
.ending .etext{text-align:left; white-space:pre-wrap; font-size:15px; line-height:1.95}
.epi{text-align:left; font-family:var(--display); font-size:14px; border-top:1px solid var(--line); margin-top:20px; padding-top:14px}
.warnnote{white-space:pre-wrap; font-size:13.5px; line-height:1.95; color:var(--ink2);
  border-left:3px solid var(--red); padding:2px 0 2px 13px; margin:2px 0}
.epi > div{display:flex; justify-content:space-between; padding:3px 0; gap:12px}
.epi > .timeline{display:block}
.timeline{overflow-x:hidden}
.epi .k{color:var(--ink2)}

/* ============ 杂 ============ */
.redline{font-family:var(--display); font-size:12.5px; color:var(--ink2); letter-spacing:.5px}
.redline b{color:var(--red)}
.timeline{font-size:13px; font-family:var(--display)}
.timeline > div{padding:3px 0; border-bottom:1px dotted var(--line2); display:flex; gap:10px; justify-content:flex-start}
.timeline .ty{color:var(--red); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:78px}
.foot{text-align:center; color:var(--ink3); font-size:11.5px; margin-top:34px; font-family:var(--display); letter-spacing:1px}
.hide{display:none!important}

/* 本作刻意只有一套「公文纸」配色。深色模式下重新声明同一组变量，
   防止移动端浏览器的自动深色化把颜色改掉。 */
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: light;
    --paper:#e9e3d6; --card:#fbf8f1; --card2:#f3eee2;
    --ink:#26221c; --ink2:#5c5548; --ink3:#8d8474;
    --red:#9c2b23; --red2:#c0392b; --line:#c9bfa8; --line2:#ddd4bf;
    --good:#3d6b45; --bad:#9c2b23;
    --c-merit:#35617f; --c-net:#9a7420; --c-hp:#3d6b45; --c-fam:#8c4f6b; --c-risk:#9c2b23;
  }
  body{ background-color:var(--paper); color:var(--ink); }
  .opt, .actrl button{ color:var(--ink); }
  .btn.ghost{ color:var(--ink2); -webkit-text-fill-color:var(--ink2); }
  .btn{ color:#fff; -webkit-text-fill-color:#fff; }
}
@media (max-width:520px){
  .arow{grid-template-columns:94px auto 1fr auto; gap:6px}
  .arow .lb small{font-size:10px; letter-spacing:-.2px}
  .pips{gap:4px}
  .pip{width:21px;height:21px}
  .statusbar .meta{margin-left:0; width:100%; justify-content:flex-start}
}
</style>
</head>
<body>
<div class="wrap">

<header class="doc">
  <h1>铁饭碗模拟器</h1>
  <div class="sub">青 阳 县 · 二 〇 二 六 年 度 新 录 用 人 员 档 案</div>
  <hr class="rule"><hr class="rule thin">
</header>

<div id="app"></div>

<div class="foot">本作纯属虚构 · 云江省 / 临川市 / 青阳县 及文中人物、机构均为架空</div>
</div>

<script>
"use strict";
/* ==================================================================
   铁饭碗模拟器 — 单文件版
   ================================================================== */

/* ---------- 工具 ---------- */

/* ---------- 学习效率：越老学得越慢。年龄本身就是天花板，不另设上限 ---------- */
function studyEffText(){
  const a = S.age;
  return a < 30 ? "现在学得最快"
       : a < 38 ? "还学得进去"
       : a < 46 ? "开始有点吃力"
       : a < 54 ? "学得慢了"
       : a < 62 ? "很难再学进去"
       : "基本学不动了";
}
function studyEff(){
  const a = S.age;
  return a < 30 ? 1.40
       : a < 38 ? 1.00
       : a < 46 ? 0.62
       : a < 54 ? 0.35
       : a < 62 ? 0.18
       : 0.08;
}

/* ---------- 孩子年龄：按出生那年算起 ---------- */
function kidAge(st){
  if(!st.flags.child) return -1;
  return st.year - (st.flags.childYear || (st.year - 8));
}

function activeTraits(){
  if(!S) return [];
  const on = TRAITS.filter(t=>{
    if(t.has) return !!t.has(S);                       // 自定义成立条件
    if(t.id==="sp_teacher")  return S.flags.spouse==="teacher";
    if(t.id==="sp_business") return S.flags.spouse==="business" || S.flags.spouseBiz;
    if(t.id==="sp_civil")    return S.flags.spouse==="civil";
    if(t.id==="sideWin")     return S.flags.sideOld || S.flags.sideNew;
    return !!S.flags[t.id];
  });
  const ids = on.map(t=>t.id);
  // 进化：低阶词条被高阶顶掉；互斥：先到的留下
  const dropped = new Set();
  on.forEach(t=>{
    if(t.evolvesTo && ids.includes(t.evolvesTo)) dropped.add(t.id);
    if(t.exclude) t.exclude.forEach(x=>{ if(ids.includes(x) && ids.indexOf(x) > ids.indexOf(t.id)) dropped.add(x); });
  });
  return on.filter(t=>!dropped.has(t.id));
}
// 乘区：连乘；加区：累加
function tMul(key){ return activeTraits().reduce((a,t)=>a*(t.eff[key]||1), 1); }
function tSum(key){ return activeTraits().reduce((a,t)=>a+(t.eff[key]||0), 0); }

      msg:"周一你迟到了十分钟，稿子没动。主任没批评你，只是从那以后，重要的稿子不再给你。" },
  ]},

{ id:"dinner", w:11, cond:s=>s.rank<=4, tag:"应酬",
  title:"饭局",
  text:s=>{ const t=nth("dinner");
    if(t<=1) return `下班前，李主任在群里@你：「晚上有个饭，你也来。」\n\n家里今天做了红烧肉，说等你回来吃。`;
    if(t===2) return `又是群里那一句「晚上有个饭，你也来」。\n\n你没去看家里今天做了什么。你已经很久没赶上过饭点了。\n\n回「好」的时候，手指是自动的。`;
    return `饭还是那些饭，位置换了。\n\n现在在群里发那句话的人，有时候是你。\n\n你偶尔会想，当年被@的那个人，是不是也在心里算着回家的时间。`; },
  opts:[
    { t:"去，而且坐在离领导最近的位置", cost:3, eff:{network:9,health:-5,family:-6,money:-.4},
      msg:"你喝到晚上十一点半，回家的路上吐了一次。但你现在知道了明年的干部调整方向，这个消息比红烧肉贵。" },
    { t:"去，但少喝，早退", cost:2, eff:{network:4,health:-2,family:-2},
      msg:"你走的时候李主任抬眼看了看，没说什么。这种事情不说才是说。" },
    { t:"推了，说家里有事", eff:{family:7,health:2,network:-4},
      msg:"红烧肉很好吃。\n\n第二天你听说昨晚定了个人事上的事。你没在场。" },
  ]},

{ id:"credit", w:9, cond:s=>s.rank<=3, once:true, tag:"办公室",
  title:"署名",
  text:`你熬了三个通宵的调研报告被市里点名表扬了。\n\n表扬的文件上，第一作者是分管副主任。你的名字在第四位，后面还跟着一个你从来没见过的人。`,
  opts:[
    { t:"找他理论", cost:1, eff:{merit:3,network:-9,risk:0},
      msg:"他愣了一下，然后笑着拍你肩膀：「年轻人有想法是好事。」\n\n后来三年，你再没接到过重要课题。" },
    { t:"当没这回事，继续干", eff:{merit:5,network:4},
      msg:"你什么都没说。副主任心里有数，半年后有个培训名额，他报了你。\n\n这个系统就是这么运转的。" },
    { t:"私下把原稿发给了另一个领导", cost:1, eff:{network:6,risk:8},
      msg:"那位领导记住了你的名字。副主任也很快知道了这件事。\n\n你同时拥有了一个靠山和一个敌人。这笔账现在算不清。" },
  ]},

{ id:"laoke", w:7, cond:s=>s.rank<=1 && s.age<32, once:true, tag:"办公室",
  title:"老周的茶",
  text:`老周在这个办公室坐了二十三年，还是科员。他泡茶的时候跟你说：\n\n「小伙子，我跟你讲，这里最要紧的不是干活。」\n\n他没说下半句，吹了吹茶叶。`,
  opts:[
    { t:"请他吃饭，把下半句问出来", cost:2, eff:{network:8,money:-.3},
      fn:s=>{s.flags.zhouSeed="ask"; s.flags.zhouYear=s.year;},
      msg:"下半句是：最要紧的是让对的人知道你在干活。\n\n这句话你用了一辈子。老周自己没用上，他也知道自己没用上。" },
    { t:"心想我才不要变成他", eff:{merit:5,health:-2},
      fn:s=>{s.flags.zhouSeed="scorn"; s.flags.zhouYear=s.year;},
      msg:"你埋头干了一年活。\n\n年底考核，优秀给了一个天天陪领导打球的同事。你看着老周的背影，第一次觉得后背发凉。" },
  ]},

{ id:"relative", w:8, cond:s=>s.rank>=1, tag:"人情",
  title:"二舅",
  text:s=>{ const t=nth("relative");
    if(t<=1) return `二舅打来电话，绕了十分钟才说到正题：他儿子想进你们系统下面一个事业单位，问你「能不能说句话」。\n\n他最后加了一句：「你妈当年供你上学，不容易。」`;
    if(t===2) return `二舅又打来了。这次是外甥女，想进街道。\n\n铺垫比上次短了很多——上次那套说辞他已经用过了，两个人都记得。`;
    return `二舅这回一句闲话没有，开口就是正事。\n\n说完他停了一下，补了一句：「上次那事你没帮上，家里都知道。」\n\n你妈从来没有跟你提过这件事。一次都没有。`; },
  opts:[
    { t:"帮，找人递个话", cost:2, eff:{network:-4,family:8,risk:12},
      msg:"事办成了。二舅在老家逢人就说你出息了。\n\n你回家过年时被敬了很多酒。你笑着都喝了，心里有一小块地方是凉的。" },
    { t:"如实说明白：走正规程序，我能给他讲讲怎么考", eff:{family:-4,merit:2,risk:-2},
      msg:"二舅在电话那头沉默了很久，说了句「行，你忙」就挂了。\n\n那年过年，你妈单独跟你聊了半个小时。" },
    { t:"直接说办不了", eff:{family:-9},
      msg:"亲戚之间的事，一句话能记二十年。这句话被记了二十年。" },
  ]},

{ id:"classmate", w:7, cond:s=>s.age>=26 && s.age<=42, tag:"生活",
  title:"同学聚会",
  text:`当年宿舍成绩最差的老赵开了辆你叫不出名字的车来。他做建材生意，去年赚的钱是你二十年工资。\n\n他给你敬酒：「哥们儿现在也算体制内了，不容易。」\n\n这话到底是敬还是刺，你没分辨出来。`,
  opts:[
    { t:"多喝了几杯，回家路上想了很多", eff:{health:-3,money:-.2},
      msg:"你在楼下坐了半小时才上去。家里问你怎么了，你说没事，单位有点事。" },
    { t:"跟他聊了聊他的生意", cost:1, eff:{network:4,risk:5},
      msg:"他递了张名片，说以后有事招呼。\n\n这张名片你留了很多年。留着，就是一种可能性。" },
    { t:"心态很稳，聊了聊孩子", eff:{family:5,health:2},
      msg:"散场时老赵拍着你说：还是你们旱涝保收好啊。\n\n他大概是真心的，也大概不是。" },
  ]},

{ id:"blinddate", w:14, cd:2,
  pri:s=>s.age>=34 ? 5.5 : s.age>=30 ? 3.4 : s.age>=27 ? 2.2 : 1.3,   // 越拖家里越急
  cond:s=>s.age>=24 && s.age<=46 && !s.flags.married && !s.flags.divorced, tag:"家庭",
  title:"相亲",
  text:s=>{
    const n = s.flags.blindCount || 0;
    if(s.age <= 28 && n === 0)
      return `你妈托人安排的。见面二十分钟，对方就直奔主题：\n\n「你们那个单位，一般几年能到副科？」`;
    if(s.age <= 32)
      return `又一个。这半年是第${n+1}个。\n\n你妈现在打电话不问你吃饭了，开口就是「周末有空吗」。\n\n对面坐着的人也一样疲惫，你们像两个都在加班的人被硬凑到了一起。`;
    if(s.age <= 37)
      return `这次是你姨介绍的，说人很好，就是「离过一次」。\n\n你妈在电话里说这句话时特意压低了声音，好像怕你生气。\n\n她已经不敢像前几年那样理直气壮地催你了。这比催更让你难受。`;
    return `介绍人这次没绕弯子：对方比你大两岁，带一个孩子。\n\n他说，到你们这个岁数，条件得放一放了。\n\n你妈这两年不提这事了。上次回家，她只是给你收拾了一下衣柜，把你放了十年没穿的西装挂好。`;
  },
  opts:[
    { t:"这个踏实，处下去", eff:{family:16,health:3},
      fn:s=>{s.flags.married=true; s.flags.spouse="teacher"; s.flags.marryYear=s.year},
      msg:s=>s.age<=32
        ? "她是本地一所中学的老师。后来她成了你妻子。\n\n她不太懂你单位的事，但她会在你半夜回家时把灯留着。\n\n这一点你直到很多年后才明白它的分量。"
        : "结婚那天办得很简单，两家人加起来四桌。\n\n她话不多，做事很稳。你有时候会想，要是早十年遇到会怎么样。\n\n然后你会想，早十年的你，多半看不上现在这样的日子。" },
    { t:"家里做工程，条件最好", eff:{family:11,money:11,risk:14},
      fn:s=>{s.flags.married=true; s.flags.spouse="business"; s.flags.marryYear=s.year},
      msg:"婚后你的生活质量肉眼可见地提高了。\n\n以及，从此每年填报告的时候，「配偶从业情况」那一栏你都要多看两遍。" },
    { t:"隔壁局的，双职工", eff:{family:9,network:9},
      fn:s=>{s.flags.married=true; s.flags.spouse="civil"; s.flags.marryYear=s.year},
      msg:"她在隔壁局，比你早一年上岸。\n\n你们聊的全是单位的事。她能听懂你所有的抱怨，这在别的婚姻里是很奢侈的。\n\n代价是家里没有一个人是闲着的。孩子放学谁去接，这个问题你们讨论了很多年，一直没讨论出结果。" },
    { t:"再等等，先把工作搞上去", eff:{merit:6},
      fn:s=>{ s.flags.blindCount = (s.flags.blindCount||0) + 1;
        s.family = cl(s.family + (s.age<=28 ? -6 : s.age<=32 ? -9 : s.age<=37 ? -12 : -4));
        s.pendMsg = s.age<=28
          ? "你妈叹了口气，说那你自己看着办。\n\n你当时觉得等升上去再说也不迟。你二十六岁，觉得时间很多。"
          : s.age<=32
          ? "你妈在电话里哭了一次。这是第一次。\n\n你说妈我这两年正是关键时候。她说好好好，我不管了。\n\n她说「我不管了」的时候，你知道她还会管。"
          : s.age<=37
          ? "你妈这次没生气，只说了句「行，那就再看看」。\n\n挂了电话你坐了很久。你忽然意识到，让她生气的那些年已经过去了。"
          : "介绍人客气地说了句「那再联系」，然后你们都知道不会再联系了。\n\n那天晚上你回单位加了会儿班。办公室没别人，很安静。\n\n你想起二十二岁刚来的时候，也是这么安静。"; } },
  ]},

{ id:"newborn", w:12, pri:8, cond:s=>s.flags.married && !s.flags.child && s.age<=45, once:true, tag:"家庭",
  title:"孩子",
  text:`孩子出生那天，你在产房外面的走廊里站着。\n\n手机响了三次，是单位的。你按掉了两次，第三次接了。`,
  opts:[
    { t:"跟单位说今天实在来不了", eff:{family:14,merit:-5},
      fn:s=>{s.flags.child=true; s.flags.childBoy=chance(.5); s.flags.childYear=s.year;},
      msg:"你在医院待了整整两天。\n\n很多年后你{子女}问你，我出生那天你在干嘛。你说，我在门口站着。\n\n这是你少数几件不用心虚就能回答的事。" },
    { t:"安顿好就赶回去了", eff:{merit:7,family:-9},
      fn:s=>{s.flags.child=true; s.flags.childBoy=chance(.5); s.flags.childYear=s.year;},
      msg:"你当天下午就回了单位。那个会确实重要。\n\n你{配偶}没说什么。{TA}后来也一直没说什么。" },
  ]},

/* ---------- 机会事件 ---------- */
{ id:"lianxuan", w:9, cond:s=>s.rank>=1 && s.rank<=3 && s.age<=40, tag:"机会",
  title:"遴选公告",
  text:`市直机关公开遴选，你符合条件。\n\n考上了，平台大一截；考不上，单位里所有人都知道你想走。`,
  opts:[
    { t:"报名，全力准备", cost:5, eff:{health:-5,family:-5},
      fn:s=>{ if(chance(.42 + s.ability/260)){ s.rank=Math.min(9,s.rank+1); s.yearsInRank=0; s.merit*=.6; s.log.push([s.year,"遴选成功，进入市直机关"]); s.pendMsg="笔试面试都过了。你走的那天，老周替你收拾了桌子，说了句「好好干」。\n\n【你的职级和平台都上了一级】"; } else { s.network=cl(s.network-8); s.pendMsg="面试差了两名。\n\n回单位上班的第一天，所有人都对你特别客气。那种客气比嘲笑难受。"; } } },
    { t:"不报，这里熬着也快到{下一级}了", eff:{merit:4,network:3},
      msg:"你留下了。那年遴选走了两个人，他们的位置很快被填上，像什么都没发生过。" },
  ]},

{ id:"jiediao", w:8, cond:s=>s.rank>=1 && s.rank<=4 && s.age<=45, tag:"机会",
  title:"借调",
  text:`省厅要人，借调一年，可能留下，也可能一年后原样退回。\n\n办公室主任说得很直白：「去了是机会，回来是笑话，你自己掂量。」`,
  opts:[
    { t:"去", cost:4, eff:{merit:11,network:9,health:-7,family:-9},
      fn:s=>{ if(chance(.3)){ s.network=cl(s.network+14); s.flags.provPatron=true; s.pendMsg="一年后你被留下了。省厅的视野和县里完全不是一回事。\n\n【你在省里有了人】"; } else { s.pendMsg="一年后你被退回来了。你带回来的除了一身疲惫，还有一本通讯录。\n\n通讯录后来救过你一次。"; } } },
    { t:"不去，守住手里的位置", eff:{merit:4,family:4},
      msg:"后来去的是隔壁科室的小刘。三年后他成了你的上级。\n\n当然，这是三年后的事，当时谁也不知道。" },
  ]},

{ id:"zhucun", w:8, cond:s=>s.rank>=1 && s.rank<=3 && s.age<=44, once:true, tag:"机会",
  title:"驻村",
  text:`组织部要派驻村第一书记，两年。\n\n条件很苦，但「基层经历」这四个字，是往上走绕不过去的一道坎。`,
  opts:[
    { t:"报名去", cost:5, eff:{merit:17,health:-10,family:-13,network:5},
      fn:s=>{ s.flags.grassroots=true; },
      msg:"两年。你住在村小学的空教室里，冬天没暖气。\n\n你修了一条路，解决了三十七户的自来水。你走的时候有个老太太塞给你两袋红薯，你在车上哭了。\n\n【已取得基层任职经历】" },
    { t:"不去，家里离不开", eff:{family:8},
      msg:"你留下了。\n\n很多年后，当你卡在副处上不去的时候，组织部的朋友私下跟你说了一句：你要是当年下去过就好了。" },
  ]},

{ id:"mishu", w:7, cond:s=>s.rank>=1 && s.rank<=3 && s.network>=25 && s.age<=42, once:true, tag:"机会",
  title:"秘书",
  text:`一位领导要挑个秘书。\n\n跟对了人，几年抵别人十几年；跟错了人，这几年就是白干，甚至倒扣。`,
  opts:[
    { t:"去", cost:4, eff:{network:16,health:-9,family:-11},
      fn:s=>{ s.flags.mishu=true; s.patron.favor=cl(s.patron.favor+30); },
      msg:"你成了他的影子。他几点起、喝什么茶、看谁不顺眼、怕什么，你全知道。\n\n你也从此没有了自己的作息。\n\n【与领导的关系大幅提升】" },
    { t:"婉拒", eff:{health:4,family:6,network:-6},
      msg:"他没再问第二次。他这种人不问第二次。" },
  ]},

/* ---------- 风险线 ---------- */
{ id:"hongbao", w:9, pri:s=>1 + s.rank*0.30 + (s.risk>=25?0.9:0) + (s.circle.in&&!s.circle.fell?0.5:0), cond:s=>s.rank>=2, tag:"风险",
  title:"一个信封",
  text:s=>{ const t=nth("hongbao");
    if(t<=1) return `一个办事的人在你办公室坐了很久，走的时候，桌上的文件底下多了个信封。\n\n厚度大概是你三个月工资。`;
    if(t===2) return `又一个信封，这次压在茶杯底下。\n\n整套动作你都认得，因为上一个你处理过。\n\n唯一不一样的是厚度。`;
    return `这次没有信封了，是一张卡，夹在一本书里。\n\n送书的人走到门口回头说了一句：「您看着办。」\n\n这四个字这些年你听得越来越顺耳，这件事本身就够你想一会儿的。`; },
  opts:[
    { t:"收下", eff:{bribe:2.7,risk:26},
      msg:"你把它锁进了抽屉。那天下午你什么都没干成，一直在听走廊里的脚步声。\n\n后来你就习惯了。习惯是最危险的东西。" },
    { t:"追出去还给他", eff:{risk:-6,network:-3,merit:3},
      msg:"你在楼梯口追上他。他很尴尬，你也很尴尬。\n\n那件事最后按规矩办了。他后来逢人就说你这个人「没意思」。" },
    { t:"上交", eff:{risk:-12,merit:5,network:-8},
      msg:"纪检的同志表扬了你。办公室里的人对你的态度发生了一点微妙的变化，大家说话的时候会多看你一眼。\n\n干净是有成本的。" },
  ]},

{ id:"card", w:8, pri:s=>1 + s.rank*0.30 + (s.risk>=25?0.9:0) + (s.circle.in&&!s.circle.fell?0.5:0), cond:s=>s.rank>=3, tag:"风险",
  title:"购物卡",
  text:`装修公司的老板过年来拜访，放下两盒茶叶。\n\n茶叶盒很沉。你打开看了，里面是卡。`,
  opts:[
    { t:"留下", eff:{bribe:1.05,risk:19},
      msg:"你把卡放进了书柜最上层。\n\n这一年你在家里换了个新书柜，新书柜也有最上层。" },
    { t:"让办公室退回去", eff:{risk:-7,network:-4},
      msg:"他后来在饭桌上说：这位领导原则性很强。\n\n这句话在他们那个圈子里的意思是：这个人办不了事。" },
  ]},

{ id:"spouse_biz", w:7, cond:s=>s.rank>=3 && s.flags.married, once:true, tag:"风险",
  title:"配偶经商",
  text:`{配偶}想和朋友合伙开个公司，业务跟你分管的领域「有一点点」关系。\n\n她说得很小心：「就挂个名，我不出面。」`,
  opts:[
    { t:"同意", eff:{money:22,risk:32,family:9}, fn:s=>{s.flags.spouseBiz=true; if(!s.flags.marryYear)s.flags.marryYear=s.year;},
      msg:"钱来得比你想象的快很多。\n\n快到你有时候会想，这真的是{TA}自己挣的吗。这个念头你没敢深想。" },
    { t:"不行，让她换个方向", eff:{family:-11,risk:-5},
      msg:"{TA}那天晚上说了一句：我跟了你，是不是把这辈子也搭进去了。\n\n你没答上来。" },
  ]},

{ id:"anon", w:6, cond:s=>s.risk>=30, tag:"风险",
  title:"匿名信",
  text:`纪委收到一封反映你的匿名信。内容不算具体，但也不算完全没影。\n\n办公室主任把你叫去，语气很随意地提了一句。`,
  opts:[
    { t:"主动去说明情况", eff:{risk:-16,network:-5,health:-4},
      msg:"你谈了三个小时。出来的时候后背全湿了。\n\n事情压下去了。但从那天起，你的名字在某个本子上被记了一笔。" },
    { t:"找关系摆平", cost:2, eff:{risk:-6,network:-11,money:-4},
      msg:"事情摆平了，但欠了一个很大的人情。\n\n人情这个东西，总有还的一天，而且不是你说了算。" },
    { t:"不理，清者自清", eff:{risk:6,health:-5},
      msg:"什么都没发生。\n\n接下来的四个月，你每次听到走廊里的皮鞋声都会停下手里的活。" },
  ]},

{ id:"oldaccount", w:7, cond:s=>s.rank>=5 && s.risk>=25, tag:"风险",
  title:"旧账",
  text:`你现在的位置很高。高到当年那些不起眼的事，分量完全变了。\n\n一个多年不联系的人给你打电话，说想见一面。`,
  opts:[
    { t:"见，把该了结的了结", cost:2, eff:{risk:-20,money:-14,health:-4},
      msg:"你花了很大代价把一件八年前的小事彻底抹平。\n\n你在回来的车上想：当年那笔钱，还不够今天这顿饭的零头。" },
    { t:"不见，让秘书回绝", eff:{risk:11},
      msg:"他没再联系。\n\n三个月后，你听说他去了别的地方，说了一些话。" },
  ]},

/* ---------- 中层 ---------- */
{ id:"project", w:11, cond:s=>s.rank>=2 && s.rank<=6, tag:"工作",
  title:"烫手的项目",
  text:s=>{ const t=nth("project");
    if(t<=1) return `一个拖了三年的老大难项目，涉及拆迁、历史遗留、和两任前领导。\n\n一把手在会上环视一圈：「谁来牵这个头？」\n\n没有人说话。`;
    if(t===2) return `又一个。拆迁、历史遗留、两任前领导——连措辞都跟上次那个一样。\n\n一把手环视一圈的时候，有两个人下意识看了你一眼。\n\n没有人说话，但这次的沉默是有方向的。`;
    return `这次会上没有人环视一圈。\n\n所有人从一开始就看着你。\n\n因为上一个这样的项目，是你牵的头。`; },
  opts:[
    { t:"我来", cost:5, eff:{health:-9,family:-7},
      fn:s=>{ if(chance(.55 + s.ability/300 + s.network/400)){ s.merit=cl(s.merit+24); s.flags.bigwin=true; s.pendMsg="你干成了。\n\n签字那天一把手在会上说了你的名字，说了三次。\n\n【重大政绩 · 这是能记进档案的东西】"; } else { s.merit=cl(s.merit-8); s.risk+=10; s.pendMsg="中途出了群体性事件，项目停了。\n\n没有人追究你的责任——因为所有人都知道这事本来就干不成。但也没有人再提起你。"; } } },
    { t:"低头看手机", eff:{merit:-4,health:3},
      msg:"最后是隔壁的老陈接了。\n\n三年后他因为这个项目提了副处。也可能是因为别的，谁说得清呢。" },
  ]},

{ id:"subordinate", w:9, cond:s=>s.rank>=3, tag:"管理",
  title:"下属捅了娄子",
  text:`你手下一个年轻人在一份对外文件里写错了一个数字。这个数字上了新闻。\n\n他二十六岁，昨天还在办公室里给你带早饭。`,
  opts:[
    { t:"扛下来，说是我审核不严", eff:{merit:-9,network:8,risk:3},
      msg:"你被通报批评了一次。\n\n那个年轻人后来跟了你很多年。很多年后他在另一个岗位上，替你说过一次话。" },
    { t:"按规矩处理，该谁的责任谁负", eff:{merit:3,network:-4},
      msg:"处理得没有毛病。他被调离了岗位。\n\n办公室里再没人给你带早饭。" },
    { t:"往上推，说是分管领导定的", eff:{risk:9,network:-13},
      msg:"你脱身了。\n\n但这个单位里所有的人都看见了。以后没有人愿意替你扛事，因为大家知道你不会替他们扛。" },
  ]},

{ id:"side", w:8, cond:s=>s.rank>=3 && s.rank<=7, once:true, tag:"抉择",
  title:"站队",
  text:`班子里两位领导公开对上了。\n\n一位是提拔你的老领导，年纪偏大，眼看到站；一位是空降的新副手，年轻，背景不明，但势头很猛。\n\n两个人这一周都单独找你谈过话。`,
  opts:[
    { t:"跟老领导，做人要讲良心", cost:2, eff:{network:9,risk:5},
      fn:s=>{ s.flags.sideOld=true; s.patron.favor=cl(s.patron.favor+22); },
      msg:"你选了报恩。\n\n老领导拍了拍你的手背，什么也没说。他这个年纪的人，已经不需要说什么了。" },
    { t:"跟新来的，眼睛要往前看", cost:2, eff:{network:15,risk:9,merit:4},
      fn:s=>{ s.flags.sideNew=true; s.patron={name:"高副市长",favor:52,alive:true}; },
      msg:"你换了船。\n\n老领导后来在走廊里遇见你，笑着点了点头。那个笑让你有一瞬间不敢看他的眼睛。" },
    { t:"两边都不得罪", cost:1, eff:{network:-9},
      msg:"你以为你很聪明。\n\n半年后尘埃落定，赢的那位在名单上看到你的名字时，想了两秒钟，然后划掉了。" },
  ]},

{ id:"inspect", w:9, cond:s=>s.rank>=2 && s.rank<=6, tag:"工作",
  title:"迎检",
  text:s=>{ const t=nth("inspect");
    if(t<=1) return `上级检查组下周到。台账缺了大半年的，现在补根本来不及。\n\n办公室的人在等你一句话。`;
    if(t===2) return `又要迎检。台账还是缺，还是补不完。\n\n这次办公室的人没有等你开口，他们已经在补了。\n\n他们知道你会说什么。`;
    return `迎检通知下来的时候，你发现自己想的第一件事不是台账。\n\n是这回带队的组长是谁。`; },
  opts:[
    { t:"连夜补，该怎么写怎么写", cost:4, eff:{merit:8,risk:14,health:-6},
      msg:"三个通宵，五个人，补出了一米高的台账。检查组很满意。\n\n所有人都知道那是假的，包括检查组。这是一场大家配合完成的演出。" },
    { t:"如实汇报，该扣分扣分", eff:{merit:-8,risk:-8,network:-6},
      msg:"县里排名掉了四位。一把手在会上没点你的名，但看了你三次。\n\n你晚上睡得很好。这在这个行业里算是一种奢侈。" },
  ]},

{ id:"xinfang", w:9, cond:s=>s.rank>=2 && s.rank<=6, tag:"工作",
  title:"信访",
  text:s=>{ const t=nth("xinfang");
    if(t<=1) return `一位六十多岁的上访户在大院门口坐了三天。他的诉求二十年前就该解决，但当年的文件、当年的人、当年的政策，全都找不到了。\n\n他认得你，因为你是唯一一个跟他说过话的干部。`;
    if(t===2) return `又一位。年纪、诉求、找不到的文件，跟上次那位几乎一模一样。\n\n不同的是这一次他不认识你。他要找的不是说过话的人，是「能定的人」。\n\n而现在你差不多算是了。`;
    return `这次坐在门口的人你认得。\n\n是二十年前那位的儿子。\n\n事情还是那件事。`; },
  opts:[
    { t:"想办法在现有政策里给他找一条路", cost:4, eff:{merit:9,health:-5,network:-3},
      msg:"你翻了三个月的旧档案，最后从一个撤销了的部门的文件里找到了依据。\n\n他拿到钱那天给你磕头，你把他扶起来了。\n\n没有人给你记功。这种事记不了功。" },
    { t:"按程序稳控住，别让他上省里", cost:2, eff:{merit:5,risk:6},
      msg:"你完成了任务。他被送回了老家，由乡镇看着。\n\n第二年他又来了。第三年他没再来——他去世了。" },
    { t:"这不归我管", eff:{merit:-5,health:2},
      msg:"确实不归你管。\n\n他后来在门口坐了十七天。" },
  ]},

{ id:"tijian", w:9, cond:s=>s.age>=35, tag:"身体",
  title:"体检报告",
  text:s=>{ const t=nth("tijian");
    if(t<=1) return `单位组织体检。报告出来，有三项箭头朝上，医生建议进一步检查。\n\n下周有个重要的会。`;
    if(t===2) return `又一年。上次那三项还在，这次多了一项。\n\n医生说话比上次慢，中间停了一下才继续。`;
    return `这次医生没说「建议进一步检查」。\n\n他抬头问你：上次的报告带来了吗。`; },
  opts:[
    { t:"请假去做全面检查", cost:3, eff:{health:12,merit:-5},
      msg:"查出来是早期问题，及时干预住了。\n\n医生说：你再拖半年就麻烦了。\n\n那个会最后是别人去的。" },
    { t:"先把会开完再说", eff:{health:-11,merit:6},
      fn:s=>{ s.flags.sickBody=true; },
      msg:"会开得很成功。\n\n报告你塞进了抽屉。三个月后你翻抽屉找别的东西，又看见了它，又塞了回去。" },
  ]},

{ id:"parent", w:10, cond:s=>s.age>=33 && s.age<=58, tag:"家庭",
  title:"父亲",
  text:`老家来电话，父亲住院了。要动手术，需要有人签字。\n\n同一周，省里来人考察干部。`,
  opts:[
    { t:"回去，考察让别人接待", cost:4, eff:{family:17,health:-4,merit:-9,network:-6},
      msg:"你在病房陪了十一天。父亲醒过来第一句话是：「你单位不忙啊？」\n\n你说不忙。\n\n那次考察名单上没有你。但你父亲又活了十四年。" },
    { t:"打钱回去，让弟弟处理", eff:{family:-15,money:-6,merit:7},
      msg:"手术很成功。\n\n你弟弟后来在饭桌上说了一句「哥你忙」，语气很平。太平了。\n\n这句话你记了很久。" },
    { t:"考察完连夜赶回去", cost:3, eff:{family:5,health:-8,merit:3},
      msg:"你凌晨三点赶到医院，手术已经做完了。\n\n你在走廊长椅上睡了两小时，天亮又赶回去开会。\n\n这一年你瘦了十四斤。" },
  ]},

{ id:"child", w:9, pri:2.5, cond:s=>kidAge(s)>=7 && kidAge(s)<=12, tag:"家庭",
  title:"家长会",
  text:`{子女}的家长会，你连着缺席了四次。\n\n这次{TA子}特意在早饭时说了一句：「爸，今天下午三点。」\n\n下午三点你有个协调会。`,
  opts:[
    { t:"去家长会，协调会让副职去", eff:{family:14,merit:-4},
      msg:"你坐在小板凳上，腿都伸不开。老师念到名字的时候，你看见{TA子}回头看了你一眼。\n\n就那一眼。你觉得值。" },
    { t:"去协调会", eff:{merit:6,family:-13},
      msg:"晚上回家，{TA子}已经睡了。桌上留了张纸条：「没关系，我知道你忙。」\n\n这句话比骂你难受一百倍。" },
  ]},

{ id:"house", w:8, cond:s=>s.age>=28 && s.age<=45 && !s.flags.house, once:true, tag:"生活",
  title:"买房",
  text:`该买房了。首付还差一截。\n\n有个开发商的朋友说，可以给你「内部价」。`,
  opts:[
    { t:"按市场价买，借亲戚的钱凑首付", eff:{money:-23,family:6,risk:-3},
      fn:s=>{s.flags.house=true},
      msg:"你背上了三十年的贷款。\n\n每个月还款日那天，你会比平时更能理解为什么有些人会走上另一条路。" },
    { t:"用内部价", eff:{money:-10,risk:22},
      fn:s=>{s.flags.house=true; s.flags.cheapHouse=true},
      msg:"省了将近二十万。\n\n合同放在保险柜最底下。这套房子你住了很多年，每次装修都想起那份合同。" },
    { t:"先不买，继续租", eff:{money:4,family:-9},
      msg:"家里那年没说什么。\n\n三年后房价涨了六成，还是没说什么。不说的话往往最重。" },
  ]},

{ id:"night", w:6, cond:s=>s.age>=38, tag:"独处",
  title:"深夜",
  text:`凌晨两点，你在阳台上抽了半支烟。\n\n楼下路灯还亮着。你忽然想起二十二岁那年，坐在办公室最里面那张桌子前，心里想的是「我一定要出人头地」。\n\n你现在想不起来当时到底为什么那么想。`,
  opts:[
    { t:"回去睡了。明天还有会", eff:{health:-2},
      msg:"第二天你照常上班。这种夜晚每年会有那么几次，你已经学会了不在白天想起它。" },
    { t:"给家里发了条消息", eff:{family:7,health:2},
      msg:"五分钟后回过来：「快睡吧。」\n\n后面还跟了一句：「我在呢。」\n\n你把烟掐了。" },
    { t:"打开电脑，把明天的材料又改了一遍", cost:1, eff:{merit:5,health:-4},
      msg:"改到四点。\n\n第二天的会上你讲得很好。没有人知道那份稿子是几点定的。" },
  ]},

{ id:"jiuzhuo", w:7, cond:s=>s.rank>=2 && s.rank<=6 && s.age<=56, tag:"应酬",
  title:"酒桌",
  text:`招商引资的饭局，对方老总端着杯子过来：「这杯干了，项目就定了。」\n\n你上个月刚查出脂肪肝。`,
  opts:[
    { t:"干了", eff:{merit:11,health:-9,money:0},
      fn:s=>{ s.flags.drinker=true; },
      msg:"项目签了。你在洗手间吐的时候，听见外面有人说「这个人实在」。\n\n实在是这行的通行证，也是这行的死亡证明。" },
    { t:"以茶代酒", eff:{merit:-5,health:2,network:-4},
      fn:s=>{ s.flags.teetotal=true; },
      msg:"气氛冷了三秒。项目还是签了，但对方后来把追加投资给了邻县。\n\n三秒钟，几个亿。" },
    { t:"让年轻的下属替你挡", eff:{merit:8,health:-1,network:-4},
      fn:s=>{s.flags.liuDrank=true; s.flags.liuYear=s.year;},
      msg:"小刘替你喝了八两，当晚进了医院。\n\n他第二天照常上班，笑着说没事。他也才二十七岁。" },
  ]},

{ id:"award", w:6, cond:s=>s.merit>=45 && !s.flags.award, tag:"荣誉",
  title:"表彰",
  text:`你被评为全市优秀公务员，要上台发言。\n\n讲话稿是办公室写的，里面有一句「始终把群众的事放在心上」。`,
  opts:[
    { t:"照稿念完", eff:{merit:6,network:4},
      fn:s=>{ s.flags.award=true; },
      msg:"掌声热烈。你下台的时候忽然想不起来上一次真正为一个具体的人办成事是什么时候。" },
    { t:"脱稿讲了个真事", eff:{merit:9,network:-3,health:1},
      fn:s=>{ s.flags.award=true; },
      msg:"你讲了那个上访了二十年的老头。台下安静了几秒才鼓掌。\n\n会后有个老同志握着你的手说：好久没听到有人讲人话了。" },
  ]},

/* ---------- 领导线 ---------- */
{ id:"patron_up", w:7, cond:s=>s.patron.alive && s.patron.favor>=40 && s.rank>=2, once:true, tag:"人事",
  title:"老领导高升",
  text:`你的老领导调去省里了，位置比原来高两级。\n\n临走前他单独把你叫去，说了半小时的话。最后一句是：「你的事，我记着。」`,
  opts:[
    { t:"送到车站", eff:{network:17},
      msg:"你在站台上站了很久。\n\n这条线以后能用几次，你心里有数。用一次少一次，但有，总比没有强。" },
    { t:"该干嘛干嘛，不去凑热闹", eff:{network:5,merit:3},
      msg:"送行的人很多，你没去。\n\n他后来问起过一次：小张怎么没来？有人替你圆了。这个人情你也欠下了。" },
  ]},

{ id:"patron_down", w:6, cond:s=>s.patron.alive && s.rank>=3 && s.age>=40, once:true, tag:"人事",
  title:"出事了",
  text:`你的老领导被带走了。\n\n消息是早上八点二十传开的，到中午，他办公室的牌子已经摘了。\n\n下午，组织上找你谈话。`,
  opts:[
    { t:"实事求是，把知道的说清楚", cost:2, eff:{risk:-14,network:-18,health:-7},
      fn:s=>{ s.patron.alive=false; },
      msg:"你谈了两次，一共九个小时。\n\n你说的都是真的，也确实没有隐瞒。但从那以后，你在这个系统里少了一条腿。" },
    { t:"什么都说不知道", cost:2, eff:{risk:20,network:-6,health:-9},
      fn:s=>{ s.patron.alive=false; },
      msg:"你守住了。\n\n有些人因此高看你一眼，另一些人因此把你划进了同一个圈。这两种人后来都用得上，也都用得着你。" },
  ]},

/* ---------- 高层 ---------- */
{ id:"sign", w:11, cond:s=>s.rank>=5, tag:"决策",
  title:"签字",
  text:`一份文件放在你面前。\n\n技术部门说没问题，法制部门说有瑕疵，分管副职说「领导您定」。\n\n签了，这个项目今年就能开工，是实打实的政绩；不签，拖到明年，可能就没有明年了。`,
  opts:[
    { t:"签", eff:{merit:15,risk:17},
      msg:"项目当年开工。剪彩那天你站在中间。\n\n那份有瑕疵的意见书，在档案柜里躺了很多年。它一直在那儿。" },
    { t:"退回去，补齐手续再说", eff:{merit:-7,risk:-9,network:-6},
      msg:"手续补了八个月。项目错过了窗口期，投资方撤了。\n\n没有人说你错。也没有人说你对。" },
    { t:"上会集体研究", cost:2, eff:{merit:4,risk:-4,network:3},
      msg:"班子会一致同意。你签的是「同意会议决定」。\n\n这五个字后来救过你。它解决不了任何问题，但它能解决你。" },
  ]},

{ id:"protect", w:9, cond:s=>s.rank>=6, tag:"决策",
  title:"老部下",
  text:`当年跟着你的那个年轻人，现在是某局的一把手。他出事了。\n\n事情不算特别大，但要看怎么定性。他妻子在你办公室外面等了三个小时。`,
  opts:[
    { t:"打个招呼，尽量往轻里定", cost:2, eff:{network:11,risk:22},
      msg:"事情按最轻的口径处理了。他保住了级别，调去了一个闲职。\n\n他后来每年过年都给你发短信。你从来没回过。你不敢回。" },
    { t:"不插手，按规矩来", eff:{risk:-9,network:-13,family:-3},
      msg:"他被开除了公职。\n\n他妻子在楼下骂了很久。保安把她劝走了。\n\n那天晚上你想起十几年前，他给你带早饭的样子。" },
  ]},

{ id:"disaster", w:8, cond:s=>s.rank>=4, tag:"危机",
  title:"事故",
  text:`凌晨一点，电话响了。辖区内出了事，已经有伤亡。\n\n现在有两件事要做：处置，和上报。这两件事在时间上有先后，在政治上也有先后。`,
  opts:[
    { t:"立刻上报，同时赶赴现场", cost:5, eff:{merit:14,health:-11,risk:-6},
      fn:s=>{s.flags.crisis=true},
      msg:"你在现场待了七十二小时，没合眼。\n\n因为上报及时，省里的救援力量两小时就到了。事后追责，你被记了一笔，但不重。\n\n【已完成重大危机处置 · 这是档案里最硬的一笔】" },
    { t:"先把情况摸清楚再报", cost:4, eff:{merit:5,risk:26,health:-9},
      msg:"你晚报了六个小时。\n\n事故最后处理完了，数字很好看。那六个小时没有出现在任何一份材料里。\n\n但有人知道。总有人知道。" },
  ]},

{ id:"family_biz", w:7, cond:s=>s.rank>=6, tag:"风险",
  title:"侄子",
  text:`你侄子的公司拿到了一个跟你分管领域相关的标。\n\n他说是自己实力中标的。可能是真的。也可能不是。\n\n组织上按规定要填一张表。`,
  opts:[
    { t:"如实填报，并要求他退出", eff:{risk:-18,family:-13,money:-4},
      msg:"你哥在电话里骂了你二十分钟，最后一句是「你别忘了你是谁供出来的」。\n\n你挂了电话，在办公室坐到天黑。" },
    { t:"照常填，那栏空着", eff:{risk:30,bribe:1.1,family:6},
      msg:"表交上去了，没人问。\n\n从此每次听说哪个地方在查这类事，你都会多看两眼新闻。" },
  ]},

/* ---------- 浪潮专属 ---------- */
{ id:"w_ai", w:14, waveTag:"ai", cond:s=>s.rank<=5, tag:"变局",
  title:"用不用",
  text:`「智政云」上线了。一份过去要写两天的材料，现在四十秒。\n\n但办公室主任在会上说：机器写的东西没有温度，还是要人来把关。\n\n他说这话的时候，自己刚用它写完这份讲话稿。`,
  opts:[
    { t:"全面拥抱，把省下的时间用来跑关系", cost:3, eff:{network:13,merit:4},
      msg:"你成了单位里第一个把它用明白的人。\n\n效率提高了，但你也隐隐觉得，自己身上最值钱的那点东西正在贬值。" },
    { t:"研究它的底层逻辑，做本地化训练", cost:4, eff:{merit:12,health:-4},
      fn:s=>{s.ability=cl2(s.ability+11)},
      msg:"你成了全市系统内少数真懂这个的人。\n\n省里开会点名让你去讲。【能力显著提升】" },
    { t:"坚持手写。有些东西机器写不出来", cost:4, eff:{merit:5,health:-6},
      msg:"你的稿子确实是最好的。\n\n但没有人有耐心分辨最好和够用之间的区别。" },
  ]},

{ id:"w_reform", w:14, waveTag:"reform", tag:"变局",
  title:"分流",
  text:`机构改革，你们科室要撤并。名单还没定，但屋子里所有人都在算自己的分。\n\n有人已经开始跑了。`,
  opts:[
    { t:"跑关系，争取留在核心部门", cost:4, eff:{network:6,money:-2.5,risk:9},
      fn:s=>{ if(chance(.6+s.network/300)){ s.pendMsg="你留下了。\n\n留下的人不敢露出高兴，走的人也不敢露出难过。那几天办公室里安静得可怕。"; } else { s.merit=cl(s.merit-11); s.pendMsg="你还是被分流了。\n\n新单位在城郊，通勤单程一小时二十分钟。你在公交车上有很多时间可以想事情。"; } } },
    { t:"服从组织安排", eff:{merit:-6,network:4,health:2},
      msg:"你被分到了一个清水衙门。\n\n那两年你睡得很好，升不上去，但也没有人来找你。你后来常常怀念那两年。" },
  ]},

{ id:"w_clean", w:14, waveTag:"clean", cond:s=>s.risk>=18, tag:"变局",
  title:"窗口期",
  text:`专项行动的通知下来了。文件里有一句「主动说清楚问题的，依规从轻」。\n\n你把那句话读了很多遍。`,
  opts:[
    { t:"主动交代", eff:{risk:-40,merit:-13,network:-16,money:-9},
      msg:"你谈了很久，退了一些东西，受了处分，降了半级。\n\n从组织谈话室出来那天下着小雨。你没打伞，走了很远。\n\n那是十几年来你睡得最好的一晚。" },
    { t:"再等等，看风向", eff:{risk:9,health:-6},
      msg:"你等了。\n\n窗口期过去以后，窗口就关上了。" },
  ]},

{ id:"w_climate", w:14, waveTag:"climate", cond:s=>s.rank>=1, tag:"变局",
  title:"防汛",
  text:`第七轮强降雨。指挥部的灯已经亮了三十天。\n\n你手下有人在堤上晕倒了。你自己也已经四天没回家。`,
  opts:[
    { t:"继续上堤，你在，人心就在", cost:5, eff:{merit:19,health:-15,family:-8},
      msg:"洪峰过境那晚你在堤上。\n\n后来那张照片上了省报。你在照片里瘦得脱形，眼睛却很亮。\n\n家里人把那张报纸剪下来了，你后来才知道。" },
    { t:"轮换，让自己缓两天", cost:3, eff:{merit:8,health:-6,family:2},
      msg:"你休息了两天。这两天什么事也没出。\n\n但表彰名单出来的时候，你排在第七位。" },
  ]},

{ id:"w_newarea", w:14, waveTag:"newarea", cond:s=>s.rank>=2 && s.rank<=6, tag:"变局",
  title:"去不去新区",
  text:`云江新区抽调干部。三年，一片滩涂，什么都得从零开始。\n\n干成了是火箭，干不成是坟场。`,
  opts:[
    { t:"去", cost:5, eff:{health:-11,family:-14},
      fn:s=>{ if(chance(.5+s.ability/300)){ s.merit=cl(s.merit+27); s.network=cl(s.network+9); s.flags.bigwin=true; s.pendMsg="三年后，滩涂上有了路、有了灯、有了人。\n\n你在新区管委会的窗户前站着，看见楼下有小孩在跑。\n\n【重大政绩】"; } else { s.merit=cl(s.merit-9); s.pendMsg="三年后，规划调整了。你们建到一半的东西成了别人报告里的教训。\n\n你回原单位报到那天，人事科的小姑娘问：您是新来的吗？"; } } },
    { t:"不去", eff:{family:8,merit:-3},
      msg:"你留在了原地。原地也挺好，原地没有风险。\n\n原地也没有别的。" },
  ]},

{ id:"w_money", w:12, waveTag:"money", tag:"变局",
  title:"过紧日子",
  text:`绩效缓发第三个月了。\n\n办公室的年轻人开始在群里发兼职链接，被主任撤回了。`,
  opts:[
    { t:"带头表态，理解支持", eff:{network:6,money:-1.5,merit:3},
      msg:"你在会上说得很好。回家路上你在手机银行里看了一眼余额，又退了出来。" },
    { t:"私下替下属向上反映", cost:2, eff:{network:9,merit:-3},
      msg:"钱还是没发下来，但下属们知道你替他们说过话。\n\n有些账不是用钱记的。" },
  ]},

/* ---------- 加时赛 ---------- */
{ id:"ot_successor", w:12, cond:s=>s.overtime, tag:"晚局",
  title:"接班人",
  text:`你在这个位置上待得够久了。久到需要开始考虑另一件事：\n\n你走之后，谁来。`,
  opts:[
    { t:"扶一个自己人上去", cost:3, eff:{network:13,risk:11},
      msg:"你花了很大力气。他上去了。\n\n三年后他做了一个你绝不会做的决定。你才明白，你培养的是一个人，不是一个自己的复制品。" },
    { t:"按规矩来，选最合适的", eff:{merit:9,network:-6},
      msg:"接任的人跟你没什么私交。\n\n他做得比你好。你听说这件事的时候，心情有点复杂，但主要是欣慰。" },
    { t:"不想这个问题，我还能干", eff:{merit:4,health:-5},
      msg:"你把这件事又往后推了一年。\n\n这一年里，有三个本来可以接你班的人调走了。" },
  ]},

{ id:"ot_body", w:14, cond:s=>s.overtime, tag:"晚局",
  title:"身体",
  text:`医生把片子挂上去，看了很久，然后转过身来。\n\n他没有直接说结论，先问了一句：「您现在还上班吗？」`,
  opts:[
    { t:"按医嘱，减少工作量", cost:3, eff:{health:14,merit:-9},
      msg:"你把三个会推给了副手。\n\n身体确实好了一些。但你也第一次清楚地感觉到——这个系统离了你，转得一样好。" },
    { t:"药带上，会照开", eff:{health:-13,merit:8},
      msg:"你的抽屉里从此常年放着三种药。\n\n秘书知道哪一种是饭前吃的。" },
  ]},

{ id:"ot_legacy", w:10, cond:s=>s.overtime, tag:"晚局",
  title:"故人",
  text:`当年青阳县办公室的老周去世了。\n\n他到退休还是科员。讣告是他儿子在同学群里发的，只有两行字。`,
  opts:[
    { t:"推掉行程，去了", cost:2, eff:{family:9,merit:-4,health:-2},
      msg:"你去了。灵堂很小，来的人很少。\n\n他儿子认出你，愣了一下，说：我爸生前提过您，说您那时候是他们办公室最能熬夜的。\n\n你在门口站了很久。" },
    { t:"让秘书送了个花圈", eff:{merit:2},
      msg:"花圈上的落款是你的职务全称，很长。\n\n老周要是看见，大概会笑一下。" },
  ]},

/* ---------- 通用生活 ---------- */
{ id:"fenzi", w:8, cond:s=>s.age>=27, tag:"生活",
  title:"份子钱",
  text:s=>{ const t=nth("fenzi");
    if(t<=1) return `这个月第四张请柬。同事的、下属的、老家亲戚的。\n\n你算了算，这个月的份子钱超过了你半个月工资。`;
    if(t===2) return `又是四张。\n\n你现在有一本专门记这个的账，从哪年开始记的都忘了。\n\n翻到最前面那几笔，收礼的人有一半已经不在这个系统里了。`;
    return `请柬还是那么多，但你已经很少亲自去了。\n\n让办公室的人代到，钱照给，规格比从前高。\n\n你想了半天，想不起最近一次坐在婚宴上是什么时候。`; },
  opts:[
    { t:"都随，该多少多少", eff:{money:-2.2,network:5,family:-2},
      msg:"人情社会的运转成本，每年都在涨。你只能跟着涨。" },
    { t:"挑着随", eff:{money:-.9,network:-3},
      msg:"有两家你没去。他们没说什么。\n\n三年后你家办事，那两家也没来。" },
  ]},

{ id:"reunion", w:6, cond:s=>s.age>=45, tag:"生活",
  title:"三十年",
  text:`大学同学三十年聚会。当年宿舍六个人，来了四个。\n\n有人已经退了，有人还在拼，有一个人没能来——去年走的。`,
  opts:[
    { t:"喝了很多，聊了很多", eff:{health:-4,family:3,network:3},
      msg:"散场的时候大家在酒店门口站了很久，谁也不想先走。\n\n后来还是走了。回去的车上很安静。" },
    { t:"提前退场，第二天有会", eff:{merit:4,family:-3},
      msg:"你在电梯里跟他们挥手。\n\n那是你最后一次见到其中的两个人。" },
  ]},

{ id:"stock", w:6, cond:s=>s.money>=40 && s.age>=35, tag:"生活",
  title:"理财",
  text:`同事推荐了一个「绝对稳」的理财，年化比银行高不少。\n\n他说他自己也买了。`,
  opts:[
    { t:"买一点", eff:{},
      fn:s=>{ if(chance(.6)){ s.money+=9; s.pendMsg="赚了。你有点后悔买少了。"; } else { s.money=Math.max(0,s.money-16); s.pendMsg="爆了。\n\n那个同事比你亏得更多，你都不好意思去找他。"; } } },
    { t:"不碰，存银行", eff:{money:1.5},
      msg:"你这辈子在钱上没什么想象力。\n\n后来事实证明，在这个位置上，没有想象力是一种美德。" },
  ]},

{ id:"quit", w:4, cond:s=>s.age>=30 && s.age<=48 && s.rank<=3, once:true, tag:"抉择",
  title:"辞职",
  text:`老同学的公司开出了年薪，是你现在的四倍。\n\n他说：你这个脑子，在里面耗着可惜了。\n\n你回家说了这件事。家里沉默了很久，最后只说：你自己想清楚。`,
  opts:[
    { t:"辞了", eff:{},
      fn:s=>{
        s.quit = true;
        const q = s.year;
        const win = chance(.42 + s.ability/300);
        s.money = win ? s.money + ri(300,1400) : Math.max(0, s.money*0.3 + ri(0,40));
        s.family = cl(s.family + (win?10:-14));
        s.health = cl(s.health - ri(4,16));
        s.age = ri(71,88); s.year = 2004 + s.age;
        s.log.push([q, "辞去公职"]);
        s.log.push([q+ri(3,9), win ? "生意做起来了" : "生意失败，欠了一身债"]);
        s.pendMsg = "你交了辞职报告。\n\n" + (win
          ? "后来的二十年，起起落落，但你确实挣到了钱。\n\n你再也没有在周五下午四点半接过一份「不急」的稿子。"
          : "后来的二十年，起起落落，主要是落。\n\n有一年你路过原单位门口，站了一会儿，没进去。");
      } },
    { t:"不辞。都熬到这儿了", eff:{merit:5,money:-1},
      msg:"你把那条微信删了。\n\n后来的很多年，每次卡在什么地方，你都会想起那年那个数字。\n\n人总要给自己留一个「如果当年」。" },
  ]},

/* ================= 补充事件 · 早期 ================= */
{ id:"duty", w:8, cond:s=>s.rank<=2, tag:"办公室",
  title:"值班表",
  text:`春节值班表贴出来了。除夕和初一都是你。\n\n办公室主任说：年轻人嘛，家近的先顶上。\n\n你家离这里一千二百公里。`,
  opts:[
    { t:"什么也没说，值了", eff:{merit:5,family:-9,network:3},
      msg:"除夕那天单位只有你和门卫老李。他给你端了碗饺子，说小伙子别难过，我在这儿值了十九个年三十。\n\n你说谢谢李叔。\n\n你没敢问他后来怎么样了。" },
    { t:"跟主任说家远，换一下", eff:{family:6,network:-7},
      msg:"换成了另一个人。主任答应得很爽快。\n\n爽快到你后来才反应过来——他记住了这件事，而且只记住了这件事。" },
    { t:"值，但顺手把值班室的档案理了一遍", cost:2, eff:{merit:9,family:-9,health:-3},
      fn:s=>{s.flags.archiveSorted=true; s.flags.archiveYear=s.year;},
      msg:"你在值班室待了六天，把十几年的旧档案分类编号，做了一份目录。\n\n年后局长找不到一份九八年的文件，全单位只有你三分钟就翻出来了。\n\n从那以后，他记住了你的名字。" },
  ]},

{ id:"study_degree", w:8, cond:s=>s.rank<=3 && s.age<=40, once:true, tag:"机会",
  title:"在职研究生",
  text:`单位有个在职硕士的名额，周末上课，两年半。\n\n学历这个东西平时没用，只在你差一点点的时候有用。而你不知道那一天什么时候来。`,
  opts:[
    { t:"报，硬啃下来", cost:4, eff:{health:-7,family:-9},
      fn:s=>{s.ability=cl2(s.ability+18); s.flags.degree=true;},
      msg:"两年半，你没有过一个完整的周末。\n\n毕业那天你自己去照相馆拍了张学位照，没人陪。\n\n【能力大幅提升 · 档案里多了一行学历】" },
    { t:"不报，周末想歇歇", eff:{health:5,family:7},
      msg:"你睡了两年半的懒觉。\n\n后来有一次干部推荐，你和另一个人各方面都差不多。组织部的人翻了翻两份档案，在其中一份上停了两秒。" },
  ]},

{ id:"gongche", w:7, cond:s=>s.rank>=1 && s.rank<=4, tag:"风险",
  title:"钥匙",
  text:`周末孩子要去医院，家里没车。\n\n单位那辆车就停在院里，钥匙在你抽屉里。开出去一趟，四十分钟。`,
  opts:[
    { t:"开了", eff:{family:8,risk:11},
      msg:"四十分钟，来回一百二十公里，油钱你自己贴了。\n\n回来的时候你把里程表看了三遍。\n\n后来两年，每次单位查公车使用记录，你都会想起这四十分钟。" },
    { t:"打车去", eff:{money:-.3,family:4},
      msg:"打车花了一百八。\n\n你在车上算了一下，这一百八买的是什么。你觉得挺值。" },
  ]},

/* ================= 补充事件 · 中层 ================= */
{ id:"zhaobiao", w:10, pri:s=>1 + s.rank*0.30 + (s.risk>=25?0.9:0) + (s.circle.in&&!s.circle.fell?0.5:0), cond:s=>s.rank>=2 && s.rank<=6, tag:"风险",
  title:"打招呼",
  text:s=>{ const t=nth("zhaobiao");
    if(t<=1) return `一个项目要招标。开标前三天，有位老领导给你打电话，问了问天气，问了问你父母，然后说：\n\n「有个朋友想参与一下，你看着办。」\n\n「你看着办」这四个字，在这个系统里没有任何一种解释是轻松的。`;
    if(t===2) return `又一个电话。还是先问天气，再问父母，最后那句「有个朋友想参与一下」。\n\n你已经能在他问到第二句的时候就知道后面是什么了。\n\n区别只在于，这次打来的人，比上次那位说话更不用商量。`;
    return `这一次对方连天气都没问。\n\n他说：「老规矩。」\n\n你握着电话，忽然想弄清楚一件事——从哪一年开始，你这里有了「老规矩」。`; },
  opts:[
    { t:"写一份情况说明，申请回避", cost:2, eff:{merit:7,network:-16,risk:-9},
      fn:s=>{ s.flags.recused=true;
        s.pendMsg="你把那通电话的时间、内容、和对方是谁，一条一条写进了情况说明，交给了纪检组。\n\n有人说你傻，说得还挺客气。\n\n那份说明进了你的档案。很多年后有一次组织谈话，谈话的人翻到那一页，抬头看了你一眼，什么也没说。\n\n【档案里多了一份回避记录】"; } },
    { t:"做了点技术处理", eff:{merit:6,network:11,risk:27},
      msg:"标顺利地落在了那家公司。所有程序都合规，找不出一处毛病。\n\n老领导后来在一个场合拍了拍你的肩膀，什么也没说。\n\n那一下拍得挺重的。" },
    { t:"按规矩走，事后再跟他解释", eff:{merit:5,network:-14,risk:-6},
      msg:"你给他回了个电话，说这次监督得严，实在动不了。\n\n他说：理解，理解。\n\n他说了两遍「理解」，你就知道他一点也不理解。" },
    { t:"把电话录音存了下来", cost:1, eff:{risk:-9,network:-18},
      fn:s=>{s.flags.tape=true},
      msg:"你没跟任何人说这件事。录音存在一个你自己都很少打开的文件夹里。\n\n你希望这辈子都用不上它。\n\n【你手里有了一样东西 —— 保命的，也是烫手的】" },
  ]},

{ id:"baoxiao", w:8, cond:s=>s.rank>=2 && s.rank<=5, tag:"风险",
  title:"发票",
  text:`财务把一叠单子退回来了：有几张的用途写得不清楚，需要你签字确认。\n\n那几张不是你的。是科室里大家一起凑的。`,
  opts:[
    { t:"签了，都是几百块的事", eff:{network:8,risk:14},
      msg:"你签了字。金额确实很小，小到你三天后就忘了。\n\n六年后有人翻旧账的时候，从这几张纸开始翻的。" },
    { t:"退回去，让他们自己说清楚", eff:{merit:3,network:-11},
      msg:"科室里安静了一整个下午。\n\n从那以后，中午吃饭没有人叫你了。这个变化很小，小到没法跟任何人抱怨。" },
  ]},

{ id:"xunshi", w:10, cond:s=>s.rank>=3 && s.rank<=7, tag:"危机",
  title:"巡视组",
  text:s=>{ const t=nth("xunshi");
    if(t<=1) return `巡视组进驻，为期两个月。\n\n第三天，他们单独找你谈话。谈话的人很年轻，很客气，笔记本上密密麻麻。\n\n他问的第一个问题是：你觉得你们单位最大的问题是什么。`;
    if(t===2) return `巡视组又进驻了。\n\n这次找你谈话的人比上次那个还年轻，笔记本还是密密麻麻。\n\n第一个问题一字不差。你上次是怎么答的，你自己还记得。`;
    return `这次他们没有单独找你谈。\n\n这次找你，是让你谈别人。`; },
  opts:[
    { t:"讲真话", cost:2, eff:{merit:11,network:-17,risk:-11},
      msg:"你讲了四十分钟。有些事你压了很多年。\n\n巡视反馈意见出来以后，单位整改了三条，其中两条是你说的。\n\n一把手在会上说：有的同志，很有想法。\n\n这句话不是表扬。" },
    { t:"讲些正确的废话", eff:{network:5,risk:4},
      msg:"你讲了二十分钟，全是可以写进任何一份材料里的句子。\n\n年轻人记了两页，客气地送你出门。\n\n你走在楼道里，忽然觉得自己有点面熟——像你二十二岁时最讨厌的那种人。" },
    { t:"顺手把某个人的问题反映了", cost:1, eff:{network:-9,risk:9,merit:6},
      msg:"你反映的事是真的。\n\n那个人半年后被处理了。\n\n单位里没有人知道是谁说的，但所有人都开始猜。猜了很多年。" },
  ]},

{ id:"yuqing", w:9, cond:s=>s.rank>=3 && s.rank<=7, tag:"危机",
  title:"三十七分钟",
  text:`一段视频在网上传开了。执法过程有争议，画面很难看。\n\n从视频出现到市里打来电话，一共三十七分钟。\n\n现在你要决定这份通报怎么写。`,
  opts:[
    { t:"如实通报，该处理的处理", cost:3, eff:{merit:9,network:-13,risk:-9},
      msg:"通报当天发出，认了错，公布了处理结果。\n\n舆情三天就平了。\n\n但被处理的那两个执法队员，一个是老队长的儿子。这笔账挂在那儿。" },
    { t:"先按「个别人员行为」定性，稳住", cost:2, eff:{merit:4,risk:17},
      msg:"通报写得滴水不漏。舆情压下去了。\n\n三个月后，另一段视频出现了。这次是完整版。" },
    { t:"把当事人保下来，对外从简", cost:2, eff:{network:12,risk:24,merit:-6},
      msg:"你顶住了。那两个人只挨了内部处分。\n\n他们从此对你死心塌地。\n\n有些人是这么攒起来的。也有些人是这么栽进去的。" },
  ]},

{ id:"tanhua", w:9, cond:s=>s.rank>=2 && s.rank<=7 && s.yearsInRank>=2, tag:"人事",
  title:"提拔前的谈话",
  text:`组织部找你谈话。这种谈话通常意味着好事，但也不一定。\n\n谈到一半，对方忽然问：你和某某同志，关系怎么样？\n\n某某同志是你的直接上级，也是最近有点风声的那个人。`,
  opts:[
    { t:"说关系正常，工作上配合得很好", eff:{network:6,risk:6},
      msg:"你说了几句四平八稳的话。\n\n对方点头，记了下来，没有再追问。\n\n你出门的时候后背有点凉——你不知道刚才那个问题，究竟是在问你，还是在问他。" },
    { t:"如实说了一些你知道的情况", cost:1, eff:{network:-15,merit:7,risk:-9},
      msg:"你说了三件事。都是真的，也都不算大。\n\n两个月后他调走了，去了一个没什么实权的位置。\n\n他走之前找你谈过一次，聊了半小时家常，只字未提工作。那半小时你坐得笔直。" },
    { t:"说自己了解不多", eff:{network:-4},
      msg:"你说得很谨慎。\n\n对方合上本子，说：好，我们了解了。\n\n后来那次提拔没有你。你想不明白是哪句话的问题，可能哪句都不是，也可能就是这句。" },
  ]},

{ id:"dingzi", w:8, cond:s=>s.rank>=3 && s.rank<=6, tag:"管理",
  title:"刺头",
  text:`科里有个老同志，业务是全单位最强的，但从不给任何领导好脸色。\n\n他上一任领导拿他没办法，把他晾了三年。现在他归你管。`,
  opts:[
    { t:"用他，把最难的活给他", cost:2, eff:{merit:14,network:-6,health:-3},
      msg:"你把那个卡了两年的技术难题丢给他，只说了一句：我知道你能干，别人干不了。\n\n他干成了。\n\n他还是不给你好脸色，但从那以后，你在会上说话时他会抬起头。" },
    { t:"晾着，别惹麻烦", eff:{merit:-6,network:4},
      msg:"你按上一任的办法办。省心。\n\n他退休那天没办欢送会，自己收拾了东西就走了。\n\n他走后半年，单位有个项目卡住了，没人能解。" },
    { t:"想办法把他调走", cost:2, eff:{network:-9,merit:-4,risk:6},
      msg:"你办成了。\n\n科室里安静多了，也平庸多了。\n\n后来有个年轻人私下问你：听说以前科里有个特别厉害的老师傅？你说，走了。" },
  ]},

{ id:"jiuren", w:8, cond:s=>s.rank>=3, tag:"人情",
  title:"老同事",
  text:`当年一起进单位的老陈来找你，坐了很久才说事：他儿子摊上了点麻烦，不大，但需要有人说句话。\n\n他说的时候一直看着自己的鞋。你从没见过他这样。`,
  opts:[
    { t:"帮，找人过问一下", cost:2, eff:{network:6,risk:20,family:4},
      msg:"事情摆平了。老陈要给你磕头，你拦住了。\n\n后来你们再见面，他客气得像见领导。\n\n你有点想念以前那个会当着你面骂领导的老陈。" },
    { t:"告诉他能做什么、不能做什么", eff:{network:-6,risk:-4,merit:3},
      msg:"你给他讲了两个小时的程序、时限、和该找谁。你没有打一个电话。\n\n他走的时候说了句谢谢。\n\n那声谢谢是真心的，但你们从此再没约过饭。" },
  ]},

{ id:"shuzhi", w:7, cond:s=>s.rank>=3 && s.rank<=7, tag:"工作",
  title:"数字",
  text:`年度统计报上来，有一项指标比去年低。低得不多，但足够让排名掉两位。\n\n统计员小声说：口径可以调一调。`,
  opts:[
    { t:"调", eff:{merit:9,risk:16},
      msg:"排名保住了，还进了一位。\n\n那个真实的数字在你办公室的柜子里锁着。你偶尔会拿出来看一眼，然后放回去。" },
    { t:"照实报", eff:{merit:-7,risk:-8,network:-6},
      msg:"排名掉了四位。市里通报点了名。\n\n第二年那项指标真的涨上来了，因为大家开始正视它了。\n\n没有人把这两件事联系起来。" },
  ]},

/* ================= 补充事件 · 高层 ================= */
{ id:"boss_diff", w:11, cond:s=>s.rank>=5, tag:"决策",
  title:"不同意见",
  text:`班子会上，一把手的方案你不同意。你的理由很硬，数据都在手上。\n\n会议室里十一个人，都在等你开口或者不开口。`,
  opts:[
    { t:"当场把话说完", cost:2, eff:{merit:12,network:-16,risk:-4},
      msg:"你讲了六分钟。会议室很安静。\n\n方案最后还是通过了，但改了两条，是你提的那两条。\n\n散会后一把手叫住你，说：以后这种话，会前跟我说。\n\n这句话有两种听法，你两种都听了。" },
    { t:"会上不说，会后单独找他", cost:2, eff:{network:9,merit:4},
      msg:"你在他办公室待了四十分钟。他听完，说再想想。\n\n三天后方案调整了，署的是他的名字。\n\n这就是这个系统里最体面的一种成功。" },
    { t:"举手同意", eff:{network:6,merit:-9,risk:8},
      msg:"全票通过。\n\n两年后那个项目出了问题，追责的时候翻会议记录，你的名字在同意栏里。\n\n没有人记得你当时想说什么。" },
  ]},

{ id:"touzi", w:10, cond:s=>s.rank>=5, tag:"风险",
  title:"投资商",
  text:`一个大项目要落地，投资额是你们全年财政收入的三分之一。\n\n对方老板很热情，条件好得不像话。你让人查了他的底，查出来的东西让你睡不着。`,
  opts:[
    { t:"签，先把 GDP 做上去", eff:{merit:22,risk:32},
      msg:"项目落地那天，锣鼓喧天。你的名字上了省报。\n\n三年后他跑了，留下一片烂尾和四百多个讨薪的工人。\n\n那年冬天特别冷。" },
    { t:"不签，把他劝走", cost:3, eff:{merit:-11,network:-9,risk:-11},
      msg:"你顶住了很大压力。有人说你保守，有人说你不懂经济。\n\n那个项目后来落在了邻市。\n\n两年后邻市的书记因为这个项目被免了。你在新闻里看到消息，坐了很久，谁也没说。" },
    { t:"签，但把条件全锁死在合同里", cost:5, eff:{merit:14,health:-7,risk:9},
      msg:"你带着法制办的人跟他磨了两个月，加了十七条约束性条款，还压了一笔保证金。\n\n他后来还是跑了，但这次跑不掉——保证金够付工人工资。\n\n没有人给你记功。这种事记不了功，因为它防住的东西从来没发生过。" },
  ]},

{ id:"anpai", w:10, cond:s=>s.rank>=6, tag:"人事",
  title:"打招呼的人",
  text:`一个位置空出来了。这几天，你的手机响得比平时勤。\n\n有三个人跟你打过招呼，其中一个是你惹不起的。`,
  opts:[
    { t:"按惹不起的那个来", eff:{network:14,risk:20,merit:-7},
      msg:"人安排上去了。能力一般，但没出大错。\n\n你欠的那个人情，从此变成了别人欠你的。人情就是这么流转的。\n\n这个位置后来做了很多年，一直没出什么成绩。" },
    { t:"按最合适的人选来，然后去解释", cost:3, eff:{merit:12,network:-16},
      msg:"你一个一个打电话解释。有两个说理解，一个直接挂了。\n\n上任的那个人后来干得很好，好到没人再提这件事。\n\n除了挂电话那个。他记了很久。" },
    { t:"搁着，让位置空一年", eff:{network:-6,merit:-4},
      msg:"你谁也不得罪，代价是这个位置空转了一年。\n\n下面的人做事没了主心骨，两个项目拖黄了。\n\n不做选择也是一种选择，而且往往是最贵的那种。" },
  ]},

{ id:"shicha", w:9, cond:s=>s.rank>=5, tag:"工作",
  title:"视察路线",
  text:`上面要来人。办公室报上来一条视察路线，避开了三个地方。\n\n那三个地方，恰恰是最需要被看见的。`,
  opts:[
    { t:"照报的路线走", eff:{merit:7,network:5,risk:6},
      msg:"视察很顺利，评价很高。\n\n那三个地方后来也解决了，晚了四年。\n\n四年里，那里的人一直在等。" },
    { t:"改路线，带他们去看最差的", cost:3, eff:{merit:15,network:-11,risk:-6},
      msg:"办公室主任的脸都白了。\n\n领导在那三个地方一共待了两个小时，回去以后专项资金批下来了。\n\n你的直接上级从此对你有了看法，具体是什么看法，你到退休都没搞清楚。" },
  ]},

{ id:"chaiqian", w:9, cond:s=>s.rank>=4 && s.rank<=7, tag:"危机",
  title:"最后一户",
  text:`旧城改造还剩最后一户不签。八十六户已经搬了，工期压着，上面盯着。\n\n那家的老太太九十一岁，在那个院子里住了七十年。`,
  opts:[
    { t:"亲自去谈，谈到她愿意为止", cost:5, eff:{merit:12,health:-9,network:-6},
      msg:"你去了十一次。前八次她连门都不开。\n\n第十一次她开了门，你陪她坐了一下午，听她讲这个院子里发生过的事。\n\n最后她签了，条件是把院里那棵石榴树移到新小区去。\n\n那棵树后来活了。" },
    { t:"按程序申请强制执行", eff:{merit:9,risk:26,health:-4},
      msg:"执行那天你没去现场。\n\n照片你后来还是看到了。\n\n工期保住了，指标完成了，你在总结会上讲了话。你讲的时候，眼睛没看台下。" },
    { t:"停工，等", eff:{merit:-13,network:-11,risk:-9},
      msg:"工期停了十四个月，直到老太太自己去世，家属签了字。\n\n你因为这个项目被约谈过两次。\n\n很多年后你还记得那个院子的样子。你没有后悔过，但你也没跟人说过这件事。" },
  ]},

{ id:"huanrenqing", w:8, cond:s=>s.rank>=6, tag:"人情",
  title:"还情",
  text:`当年提拔过你的那位老领导退了很多年了。他儿子的公司现在想进一个门槛很高的行业，需要一张许可证。\n\n老人家自己没开口，是别人来带的话。`,
  opts:[
    { t:"办，欠了一辈子的", eff:{network:9,risk:31,family:3},
      msg:"证批下来了。程序上挑不出毛病，只是快了一点。\n\n你去看过老人家一次，他拉着你的手说了很多当年的事，一句没提这件事。\n\n你们都很清楚。清楚到不能说。" },
    { t:"不办，但去看看老人家", cost:2, eff:{network:-11,risk:-6,family:4},
      msg:"你提了两盒茶叶去，坐了两个小时，聊的全是二十年前的事。\n\n临走时他说：现在这个时候，是该谨慎些。\n\n你不知道他是真这么想，还是在给你台阶。你宁愿相信是前者。" },
  ]},

{ id:"erxian", w:9, cond:s=>s.rank>=5 && s.age>=54, once:true, tag:"人事",
  title:"退二线",
  text:`组织上找你谈，语气很温和：考虑到年龄结构，安排你到人大或政协去，级别不动。\n\n级别不动，权力归零。这句话没人会说出口，但所有人都懂。`,
  opts:[
    { t:"接受，站好最后一班岗", eff:{merit:-13,health:11,family:14,risk:-12},
      msg:"你交接得干干净净，连办公室的绿植都留下了。\n\n新岗位很清闲，你有时候一整天没有一个电话。\n\n第一年你很不习惯，第二年你开始觉得，这样也挺好。" },
    { t:"争取一下，再干两年", cost:4, eff:{network:-9,health:-7,merit:5},
      fn:s=>{ if(chance(.45)){ s.pendMsg="你找了两个人，说了很多话。\\n\\n最后争取到了两年。\\n\\n这两年你干得很拼，因为你知道所有人都在看你值不值这两年。"; }
              else { s.merit=cl(s.merit-15); s.network=cl(s.network-11);
                     s.pendMsg="你找了两个人，说了很多话。\\n\\n没争取到，而且现在所有人都知道你争取过了。\\n\\n交接那天，来送你的人比原本会来的少了一半。"; } } },
  ]},

/* ================= 补充事件 · 高风险高回报 ================= */
{ id:"gangu", w:8, pri:s=>1 + s.rank*0.30 + (s.risk>=25?0.9:0) + (s.circle.in&&!s.circle.fell?0.5:0), cond:s=>s.rank>=4 && s.risk>=20, tag:"风险",
  title:"干股",
  text:`一个做工程的朋友说，公司要给你留一点份额。不用出钱，不用签字，不用出面。\n\n他说这话的时候在笑，好像在讲一件很平常的事。\n\n在他那个世界里，这确实很平常。`,
  opts:[
    { t:"要了", eff:{bribe:29,risk:52},
      fn:s=>{ s.flags.shares=true;
        s.flags.shareIncome = Math.round(2.3*bribeMul(s)*10)/10;
        s.pendMsg="第一年分红打过来的时候，你在手机银行前面坐了很久。\n\n那个数字比你二十年工资加起来还多。\n\n更要命的是，它明年还会来一次，后年还会来一次。\n\n从那天起，你多了一件永远做不完的事：想那一天会怎么来。"; },
      msg:"第一年分红打过来的时候，你在手机银行前面坐了很久。\n\n那个数字比你二十年工资加起来还多。\n\n从那天起，你多了一件永远做不完的事：想那一天会怎么来。" },
    { t:"不要，也别再来往了", eff:{risk:-14,network:-11},
      msg:"你把话说得很硬，硬到有点不留情面。\n\n他愣了一下，笑着说：行，是我唐突了。\n\n他后来出事了。名单很长，没有你。" },
  ]},

{ id:"huikou", w:8, pri:s=>1 + s.rank*0.30 + (s.risk>=25?0.9:0) + (s.circle.in&&!s.circle.fell?0.5:0), cond:s=>s.rank>=5, tag:"风险",
  title:"结算",
  text:`一个已经竣工验收的工程，施工方送来了「结算尾款的一点心意」。\n\n数目大到不能用信封装，只能用箱子。`,
  opts:[
    { t:"收下", eff:{bribe:15,risk:46},
      msg:"箱子在你后备箱里放了三天，你才敢拿回家。\n\n那三天你把车停在了地下车库最里面的位置。\n\n后来你换了辆车，但每次停车，还是习惯往最里面开。" },
    { t:"退回去，就当没发生", eff:{risk:-11,network:-7},
      msg:"你让秘书原封退了回去。\n\n对方后来托人打听：领导是不是嫌少？\n\n这个问题让你笑了一下。他们的世界里没有第三个选项。" },
    { t:"收下，然后原封上交", eff:{risk:-24,merit:11,network:-20},
      msg:"你上交的时候，纪委的同志把箱子打开又合上，问了一句：您确定要走这个程序？\n\n你说确定。\n\n这件事在系统内传开了。有人敬重你，更多的人开始躲着你。" },
  ]},

{ id:"chuanwen", w:7, cond:s=>s.rank>=4 && s.risk>=25, tag:"风险",
  title:"传闻",
  text:s=>(s.flags.affair || s.flags.affairEnded)
    ? `一封举报信里，除了经济问题，还提到了「生活作风」。\n\n你把那几行看了三遍。时间对得上，地点也对得上。\n\n最难受的不是被人知道了。是你现在必须坐在这里，认真地组织语言，去解释一件真实发生过的事情为什么不算数。`
    : `一封举报信里，除了经济问题，还提到了「生活作风」。\n\n那部分内容是编的，但编得很像真的。\n\n最难受的是，你没办法证明一件没发生过的事没发生过。`,
  opts:[
    { t:"配合调查，把该说的都说清楚", cost:3, eff:{risk:-16,health:-9,family:-11},
      msg:"调查了四个月，结论是不实。\n\n结论出来的时候，单位里已经没人不知道这件事了。\n\n你回家那天，家里问了一句，你解释了。对方说：我信你。\n\n那三个字你记了很久，因为对方说得有点太快了。" },
    { t:"托关系压下来", cost:2, eff:{risk:9,network:-11,money:-8},
      msg:"信压下去了，没有立案。\n\n但压下去的东西不会消失，它只是换了个地方待着。\n\n后来每次有风吹草动，你都会想起这封信。" },
  ]},

/* ---------- 外逃三段式 ---------- */
{ id:"offshore", w:15, pri:s=>2.4,
  cond:s=>(s.grey||0)>=260 && s.risk>=30 && s.rank>=3 && s.rank<=6 && !s.flags.assetsOut, once:true, tag:"风险",
  title:"后路",
  text:s=>`这个念头是你自己起的。\n\n起因是一条不到二十个字的通报，某地某人，你不认识。你把那条通报翻来覆去看了三遍，然后关掉手机，在阳台上站了很久。\n\n你账上说不清的部分已经有 ${yuan(s.grey||0,0)}。你很清楚，这个数字自己长脚了——它不会停在这儿。\n\n接下来的两个月，你用一部没实名的手机查了很多东西，问了三个人，见了一个。\n\n对方说得很平静：钱可以出去，人可以晚一步。但要早，越往后通道越窄。`,
  opts:[
    { t:"办。先把钱挪出去", eff:{risk:26,money:-30,family:-9},
      fn:s=>{ s.flags.assetsOut = true;
        s.pendMsg = "前后花了半年，比你以为的慢，也比你以为的贵。\n\n办完那天你在办公室坐到很晚。你忽然意识到，从今天起，你和这栋楼里所有人都不一样了。\n\n他们只是有可能出事。你是已经准备好出事了。\n\n【你在境外有了一条后路 · 从此每年多一分说不清】"; } },
    { t:"只办身份，钱先不动", cost:2, eff:{risk:14,money:-16,health:-4},
      fn:s=>{ s.flags.assetsOut = true; s.flags.idOnly = true;
        s.pendMsg = "你只办了那一样，锁在一个连你配偶都不知道的地方。\n\n钱没动。你告诉自己这只是买个心安。\n\n心安确实买到了一点。代价是从那以后，你每次看到那条通报格式的新闻，都会先想一下那个抽屉。\n\n【你有了一条后路 · 但钱还在这边】"; } },
    { t:"到此为止。这条路不能碰", eff:{risk:-11,health:5,merit:4},
      fn:s=>{ s.flags.noExit = true;
        s.pendMsg = "你把那部手机拆了，卡剪了，扔在三个不同的垃圾桶。\n\n那个人后来没再联系过你。\n\n你有时候会想，如果当初办了会怎么样。这个念头每次只停留两秒钟——因为你已经替自己把那扇门关死了，想也没用。\n\n【你亲手断了这条路】"; } },
  ]},

{ id:"escape", w:0, force:true, tag:"风 险",
  title:"窗口",
  text:s=>`你已经等这个时机等了一阵子了。\n\n巡视的通知下来了，比往年都早。你分管的那几摊，有两摊在名单第一批。\n\n你手上有 ${yuan(s.money,0)}，其中说不清的部分是 ${yuan(s.grey||0,0)}。你算过很多遍：够，而且够很久。\n\n后天有一班飞机。你的护照还在你自己手里——这个状态还能维持多久，你不知道。\n\n你在书房坐到凌晨三点。桌上摊着明天的会议材料，旁边压着一张很多年前的照片。`,
  opts:[
    { t:"走", eff:{},
      fn:s=>{ s.flags.escapeAsked = true; s.escaped = true; s.flags.spouseLeft = true;
        s.log.push([s.year, "出境后未归"]); } },
    { t:"不走。跑了就真的完了", eff:{risk:-9,health:-11,family:6},
      fn:s=>{ s.flags.escapeAsked = true;
        s.pendMsg = "你把材料合上，回房间睡了。\n\n那天晚上你睡得很沉，是很多年来最沉的一觉。\n\n你不知道明天会发生什么，但你知道自己不会在别的地方醒来。"; } },
    { t:"不走，而且天亮就去说清楚", cost:4, eff:{risk:-48,merit:-16,network:-22,money:-40},
      fn:s=>{ s.flags.escapeAsked = true; s.flags.confessed = true;
        s.pendMsg = "你没有等到后天。第二天早上八点，你自己走进了那栋楼。\n\n谈了很多天，退了很多东西，受了处分，降了级。\n\n从那栋楼里出来的那个下午下着小雨，你没打伞。\n\n那是十几年来你睡得最好的一晚。"; } },
  ]},

{ id:"gaokao", w:12, pri:4, cond:s=>kidAge(s)>=17 && kidAge(s)<=19, once:true, tag:"家庭",
  title:"志愿",
  text:`{子女}高考完了，分数不错。填志愿的时候，{TA子}说想学的专业，跟你规划的完全不是一回事。\n\n你为{TA子}规划的那条路，你走过，你知道它通向哪里。`,
  opts:[
    { t:"按你的意思来，将来{TA子}会懂", eff:{family:-16,merit:3},
      msg:"{TA子}最后填了你选的学校和专业。\n\n毕业后进了体制，走得很稳。\n\n有一年春节喝多了，{TA子}说了一句：爸，我这辈子没做过一个自己的决定。\n\n然后就睡着了，第二天什么都不记得。你记了一辈子。" },
    { t:"让{TA子}自己选", eff:{family:17,money:-6},
      msg:"{TA子}选了一个你完全不了解的专业，去了很远的城市。\n\n那几年过得挺辛苦，你偷偷打过几次钱。\n\n后来{TA子}做得还行。不算大富大贵，但每次打电话过来，语气都是轻快的。\n\n轻快这个东西，你自己已经很多年没有过了。" },
  ]},

{ id:"lend", w:7, cond:s=>s.money>=60 && s.age>=38, tag:"生活",
  title:"借钱",
  text:`大学同学开口借二十万，说周转一下，三个月就还。\n\n你们已经七八年没联系了。他能开这个口，说明是真的到了没办法的时候。`,
  opts:[
    { t:"借", eff:{money:-14,family:-4,network:4},
      fn:s=>{ if(chance(.4)){ s.money+=21; s.pendMsg="三个月后他真的还了，还多给了利息。\\n\\n你把多的退了回去。\\n\\n后来他生意做起来了，逢年过节都记得你。"; }
              else { s.pendMsg="三个月过去了，半年过去了，两年过去了。\\n\\n他没有跑，只是还不上。每次通电话都很客气，客气到你不好意思再问。\\n\\n那二十万你后来在心里划掉了。"; } } },
    { t:"婉拒", eff:{network:-6,money:1},
      msg:"你说手头也紧，孩子上学花销大。\n\n他说理解理解，挂了。\n\n这个电话是你们最后一次通话。" },
  ]},

{ id:"spouse_ill", w:7, cond:s=>s.flags.married && s.age>=50, once:true, tag:"家庭",
  title:"体检报告",
  text:`妻子的体检报告出来了，有一项指标不对，需要住院进一步检查。\n\n她说没事，你先忙你的。\n\n她这句话说了二十多年，你每一次都信了。`,
  opts:[
    { t:"这次不忙。请假陪着", cost:4, eff:{family:22,merit:-11,health:-3},
      msg:"你陪了十九天。\n\n结果是良性的。出院那天她说：其实我一个人也能行。\n\n你说我知道。\n\n然后你们谁也没再说话，走了很长一段路。" },
    { t:"安排了最好的医生，人没去", eff:{money:-9,family:-15,merit:5},
      msg:"你打了七个电话，找到了最好的专家，安排了最好的病房。\n\n所有能用钱和关系解决的，你都解决了。\n\n她出院是自己打车回的家。" },
  ]},

/* ================= 补充事件 · 加时赛 ================= */
{ id:"ot_meet", w:11, cond:s=>s.overtime, tag:"晚局",
  title:"会见",
  text:`日程排得满满的。今天要见五拨人，每拨二十分钟。\n\n第三拨里有个人，是你三十年前在青阳县的同事。他现在是个地级市的一把手，进门时叫了你一声职务，很标准。`,
  opts:[
    { t:"按流程谈完，公事公办", eff:{merit:6,network:-4},
      msg:"二十分钟，谈的都是工作，一句私话没有。\n\n他走的时候还是那句标准的称呼。\n\n门关上以后，你在座位上坐了一会儿，才叫下一拨进来。" },
    { t:"让秘书把后面往后推半小时", cost:2, eff:{family:9,network:8,merit:-4},
      msg:"你们聊了五十分钟，全是三十年前的事：老周、搪瓷缸、那年冬天的暖气。\n\n他临走时说：您还记得这些啊。\n\n你说，我就剩这些了。" },
  ]},

{ id:"ot_back", w:9, cond:s=>s.overtime, once:true, tag:"晚局",
  title:"回去看看",
  text:`青阳县要办一个纪念活动，请你回去。\n\n你已经四十多年没回去过了。`,
  opts:[
    { t:"回去", cost:3, eff:{family:14,health:-4,merit:4},
      msg:"当年的办公楼拆了，原址是个广场。\n\n有人给你介绍这几年的发展，你一直点头。走到广场东南角的时候你停了一下——那个位置，大概就是你那张桌子。\n\n没有人知道你为什么停下来。你自己也没解释。" },
    { t:"让办公室回个函，感谢邀请", eff:{merit:2},
      msg:"函写得很得体。\n\n你后来一直没回去过。\n\n有些地方，去了就得承认时间过去了。" },
  ]},

/* ================= 补充事件 · 浪潮专属 ================= */
{ id:"w_merge2", w:14, waveTag:"merge", tag:"变局",
  title:"公章",
  text:`撤县并区，最后一天。\n\n你负责监交公章。那枚章用了四十七年，边缘磨得发亮。\n\n交接完，它就要被封存销毁了。`,
  opts:[
    { t:"按程序封存，签字", eff:{merit:6,network:3},
      msg:"你签了字，看着它被装进袋子。\n\n第二天新章启用，一切照常运转。没有人提起旧的那枚。\n\n只有你偶尔会想起它压在纸上的手感。" },
    { t:"申请留一份拓印，进档案馆", cost:2, eff:{merit:9,family:4},
      msg:"你打了报告，批下来了。那份拓印现在在县档案馆的玻璃柜里。\n\n很多年后有个写地方志的年轻人找到你，问起这件事。\n\n他说：多亏您当年留了一手。" },
  ]},

{ id:"w_aging2", w:13, waveTag:"aging", cond:s=>s.rank>=3, tag:"变局",
  title:"床位",
  text:`全区的养老床位缺口是三千七百张。你手里的钱，够建四百张。\n\n方案有两种：建一个漂亮的示范中心，或者在十几个街道各铺一点，都不好看。`,
  opts:[
    { t:"建示范中心，能上电视", eff:{merit:14,risk:9},
      msg:"中心建得很漂亮，成了全省的参观点。\n\n入住率一直不高——因为它建在了新区，老人们的子女都在老城。\n\n参观的人比住的人多。" },
    { t:"铺到街道去，难看但管用", cost:4, eff:{merit:8,health:-5,network:-6},
      msg:"十七个点，全部塞在老旧小区的边角料空间里，照片拍出来毫无观赏性。\n\n没有一家媒体来报道。\n\n三年后入住率百分之九十四。" },
  ]},


/* ================= 补充事件 · 早期加厚 ================= */
{ id:"sushe", w:11, cond:s=>s.rank<=1 && s.age<=28, once:true, tag:"生活",
  title:"宿舍",
  text:`单位有间空宿舍，在办公楼后面那栋老楼三层，走到办公室两分钟。\n\n房租象征性收八十块。\n\n李主任说：住这儿方便，随叫随到。\n\n「随叫随到」这四个字，他说得很自然。`,
  opts:[
    { t:"住进去", eff:{money:2.4,merit:7,health:-4,family:-7},
      fn:s=>{s.flags.dorm=true},
      msg:"你搬了进去。省下的房租很实在。\n\n第一个月被叫下楼加班四次，第二个月七次。到第三个月你已经养成了穿着衬衫睡觉的习惯，因为省事。\n\n你后来住了整整六年。搬走那天你才发现，那六年里你没有一天真正下过班。" },
    { t:"在外面租，远一点也行", eff:{family:6,health:3},
      fn:s=>{ s.flags.renting = true; },
      msg:"你租在城东，通勤四十分钟。\n\n有几次夜里来电话叫人，第一个到的从来不是你。\n\n主任没说过什么。但有些名单，你也从来没在上面出现过。" },
  ]},

{ id:"jilu", w:11, cond:s=>s.rank<=1 && s.age<=30, once:true, tag:"工作",
  title:"会议记录",
  text:`第一次列席局务会做记录。你记得很认真，回来整理成了会议纪要。\n\n交上去之前你发现一个问题：局长中途说了一句话，语气不太好，内容也跟最后的决议不一致。\n\n那句话，记还是不记。`,
  opts:[
    { t:"照实记上", eff:{merit:4,network:-11},
      msg:"纪要发下去，办公室主任把你叫过去，什么也没说，只是把那一段用红笔划掉了，让你重印。\n\n他说：小张，纪要不是速记。\n\n你回去把那句话删了。你也把这句教诲记住了，记了一辈子。" },
    { t:"删掉，只留决议", eff:{network:9,merit:2},
      msg:"纪要一次通过。主任说这个稿子干净。\n\n你后来做过上百次记录，再没犹豫过。\n\n有时候你会想起自己第一次拿红笔划掉别人一句话的那个下午，但也就是想起而已。" },
    { t:"去问主任该怎么处理", cost:1, eff:{network:7,merit:3},
      msg:"主任愣了一下，然后笑了：你这个小伙子，有点意思。\n\n他教了你怎么处理，还多说了两句别的。那两句别的，比纪要值钱多了。\n\n他从此把你当自己人。" },
  ]},

{ id:"paotui", w:10, cond:s=>s.rank<=1 && s.age<=29, tag:"办公室",
  title:"这些也是工作吗",
  text:`这个月你做的事：取快递十一次，修打印机四次，订盒饭二十二次，搬矿泉水六趟，替三个人代打过卡。\n\n还有半份材料，是你唯一算得上业务的活。\n\n你是全省第七名考进来的。`,
  opts:[
    { t:"忍着，什么都干", eff:{network:9,merit:-3,health:-3},
      msg:"你什么都干，而且干得比别人细。订盒饭你会记住谁不吃香菜。\n\n三年后有个新人来了，这些活交给了他。\n\n交接那天你跟他说：这些事没意义，但记住谁不吃香菜是有意义的。他没听懂。" },
    { t:"找主任聊一次，想干点正经业务", cost:1, eff:{merit:8,network:-7},
      msg:"主任听完，沉默了几秒，说：行，那个报表你来做。\n\n那是全单位最难最琐碎的一张报表，之前没人愿意碰。\n\n你做了两年，做成了全市的样板。这是你第一件真正属于自己的东西。" },
    { t:"消极对付，能拖就拖", eff:{network:-11,health:4},
      msg:"你开始迟到，开始装作没看见群里的消息。\n\n没有人批评你，只是渐渐地，什么事都不找你了。\n\n清静了。清静得让你心里发慌。" },
  ]},

{ id:"kaohe", w:10, cond:s=>s.rank<=2 && s.age<=33, tag:"办公室",
  title:"自评表",
  text:`年度考核自评表发下来了。「个人工作总结」那一栏，有半页空白。\n\n隔壁桌的老同志写了八行，其中六行是抄的文件。他写完把表推给你：参考参考。`,
  opts:[
    { t:"照他的抄", eff:{network:5,merit:-3},
      msg:"你抄了，改了几个字。\n\n表交上去，评了个「称职」。全单位百分之九十都是「称职」。\n\n这张表你后来填了三十几年，内容基本没变过。" },
    { t:"认真写自己真干过的事", cost:1, eff:{merit:9,network:-5},
      msg:"你写了满满一页，具体到每个项目的数字。\n\n办公室主任看的时候皱了下眉，说：写这么细干嘛，又没人看。\n\n三年后一次干部考察，考察组真的把历年自评表调出来看了。他们看到了那一页。" },
    { t:"写得很谦虚，把功劳都给了集体", eff:{network:11,merit:-4},
      msg:"通篇「在领导的关心下」「在同志们的帮助下」，自己的部分只有两行。\n\n领导很满意。这种满意很廉价，但它是真的。" },
  ]},

{ id:"xiaochen", w:9, cond:s=>s.rank<=2 && s.age>=25 && s.age<=34, once:true, tag:"抉择",
  title:"小陈走了",
  text:`同一批进来的小陈辞职了。他考研上岸，去了南方。\n\n走之前他请你吃了顿饭，喝到一半问你：\n\n「你有没有算过，你这辈子最好的结果是什么？」`,
  opts:[
    { t:"说算过，能到正处就知足了", eff:{merit:5,health:-2},
      msg:"你说了个很具体的数字，具体到年份和职级。\n\n他笑了一下，说：那挺好的，至少你算得出来。\n\n你送他上车。回去的路上你意识到，你确实算过，而且算过不止一次。" },
    { t:"说没算过，走一步看一步", eff:{family:5,health:3},
      msg:"他说：我就是算不出来才走的。\n\n很多年后你在新闻里见过他一次，公司做得不小。\n\n那天你正在改一份第二天要用的材料，看完就关了手机，继续改。" },
    { t:"问他要不要一起走", cost:1, eff:{network:-4,merit:-3,family:4},
      fn:s=>{s.flags.wavered=true},
      msg:"你半开玩笑地说了这句话。他愣住了，认真地看了你几秒钟，说：你不会走的。\n\n他说得对。\n\n但你后来每次难受的时候，都会想起自己曾经问过这么一句。这句话是你留给自己的一个小口子 —— 证明你也曾经想过别的活法。" },
  ]},


/* ================= 早期事件 · 稀释批次 ================= */
{ id:"shitang", w:12, cond:s=>s.rank<=2 && s.age<=34, tag:"办公室",
  title:"食堂",
  text:`中午打完饭，你端着盘子站在过道上。\n\n靠窗那桌是几个科长，中间那桌是各科室的老同志，靠门口那桌坐着几个和你差不多大的。\n\n三张桌子，三种人生。你得挑一张坐下。`,
  opts:[
    { t:"厚着脸皮往靠窗那桌凑", cost:1, eff:{network:9,merit:2},
      msg:"你坐下的时候他们停了半秒，然后继续聊。\n\n你一句话没插上，但你听到了一件三个月后才正式公布的事。\n\n从那天起你每天十一点半准时下楼——去晚了，靠窗那桌就满了。" },
    { t:"跟同龄人坐一起", eff:{family:5,health:3,network:-3},
      msg:"这顿饭吃得最舒服。大家骂领导、聊房价、说谁又走了。\n\n后来这几个人里走了三个。剩下的两个，一个成了你的下属，一个成了你的对手。" },
    { t:"打包回办公室，边吃边干活", eff:{merit:6,health:-3,network:-5},
      msg:"你在办公桌上吃了六年盒饭。\n\n六年里你比谁都熟悉业务，也比谁都不知道单位在发生什么。" },
  ]},

{ id:"mobanche", w:12, cond:s=>s.rank<=2 && s.age<=33, tag:"生活",
  title:"末班车",
  text:`晚上十点四十，材料还差一段。末班公交十一点整。\n\n你算了一下：现在走，明天早来一小时补；现在不走，打车四十块，到家一点。`,
  opts:[
    { t:"赶末班车", eff:{money:.4,health:4,merit:-3},
      msg:"你一路小跑，赶上了。\n\n车上没几个人。你靠着窗户，看见路灯一盏一盏往后退。\n\n那一年你还会为了四十块钱跑起来。后来你有车了，但再也没有在夜里跑过。" },
    { t:"改完再打车", eff:{money:-.5,health:-4,merit:6},
      msg:"你一点二十到家。稿子交上去，主任说这次可以。\n\n打车票你留着，本想找机会报销，一直没好意思提。那张票在钱包里放到褪色。" },
    { t:"直接在办公室沙发上凑合一夜", eff:{merit:7,health:-7,network:4},
      msg:"早上六点你被保洁阿姨的钥匙声吵醒。\n\n她说：小伙子又睡这儿啊。「又」这个字，说明她已经见过好几次了。\n\n主任那天上午看见你桌上叠着的毛毯，什么也没说。但他看见了。" },
  ]},

{ id:"laoxiang", w:11, cond:s=>s.rank<=2 && s.age<=32, once:true, tag:"人情",
  title:"老乡",
  text:`单位有个不成文的圈子：几个同一个地级市出来的，每月聚一次。\n\n有人来问你去不去。你老家确实是那儿的。`,
  opts:[
    { t:"去，多条线是多条路", cost:2, eff:{network:12,money:-.5,risk:6},
      fn:s=>{s.flags.laoxiang=true},
      msg:"一桌八个人，最高的是个副处。散场时他记住了你的名字和科室。\n\n这个圈子后来帮过你两次，也让你在一次谈话里被单独问起过。\n\n他们问的时候语气很随意，随意得让你后背发凉。" },
    { t:"不去，不想被贴标签", eff:{network:-5,risk:-4,merit:3},
      msg:"你婉拒了两次，第三次他们就没再问。\n\n你确实干净。你也确实，什么风声都比别人晚知道三天。" },
  ]},

{ id:"jiedai", w:12, cond:s=>s.rank<=2 && s.age<=34, tag:"应酬",
  title:"陪同",
  text:`上级来人，主任点名让你陪同。你的任务写在纸条上：倒水、递材料、拍照、最后敬一圈酒。\n\n纸条最后一行是：「话不用你说。」`,
  opts:[
    { t:"照纸条办，一个字不多说", eff:{network:8,health:-4},
      msg:"全程无差错。倒水的时机、递材料的角度、敬酒的顺序，你都做对了。\n\n主任事后说：这个小伙子稳。\n\n「稳」是这个系统里对年轻人最高的评价，也是最低的期待。" },
    { t:"找机会插了一句业务上的话", cost:1, eff:{merit:9,network:-6},
      msg:"你说的那句话是对的，而且客人来了兴趣，追问了两句。\n\n那顿饭后来变成了业务讨论。主任全程微笑，回单位后叫你去办公室待了二十分钟。\n\n他没批评你。他只是说：下次这种话，让我来说。" },
    { t:"敬酒时被灌了三杯", eff:{network:6,health:-9,merit:3},
      msg:"你吐在了饭店的洗手间，然后回来继续倒水。\n\n第二天你请了半天假。这半天没扣工资，因为主任跟人事说你是「公务活动受伤」。\n\n这大概是你听过最荒诞也最温暖的一句话。" },
  ]},

{ id:"qunli", w:12, cond:s=>s.rank<=3 && s.age<=38, tag:"办公室",
  title:"@所有人",
  text:s=>{ const t=nth("qunli");
    if(t<=1) return `晚上十一点二十，工作群弹出一条：@所有人 明天上午九点前报数据，收到请回复。\n\n已经有六个人回了「收到」。第七条消息是二十三点二十一分发的。\n\n现在是二十三点二十二分。`;
    if(t===2) return `又是十一点二十。\n\n这次群里已经有十一个人回了「收到」。\n\n你的拇指停在屏幕上，忽然想不起自己上一次在十一点之前放下手机是哪一天。`;
    return `十一点二十，@所有人。\n\n你直接回了「收到」。\n\n回完才往上翻，看看到底是什么事。`; },
  opts:[
    { t:"立刻回「收到」，然后爬起来做", cost:2, eff:{merit:6,health:-5,family:-4},
      msg:"你是第八个回的。做到凌晨一点半。\n\n第二天九点交上去，主任说了句「行」。\n\n这个群后来又响过上千次。你每一次都是前十个回复的，这件事没有任何人夸过你，但它确实是一种资历。" },
    { t:"回「收到」，明早六点起来做", eff:{merit:4,health:-2,family:2},
      msg:"你定了五点半的闹钟，赶在八点半交了。\n\n没有区别。这件事你想明白得很早：他们要的是「收到」这两个字，和九点前那份表。中间那八个小时你怎么过的，没有人关心。" },
    { t:"睡了，第二天早上才看见", eff:{merit:-6,network:-8,health:5},
      msg:"你是最后一个回的，九点零七分。\n\n主任在群里没说什么，单独发了个「?」。\n\n那个问号你盯着看了很久，最后回了三个字：对不起。" },
  ]},

{ id:"piping", w:11, cond:s=>s.rank<=2 && s.age<=32, once:true, tag:"办公室",
  title:"当众",
  text:`科室例会上，主任因为一个数据错误当着所有人批评了你。\n\n那个数据不是你填的。填的人就坐在你旁边，一直低着头。`,
  opts:[
    { t:"当场认了", eff:{network:11,merit:-4},
      msg:"你说是我的问题，我改。\n\n散会后旁边那个人跟着你走到楼梯口，说了句谢谢。\n\n三年后他调去了另一个单位。走之前他请你吃了顿饭，什么也没提，但你们都知道是为什么。" },
    { t:"说明情况", eff:{merit:4,network:-11},
      msg:"你说得很客气，只是把事实讲了一遍。\n\n主任「哦」了一声，说那下次都注意。会就这么开完了。\n\n你没做错任何事。但从那天起，办公室里有一个人再也没主动跟你说过话。" },
    { t:"什么也没说，会后去找主任", cost:1, eff:{network:6,merit:4},
      msg:"你在他办公室待了十分钟，把情况说清楚了，也说了自己没当场解释的原因。\n\n他看了你一眼，说：你比我想的成熟。\n\n那年年底，科室报优秀的名额，他给了你。" },
  ]},

/* ---------- 新人期补充（22–32 岁） ---------- */
{ id:"qigao", w:11, cond:s=>s.rank<=1 && s.age<=27, once:true, tag:"工作",
  title:"第七稿",
  text:`一份三千字的汇报材料，你写到第七稿。\n\n第七稿和第一稿最大的区别是：第一稿里有六处你自己想出来的话，第七稿里一处也没有了。\n\n主任看完说：这稿可以。`,
  opts:[
    { t:"就这么交上去", eff:{merit:6,network:5,health:-3},
      msg:"材料上会，一次通过。\n\n后来它被印在了年度汇编里，署的是单位的名字。\n\n你偶尔翻到那一页，能准确指出哪一句原来是什么样子。也只有你能。" },
    { t:"把自己那几句加回去一句，赌一下", cost:1, eff:{merit:9,network:-6},
      msg:"你加回去的那一句，是全篇唯一有人记住的一句。\n\n领导在会上念到它的时候停顿了半秒，说：这句写得有点意思。\n\n散会后主任把你叫过去，说：以后改稿别自作主张。语气不重，但他记住了。" },
    { t:"问主任：前面六稿到底差在哪儿", cost:1, eff:{merit:4,network:8},
      fn:s=>{ s.ability += 3; },
      msg:"主任愣了一下，把七稿都摊开在桌上，一句一句给你讲了四十分钟。\n\n他讲的不是文字，是每一句话背后谁会看、看了会怎么想。\n\n这四十分钟顶你自己写四年。" },
  ]},

{ id:"mingzi", w:10, cond:s=>s.rank<=1 && s.age<=28, once:true, tag:"办公室",
  title:"三百份",
  text:`你起草的会议材料印了三百份，已经摆到了会议室每个座位上。\n\n散会前十分钟你才发现：封面上局长的名字，有一个字打错了。\n\n离开会还有四十分钟。`,
  opts:[
    { t:"一个人偷偷全部换掉", cost:2, eff:{health:-5,network:4,merit:3},
      msg:"你一个人跑了两趟印刷室，抱着三百份材料在楼道里跑，衬衫全湿了。\n\n开会时没有一个人知道发生过什么。\n\n这件事你谁也没说。很多年后你带新人，看到他们慌成一团的样子，你才明白当年自己也没那么了不起——只是运气好。" },
    { t:"报告主任，请他定", cost:1, eff:{network:7,merit:-3},
      msg:"主任骂了你一句，然后叫了四个人一起换。\n\n十五分钟解决。\n\n他后来跟别人提起这事：那小子还行，知道捅出来比捂着强。这句话比那顿骂值钱多了。" },
    { t:"赌没人看封面", eff:{merit:-9,network:-7,risk:3},
      msg:"没人看封面。\n\n除了局长。他把材料翻过来看了两秒，什么也没说。\n\n那两秒里会议室很安静。你后来做过很多次汇报，每一次在念到自己名字之前，都会先把封面看一遍。" },
  ]},

{ id:"zuowei", w:10, cond:s=>s.rank<=1 && s.age<=29, once:true, tag:"办公室",
  title:"位置",
  text:`第一次跟着领导下县里。三个人，一辆车。\n\n司机开门等着，主任站在车边跟你说话，没有要上车的意思。\n\n副驾、后排右、后排左。你站在那儿，忽然发现这道题你没学过。`,
  opts:[
    { t:"坐副驾", eff:{network:8,merit:2},
      fn:s=>{ s.ability += 2; },
      msg:"你拉开副驾的门坐了进去。\n\n一路上你负责跟司机说话、看导航、下车先开后门。\n\n这是对的。没有人教过你，但你后来发现，这种事从来没有人教，只有做对和做错两种人。" },
    { t:"坐后排，跟主任一起", eff:{network:-8},
      msg:"你坐进了后排。\n\n主任没说什么，一路上跟你聊得挺好。\n\n回来第二天，办公室的老同志端着杯子路过你桌边，很随意地说了一句：下回坐前面。然后就走了。\n\n你脸红了一下午。" },
    { t:"问一句：我坐哪儿合适", eff:{network:5,merit:-2},
      msg:"你问出口的瞬间就后悔了。\n\n主任笑了，说：坐前面。\n\n没有人笑话你。但从那天起，你开始留意所有这类不写在纸上的东西——比材料多得多，也比材料要紧得多。" },
  ]},

{ id:"chuanzhen", w:10, cond:s=>s.rank<=1 && s.age<=29, once:true, tag:"工作",
  title:"凌晨三点的传真",
  text:`你在值夜班。凌晨三点零几分，传真机响了。\n\n是市里下来的一份通知，标着「特急」，要求六点前反馈。\n\n主任的手机你有。他昨天喝到很晚。`,
  opts:[
    { t:"打电话叫醒他", eff:{network:-4,merit:6},
      msg:"响到第七声他接了，声音很哑。听完说了句「知道了」，挂了。\n\n二十分钟后他到了单位，头发是湿的。\n\n事情办成了。他没有谢你，但从那以后，凡是夜班，他都排你。这算是一种承认。" },
    { t:"自己先把能办的办了，六点再叫他", cost:2, eff:{merit:9,health:-6,network:4},
      fn:s=>{ s.ability += 3; },
      msg:"你查文件、翻台账、打了四个电话吵醒了三个人，五点四十把稿子做完了。\n\n六点主任到，看了两分钟，签字。\n\n他在车上问你：这稿谁做的。你说我。他「嗯」了一声，没再说话。\n\n那一声「嗯」你记了很久。" },
    { t:"压到早上再说", eff:{merit:-11,risk:4},
      msg:"你把传真压在桌上，眯了两个小时。\n\n七点主任进门，看了一眼，脸色变了。\n\n最后事情没出大问题。但「特急」这两个字的分量，你是用这一次学会的。" },
  ]},

{ id:"xiaxiang", w:11, cond:s=>s.rank<=1 && s.age<=30, once:true, tag:"工作",
  title:"第一次下乡",
  text:`跟着下村。老支书把你让到堂屋，倒了一杯茶，茶叶是从一个铁盒里抓出来的。\n\n他问你多大，哪儿人，考了几年。\n\n然后他说：你们上面来的，我这辈子见过一百多个。`,
  opts:[
    { t:"认真听他讲完村里的事", cost:1, eff:{merit:7,network:4,health:-3},
      fn:s=>{ s.ability += 3; },
      msg:"他讲了两个多小时，从九八年那场水讲到去年的低保名额。\n\n你记了满满七页。回去以后你把那七页整理成了一份材料，没人要，你自己留着。\n\n三年后有个项目卡住了，你从抽屉里翻出那七页，一句话解决了问题。" },
    { t:"客气两句，赶下一个点", eff:{merit:3,network:5},
      msg:"你说了几句场面话，喝了半杯茶，走了。\n\n那天你们跑了六个村，材料上写「实地走访六个行政村」。\n\n这句话是真的。它只是没有告诉别人，六个村加起来你待了不到三个小时。" },
    { t:"问他：那一百多个里，有几个后来还回来过", eff:{merit:5,network:7,family:-2},
      msg:"老支书没马上回答，起身给你续了半杯水。\n\n他说：两个。一个是来查账的，一个是来看他妈的。\n\n这句话你后来讲给很多人听过。没有一个人接得上话。" },
  ]},

{ id:"qinqi", w:10, cond:s=>s.age<=30 && s.rank<=1, once:true, tag:"生活",
  title:"你是干什么的",
  text:`过年回家，一桌子亲戚。有人问：你现在到底是干什么的？\n\n你张嘴想解释，发现自己没法用一句话说清楚。\n\n你爸抢在你前面替你答了：在政府上班。\n\n满桌人「哦」了一声，气氛忽然好了起来。`,
  opts:[
    { t:"顺着往下说，讲点他们爱听的", eff:{family:8,network:3},
      msg:"你讲了两个能听懂的段子。你爸一直在笑，还给你添了两次酒。\n\n那天晚上他喝多了，跟你妈说：这小子出息了。\n\n你没纠正他。你知道他说的「出息」，跟你自己心里的完全是两回事，但那天晚上没必要说。" },
    { t:"认真解释你实际在干什么", eff:{family:-4,merit:2},
      msg:"你讲了三分钟，从科室职能讲到手头那个报表。\n\n讲到一半你就发现所有人都在看手机。\n\n你爸打断你，说：吃菜吃菜。他不是不想听，他是替你难堪。" },
    { t:"喝一口，说：干活的", eff:{family:4,health:-2},
      fn:s=>{ s.flags.qinqiHumble = true; },
      msg:"你说完这三个字，二舅笑了一声，说：谦虚。\n\n没有人再追问。\n\n后来的很多年，每一次有人问起你是干什么的，你的回答都比上一次更短。" },
  ]},

{ id:"baobao", w:9, cd:5, cond:s=>s.rank<=1 && s.age<=31, tag:"办公室",
  title:"包",
  text:s=>{
    const t = nth("baobao");
    if(t<=1) return `散会了，领导起身往外走。他的包还在桌上。\n\n没有人看你，但你能感觉到，办公室老刘的眼神在那个包和你之间来回了一次。`;
    if(t===2) return `又是散会。这次你不用等老刘的眼神了，手已经先伸出去了。\n\n伸到一半你愣了一下——什么时候变成条件反射的，你自己也说不清。`;
    return `你已经知道包该放在哪一侧、什么时候递、什么时候不递。\n\n今天散会，你身后那个新来的孩子站在原地没动。\n\n你看了他一眼。你完全知道自己这一眼是什么意思，这让你不太舒服。`;
  },
  opts:[
    { t:"拿起来跟上去", eff:{network:6,merit:-2},
      msg:"你拎着包走在他后面半步。\n\n他一路没回头，到电梯口才随口说了句：小张挺细心。\n\n这句话很轻。但在这个楼里，很多人一辈子也没听到过一句。" },
    { t:"当没看见", eff:{network:-5,merit:2,health:2},
      msg:"你收拾自己的本子走了。\n\n老刘绕过去把包拎上了。\n\n没有人说什么。只是从那以后，出门的场合渐渐都不叫你了——不是惩罚，是没必要。" },
    { t:"提醒一句：领导，您包", eff:{network:2,merit:3},
      msg:"他回头「哎」了一声，自己拿了。\n\n这没什么错。\n\n只是老刘后来跟你说了一句：有些活，不是替他干，是替你自己站个位置。你当时没听懂，很多年后才懂。" },
  ]},

{ id:"tuanjian", w:9, cd:6, cond:s=>s.rank<=2 && s.age<=32, tag:"生活",
  title:"团建",
  text:s=>{
    const t = nth("tuanjian");
    if(t<=1) return `单位年会，工会主席点名要新人出个节目。\n\n你会的东西里，没有一样适合在这种场合表演。\n\n距离年会还有四天。`;
    if(t===2) return `又到年会。工会主席这次没点名，直接把节目单递给你：新人那块你统筹一下。\n\n你看了看名单，忽然理解了当年点你名的人。`;
    return `年会节目单上，你的名字在最后一行：领导讲话。\n\n你写了三百字，念了两分半。台下有个孩子在偷偷看手机。\n\n你当年也是那个看手机的人。`;
  },
  opts:[
    { t:"硬着头皮上，唱一首", cost:1, eff:{network:9,family:-2,health:-2},
      msg:"你唱跑了两处调，中间忘了一句词，是台下有人替你接上的。\n\n效果出奇地好——不是因为唱得好，是因为大家喜欢看一个平时那么正经的人出丑。\n\n那之后单位里所有人都记住了你的名字。这比任何一份材料都快。" },
    { t:"报个集体节目，把新人都拉上", cost:2, eff:{network:12,merit:3,health:-3},
      msg:"你组织了七个人，排了个不知道该叫什么的东西，排了四个晚上。\n\n演出效果一般，但那七个人从此跟你熟了。\n\n十年后他们分散在六个部门。你需要打听什么事的时候，从来不缺电话。" },
    { t:"推掉，说自己实在不会", eff:{network:-7,family:4,health:3},
      msg:"你说了三遍「真的不会」，工会主席也就不勉强了。\n\n年会那晚你坐在最后一桌，吃得很饱，八点半就回家了。\n\n那年年底评先进，有一栏叫「集体活动参与度」。你才知道还有这么一栏。" },
  ]},

{ id:"tianliang", w:9, cd:7, cond:s=>s.rank<=1 && s.age<=32, tag:"工作",
  title:"天亮",
  text:s=>{
    const t = nth("tianliang");
    if(t<=1) return `连着第三个通宵。窗外从黑到灰再到白，你第一次看清楚办公楼对面那栋楼是什么颜色。\n\n八点整，主任来了，说：那个材料不用了，方案换了。`;
    return `又一次通宵。你现在知道对面那栋楼是灰蓝色的。\n\n八点整，主任推门进来，看了一眼你桌上那摞纸，说了句：辛苦了。\n\n他没说用不用。你也没问。`;
  },
  opts:[
    { t:"什么也没说，回去补觉", eff:{health:-8,merit:2},
      msg:"你在椅子上睡了四十分钟，醒来接着上班。\n\n这份材料你留了备份，存在一个叫「废稿」的文件夹里。\n\n那个文件夹后来有一百多个文件。你一次也没打开过，但你一直没删。" },
    { t:"问一句：为什么不早说", eff:{merit:4,network:-9,health:-6},
      msg:"主任看了你一会儿，说：因为我也是今天早上才知道的。\n\n他说这话的时候没有生气，这让你更难受。\n\n你后来当了主任，也说过一模一样的话。" },
    { t:"把废稿改一改，投了内刊", cost:1, eff:{merit:8,network:3,health:-4},
      fn:s=>{ s.ability += 2; },
      msg:"你花了两个晚上把它改成一篇署你名字的调研文章，发在省里的内刊上。\n\n三个月后有位副厅长在会上提了一句：那篇东西写得不错，谁写的？\n\n没有人答上来。但办公室主任记住了，他去查了。" },
  ]},

{ id:"tongpi", w:10, cd:6, cond:s=>s.rank<=1 && s.age<=31, tag:"生活",
  title:"同批",
  text:s=>{
    const t = nth("tongpi");
    if(t<=1) return `同一批上岸的十四个人，有个微信群。\n\n今天群里有人发了张照片：市委大院门口，配文「报到」。是借调走的那个。\n\n下面刷了一串恭喜。你也发了一个。`;
    if(t===2) return `群里今天少了一个人——那个考回老家的，说要退群了，说没什么好聊的。\n\n剩下的十三个人里，有六个已经很久不说话了。\n\n你翻了翻聊天记录，最近三个月一共二十一条，其中十四条是转发链接。`;
    return `群还在，名字没改过。\n\n上一次有人说话是去年，有人的父亲去世，大家发了一排蜡烛。\n\n你偶尔会点开看看谁的头像换了。也就是看看。`;
  },
  opts:[
    { t:"也想办法动一动", cost:2, eff:{merit:5,network:6,health:-4,family:-3},
